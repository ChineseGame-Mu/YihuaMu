<!doctype html><html><head><meta charset="utf-8"><title>掼蛋多人测试</title><style>body{font-family:sans-serif;max-width:900px;margin:40px auto;background:#174f2b;color:white}button,input,select{font-size:18px;padding:8px;margin:5px}.box{background:#fff;color:#222;padding:20px;border-radius:10px}#log{white-space:pre-wrap;background:#111;color:#9f9;padding:12px;min-height:220px}</style></head><body><h1>掼蛋多人测试桌</h1><div class="box"><div>房间 <input id="room" value="test1"> 名字 <input id="name" value="玩家1"><button onclick="join()">加入</button></div><div>人数 <select id="count"><option>4</option><option>6</option><option>8</option><option>10</option><option>12</option><option>14</option></select><button onclick="start()">开始</button><button onclick="passTurn()">Pass</button></div><p>这是独立测试入口，不影响升级/找朋友。</p><div id="log"></div></div><script>const log=document.getElementById('log');const proto=location.protocol==='https:'?'wss':'ws';const ws=new WebSocket(proto+'://'+location.host+'/api/guandan');ws.onopen=()=>write('已连接掼蛋服务器');ws.onmessage=e=>write('服务器: '+e.data);ws.onerror=()=>write('连接错误');function write(s){log.textContent+=s+'\n'}function send(o){if(ws.readyState!==1)return write('尚未连接');ws.send(JSON.stringify(o));write('发送: '+JSON.stringify(o))}function join(){send({type:'join',room:room.value,name:name.value})}function start(){send({type:'start',player_count:Number(count.value)})}function passTurn(){send({type:'pass'})}</script></body></html>
