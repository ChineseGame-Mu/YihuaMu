<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>掼蛋多人测试</title>
  <style>
    *{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:1180px;margin:24px auto;padding:0 16px;background:#174f2b;color:white}h1{text-align:center}.box{background:#fff;color:#222;padding:20px;border-radius:14px;box-shadow:0 8px 24px #0004}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}button,input,select{font-size:17px;padding:8px 10px;border-radius:7px;border:1px solid #aaa}button{cursor:pointer}.status{padding:10px 12px;background:#eef7ee;border-radius:8px;margin:12px 0}.hand-title{font-size:20px;font-weight:700;margin:18px 0 8px}.hand{display:flex;flex-wrap:wrap;gap:7px;min-height:132px;padding:12px;background:#0f6b35;border-radius:12px}.card{position:relative;width:74px;height:108px;border:2px solid #ddd;border-radius:9px;background:#fff;color:#111;box-shadow:0 3px 7px #0005;cursor:pointer;user-select:none;transition:.12s transform,.12s border}.card:hover{transform:translateY(-4px)}.card.selected{transform:translateY(-12px);border:3px solid #ffd000}.card.red{color:#d71920}.corner{position:absolute;left:7px;top:5px;font-size:20px;font-weight:800;line-height:20px}.suit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:43px}.joker{display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;font-weight:900;padding:8px}.actions{text-align:center;margin:12px}.actions button{font-size:19px;padding:10px 24px}.last-play{display:flex;flex-wrap:wrap;gap:5px;padding:8px;min-height:45px}.mini-card{font-size:20px;background:white;color:#111;border-radius:5px;padding:4px 7px;border:1px solid #bbb}.mini-card.red{color:#d71920}#log{white-space:pre-wrap;background:#111;color:#9f9;padding:12px;min-height:130px;max-height:240px;overflow:auto;border-radius:8px;font-size:13px}@media(max-width:600px){.card{width:58px;height:88px}.suit{font-size:34px}.corner{font-size:17px}.hand{gap:4px;padding:8px}}
  </style>
</head>
<body>
  <h1>掼蛋多人测试桌</h1>
  <div class="box">
    <div class="controls">房间 <input id="room" value="test1"> 名字 <input id="name" value="玩家1"><button onclick="joinRoom()">加入</button></div>
    <div class="controls">人数 <select id="count"><option>4</option><option>6</option><option>8</option><option>10</option><option>12</option><option>14</option></select><button onclick="startGame()">开始</button></div>
    <div id="status" class="status">正在连接服务器…</div>
    <div><strong>桌面上一手：</strong><span id="lastPlayer">暂无</span><div id="lastPlay" class="last-play"></div></div>
    <div class="hand-title">我的手牌 <span id="handCount"></span></div>
    <div id="hand" class="hand"></div>
    <div class="actions"><button onclick="playSelected()">出牌</button><button onclick="passTurn()">不要 / Pass</button><button onclick="clearSelection()">取消选择</button></div>
    <details><summary>调试日志</summary><div id="log"></div></details>
  </div>
<script>
const log=document.getElementById('log'),handEl=document.getElementById('hand'),statusEl=document.getElementById('status'),lastPlayEl=document.getElementById('lastPlay'),lastPlayerEl=document.getElementById('lastPlayer'),handCountEl=document.getElementById('handCount');
let myHand=[],selected=new Set(),mySeat=null,currentTurn=null;
const proto=location.protocol==='https:'?'wss':'ws';
const ws=new WebSocket(proto+'://'+location.host+'/api/guandan');
ws.onopen=()=>{write('已连接掼蛋服务器');statusEl.textContent='服务器已连接，请加入房间';};
ws.onmessage=e=>{write('服务器: '+e.data);let m;try{m=JSON.parse(e.data)}catch(_){return}handleMessage(m)};
ws.onerror=()=>{write('连接错误');statusEl.textContent='连接服务器失败';};
function write(s){log.textContent+=s+'\n';log.scrollTop=log.scrollHeight}
function send(o){if(ws.readyState!==1)return write('尚未连接');ws.send(JSON.stringify(o));write('发送: '+JSON.stringify(o))}
function joinRoom(){send({type:'join',room:document.getElementById('room').value,name:document.getElementById('name').value})}
function startGame(){send({type:'start',player_count:Number(document.getElementById('count').value)})}
function passTurn(){send({type:'pass'})}
function clearSelection(){selected.clear();renderHand()}
function playSelected(){const indexes=[...selected].sort((a,b)=>a-b);if(!indexes.length)return alert('请先选择要出的牌');send({type:'play',card_indexes:indexes});selected.clear()}
function handleMessage(m){
  if(m.type==='connected'){statusEl.textContent='已连接：'+m.protocol}
  if(m.type==='joined'){mySeat=m.seat;statusEl.textContent='已加入房间，座位 '+(m.seat+1)}
  if(m.type==='waiting'){statusEl.textContent='等待玩家：'+m.players.join('、')+'（'+m.players.length+'/'+m.maximum_players+'）'}
  if(m.type==='started'){statusEl.textContent='游戏开始：'+m.player_count+' 人，每人 '+m.cards_per_player+' 张'}
  if(m.type==='hand'){myHand=m.cards||[];selected.clear();renderHand()}
  if(m.type==='state'){currentTurn=m.turn;statusEl.textContent='当前轮到座位 '+(m.turn+1)+(m.turn===mySeat?'（轮到你）':'')+' ｜ 手牌数：'+m.hand_counts.join(' / ');renderLastPlay(m.last_play||[],m.last_player)}
  if(m.type==='error'){statusEl.textContent='错误：'+m.message}
}
const rankMap={Two:'2',Three:'3',Four:'4',Five:'5',Six:'6',Seven:'7',Eight:'8',Nine:'9',Ten:'10',Jack:'J',Queen:'Q',King:'K',Ace:'A'};
const suitMap={Clubs:'♣',Diamonds:'♦',Hearts:'♥',Spades:'♠'};
function normalizeCard(card){
  if(card&&card.Suited){const s=card.Suited.suit,r=card.Suited.rank;return{rank:rankMap[r]||r,suit:suitMap[s]||s,red:s==='Hearts'||s==='Diamonds',joker:false}}
  if(card&&card.Joker){const big=card.Joker==='Big';return{rank:big?'大王':'小王',suit:big?'🃏':'JOKER',red:big,joker:true}}
  return{rank:'?',suit:'',red:false,joker:false};
}
function cardNode(card,index,mini=false){const c=normalizeCard(card),el=document.createElement('div');if(mini){el.className='mini-card'+(c.red?' red':'');el.textContent=c.joker?c.rank:c.suit+c.rank;return el}el.className='card'+(c.red?' red':'')+(selected.has(index)?' selected':'');if(c.joker){el.classList.add('joker');el.textContent=c.rank+'\n'+c.suit}else{el.innerHTML='<div class="corner">'+c.rank+'<br>'+c.suit+'</div><div class="suit">'+c.suit+'</div>'}el.onclick=()=>{selected.has(index)?selected.delete(index):selected.add(index);renderHand()};return el}
function renderHand(){handEl.innerHTML='';myHand.forEach((card,i)=>handEl.appendChild(cardNode(card,i)));handCountEl.textContent=myHand.length?'（'+myHand.length+'张）':''}
function renderLastPlay(cards,player){lastPlayEl.innerHTML='';lastPlayerEl.textContent=player==null?'暂无':'座位 '+(player+1);cards.forEach(card=>lastPlayEl.appendChild(cardNode(card,0,true)))}
</script>
</body>
</html>
