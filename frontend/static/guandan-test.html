<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>掼蛋多人测试</title>
<style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:1180px;margin:24px auto;padding:0 16px;background:#174f2b;color:white}h1{text-align:center}.box{background:#fff;color:#222;padding:20px;border-radius:14px}.controls,.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:10px 0}button,input,select{font-size:17px;padding:8px 10px;border-radius:7px;border:1px solid #aaa}button:disabled{opacity:.45}.status,.tribute{padding:10px 12px;background:#eef7ee;border-radius:8px;margin:10px 0}.tribute{background:#fff4c2;border:2px solid #e5b400;font-weight:800}.team-levels,.players{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.team-level,.player-chip{padding:7px 10px;background:#f4f4f4;border-radius:9px}.player-chip.me{border:2px solid #16803d}.seat-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px}.seat-note{font-size:14px;color:#555}.level-banner{padding:10px;background:#fff4c2;border-radius:9px;font-weight:800}.table-title,.hand-title{font-size:20px;font-weight:700;margin:16px 0 8px}.table-plays,.hand{display:flex;flex-wrap:wrap;gap:7px;min-height:100px;padding:12px;background:#126b38;border-radius:12px}.table-play{background:#f6f1df;border-radius:10px;padding:8px;color:#222}.card{position:relative;width:74px;height:108px;border:2px solid #ddd;border-radius:9px;background:#fff;color:#111;cursor:pointer}.card.selected{transform:translateY(-10px);border:3px solid #ffd000}.card.red,.mini-card.red{color:#d71920}.corner{position:absolute;left:7px;top:5px;font-size:20px;font-weight:800}.suit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:43px}.joker{display:flex;align-items:center;justify-content:center;font-weight:900}.mini-card{background:white;padding:4px;border-radius:5px}#log{white-space:pre-wrap;background:#111;color:#9f9;padding:10px;max-height:220px;overflow:auto}</style></head>
<body><h1>掼蛋多人测试桌</h1><div class="box">
<div class="controls">房间 <input id="room" value="test1"> 名字 <input id="name" value="玩家1"><button onclick="joinRoom()">加入</button></div>
<div class="controls">人数 <select id="count"><option>4</option><option>6</option><option>8</option><option>10</option><option>12</option><option>14</option></select><button onclick="startGame()">开始</button></div>
<div id="status" class="status">正在连接服务器…</div><div class="team-levels"><div class="team-level">A队：打 <span id="teamALevel">2</span></div><div class="team-level">B队：打 <span id="teamBLevel">2</span></div></div>
<div class="level-banner">本局级牌：<span id="levelCard">2</span>（仅次于大王、小王）</div><div id="tributeBox" class="tribute" hidden></div><div id="gameResult" class="status">比赛进行中</div><div id="promotionResult" class="status">上一局升级：暂无</div>
<strong>当前参加玩家：</strong><div id="players" class="players">尚未加入</div>
<div class="seat-controls"><strong>换位：</strong><button id="moveLeftBtn" onclick="moveSeat(-1)" disabled>← 向前换位</button><button id="moveRightBtn" onclick="moveSeat(1)" disabled>向后换位 →</button><span class="seat-note">开局前可与相邻玩家交换座位；所有玩家会同步看到新座位。</span></div>
<div id="finishOrder" class="status">本局出完顺序：暂无</div>
<div class="table-title">桌面本轮所有已出牌</div><div id="tablePlays" class="table-plays">暂无出牌</div><div class="actions"><button id="endRoundBtn" onclick="endRound()" disabled>结束本轮并开始下一轮</button></div>
<div class="hand-title">我的手牌 <span id="handCount"></span></div><div id="hand" class="hand"></div>
<div class="actions"><button id="tributeBtn" onclick="submitTribute()" hidden>进贡所选牌</button><button id="returnBtn" onclick="submitReturn()" hidden>还贡所选牌</button><button id="playBtn" onclick="playSelected()">出牌</button><button id="passBtn" onclick="passTurn()">不要 / Pass</button><button onclick="clearSelection()">取消选择</button></div>
<details><summary>调试日志</summary><div id="log"></div></details></div>
<script>
const $=id=>document.getElementById(id),log=$('log'),handEl=$('hand'),statusEl=$('status'),tablePlaysEl=$('tablePlays'),handCountEl=$('handCount'),endRoundBtn=$('endRoundBtn'),playBtn=$('playBtn'),passBtn=$('passBtn'),playersEl=$('players'),tributeBox=$('tributeBox'),tributeBtn=$('tributeBtn'),returnBtn=$('returnBtn'),moveLeftBtn=$('moveLeftBtn'),moveRightBtn=$('moveRightBtn');
let myHand=[],selected=new Set(),mySeat=null,joinedName=null,playerNames=[],gameStarted=false,currentLevel='Two',teamLevels={team_a:'Two',team_b:'Two'},previousTeamLevels=null,matchWinner=null,pendingTribute=null,tributeResisted=false;
const ws=new WebSocket('wss://chinesegame-yihua.onrender.com/api/guandan');ws.onopen=()=>statusEl.textContent='服务器已连接，请加入房间';ws.onmessage=e=>{write('服务器: '+e.data);try{handleMessage(JSON.parse(e.data))}catch(_){}};function write(s){log.textContent+=s+'\n';log.scrollTop=log.scrollHeight}function send(o){if(ws.readyState===1){ws.send(JSON.stringify(o));write('发送: '+JSON.stringify(o))}}
function joinRoom(){joinedName=$('name').value;send({type:'join',room:$('room').value,name:joinedName})}function startGame(){send({type:'start',player_count:Number($('count').value)})}function passTurn(){if(!pendingTribute&&!matchWinner)send({type:'pass'})}function endRound(){if(!pendingTribute&&!matchWinner)send({type:'end_round'})}function clearSelection(){selected.clear();renderHand()}function moveSeat(delta){syncMySeat();if(gameStarted||mySeat===null)return;const to=mySeat+delta;if(to<0||to>=playerNames.length)return;send({type:'reorder_players',order:[mySeat,to]})}function syncMySeat(){if(joinedName!==null){const i=playerNames.indexOf(joinedName);if(i>=0)mySeat=i}renderSeatControls()}function renderSeatControls(){const canMove=!gameStarted&&mySeat!==null;moveLeftBtn.disabled=!canMove||mySeat<=0;moveRightBtn.disabled=!canMove||mySeat>=playerNames.length-1}
function oneSelected(){const a=[...selected];if(a.length!==1){alert('进贡/还贡时请只选择一张牌');return null}return a[0]}function submitTribute(){const i=oneSelected();if(i!==null){send({type:'tribute_card',card_index:i});selected.clear()}}function submitReturn(){const i=oneSelected();if(i!==null){send({type:'return_tribute',card_index:i});selected.clear()}}function playSelected(){if(pendingTribute||matchWinner)return;const indexes=[...selected].sort((a,b)=>a-b);if(!indexes.length)return alert('请先选择要出的牌');send({type:'play',card_indexes:indexes});selected.clear()}
function roles(plan){if(!plan)return{g:[],r:[]};if(plan.Single)return{g:[plan.Single.giver],r:[plan.Single.receiver]};if(plan.Double)return{g:plan.Double.givers||[],r:plan.Double.receivers||[]};return{g:[],r:[]}}
function renderTribute(){if(tributeResisted){tributeBox.hidden=false;tributeBox.textContent='🃏 本局已抗贡，直接开始正常出牌';tributeBtn.hidden=true;returnBtn.hidden=true;return}if(!pendingTribute){tributeBox.hidden=true;tributeBtn.hidden=true;returnBtn.hidden=true;return}const x=roles(pendingTribute),isG=x.g.includes(mySeat),isR=x.r.includes(mySeat);tributeBox.hidden=false;tributeBox.textContent=isG?'轮到你进贡：请选择一张贡牌并点击“进贡所选牌”':isR?'你是受贡方；贡牌提交完成后请选择一张牌还贡':'正在进行进贡/还贡，请等待相关玩家完成';tributeBtn.hidden=!isG;returnBtn.hidden=!isR}
function handleMessage(m){if(m.type==='connected')statusEl.textContent='已连接：'+m.protocol;if(m.type==='joined'){mySeat=m.seat;gameStarted=false;renderPlayers()}if(m.type==='waiting'){playerNames=m.players||[];gameStarted=false;syncMySeat();renderPlayers()}if(m.type==='started'){gameStarted=true;renderSeatControls()}if(m.type==='hand'){myHand=m.cards||[];selected.clear();renderHand()}if(m.type==='state'){playerNames=m.players||playerNames;gameStarted=true;syncMySeat();currentLevel=m.level||currentLevel;teamLevels=m.team_levels||teamLevels;matchWinner=m.match_winner||null;pendingTribute=m.pending_tribute||null;tributeResisted=!!m.tribute_resisted;renderPlayers();renderLevels();renderTribute();renderFinish(m.finish_order||[]);renderTable(m.table_plays||[]);const blocked=!!pendingTribute||!!matchWinner;playBtn.disabled=blocked;passBtn.disabled=blocked;endRoundBtn.disabled=blocked||!m.trick_complete;statusEl.textContent=matchWinner?'比赛已经结束':pendingTribute?'当前处于进贡/还贡阶段':'当前轮到 '+playerLabel(m.turn)+(m.turn===mySeat?'（轮到你）':'')+' ｜ 手牌数：'+(m.hand_counts||[]).join(' / ')}if(m.type==='error')statusEl.textContent='错误：'+m.message}
function playerLabel(i){return playerNames[i]?playerNames[i]+'（座位 '+(i+1)+'）':'座位 '+(i+1)}function renderPlayers(){syncMySeat();playersEl.innerHTML='';playerNames.forEach((n,i)=>{const e=document.createElement('span');e.className='player-chip'+(i===mySeat?' me':'');e.textContent=(i+1)+'号 '+n+(i===mySeat?'（我）':'');playersEl.appendChild(e)});renderSeatControls()}
const rankMap={Two:'2',Three:'3',Four:'4',Five:'5',Six:'6',Seven:'7',Eight:'8',Nine:'9',Ten:'10',Jack:'J',Queen:'Q',King:'K',Ace:'A'},suitMap={Clubs:'♣',Diamonds:'♦',Hearts:'♥',Spades:'♠'};function renderLevels(){$('levelCard').textContent=rankMap[currentLevel]||currentLevel;$('teamALevel').textContent=rankMap[teamLevels.team_a]||teamLevels.team_a;$('teamBLevel').textContent=rankMap[teamLevels.team_b]||teamLevels.team_b}function renderFinish(a){$('finishOrder').textContent='本局出完顺序：'+(a.length?a.map((s,i)=>(i+1)+'、'+playerLabel(s)).join('　'):'暂无')}
function norm(c){if(c&&c.Suited){const s=c.Suited.suit,r=c.Suited.rank;return{r:rankMap[r]||r,s:suitMap[s]||s,red:s==='Hearts'||s==='Diamonds',j:false}}if(c&&c.Joker)return{r:c.Joker==='Big'?'大王':'小王',s:'🃏',red:c.Joker==='Big',j:true};return{r:'?',s:'',red:false,j:false}}function cardNode(card,i,mini=false){const c=norm(card),e=document.createElement('div');if(mini){e.className='mini-card'+(c.red?' red':'');e.textContent=c.s+c.r;return e}e.className='card'+(c.red?' red':'')+(selected.has(i)?' selected':'');e.innerHTML=c.j?c.r+' '+c.s:'<div class="corner">'+c.r+'<br>'+c.s+'</div><div class="suit">'+c.s+'</div>';e.onclick=()=>{if(matchWinner)return;selected.has(i)?selected.delete(i):selected.add(i);renderHand()};return e}function renderHand(){handEl.innerHTML='';myHand.forEach((c,i)=>handEl.appendChild(cardNode(c,i)));handCountEl.textContent=myHand.length?'（'+myHand.length+'张）':''}function renderTable(a){tablePlaysEl.innerHTML='';if(!a.length){tablePlaysEl.textContent='暂无出牌';return}a.forEach(p=>{const g=document.createElement('div');g.className='table-play';g.append(playerLabel(p.player)+' 已出 ');(p.cards||[]).forEach(c=>g.appendChild(cardNode(c,0,true)));tablePlaysEl.appendChild(g)})}renderLevels();renderSeatControls();
</script></body></html>
