name: Format Yihua hand rules once

on:
  push:
    branches:
      - feature/yihua-game-hand-rules-20260826
    paths:
      - ".github/workflows/format-yihua-hand-rules-once-20260826.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/yihua-game-hand-rules-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: yihua-game
        run: npm install
      - name: Apply Prettier 3.4.1
        working-directory: yihua-game
        run: npm run format
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yihua-game/src/core/hand.ts yihua-game/src/core/opening-draw.ts yihua-game/src/core/level-rules.ts yihua-game/src/core/play-state.ts yihua-game/test/hand.test.ts yihua-game/test/hand-edge.test.ts yihua-game/test/level-rules.test.ts yihua-game/test/play-state.test.ts
          git diff --cached --quiet || git commit -m "style(yihua-game): apply exact Prettier output"
          git push

