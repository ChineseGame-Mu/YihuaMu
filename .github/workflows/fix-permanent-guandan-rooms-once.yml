name: Fix permanent Guandan rooms once

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
    paths:
      - ".github/workflows/fix-permanent-guandan-rooms-once.yml"

permissions:
  contents: write

jobs:
  fix-permanent-rooms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanroom/yihua-game-20260826
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove time-bucket frontend mapping and make backend room identity permanent
        run: |
          python - <<'PY'
          from pathlib import Path

          frontend = Path("frontend/src/guandanCompatibilityAdapter.ts")
          text = frontend.read_text()
          old = '''const supportedPlayerCounts = [4, 6, 8, 10, 12, 14];
          const EVERGREEN_ROOM_BUCKET_MS = 2 * 60 * 60 * 1000;

          const evergreenBackendRoom = (logicalRoom: string): string => {
            const bucket = Math.floor(Date.now() / EVERGREEN_ROOM_BUCKET_MS);
            return `${logicalRoom}-evergreen-${bucket}`;
          };
          '''
          new = '''const supportedPlayerCounts = [4, 6, 8, 10, 12, 14];
          '''
          if old not in text:
              raise SystemExit("frontend evergreen block not found")
          text = text.replace(old, new, 1)
          text = text.replace('  const logicalRoom = room || message.room;\n', '', 1)
          text = text.replace('    room: evergreenBackendRoom(logicalRoom),', '    room: room || message.room,', 1)
          frontend.write_text(text)

          backend = Path("backend/src/guandan_handler.rs")
          text = backend.read_text()
          old = '''fn normalize_room_name(room: &str) -> String {
              room.trim().trim_end_matches('/').trim_end().to_string()
          }
          '''
          new = '''fn normalize_room_name(room: &str) -> String {
              // Public Guandan rooms are permanent. Never derive room identity from time.
              // Canonicalize the temporary evergreen aliases created by the old frontend
              // back to the fixed public room codes so refresh/reconnect stays in one room.
              let normalized = room.trim().trim_end_matches('/').trim_end();
              if let Some((base, _)) = normalized.split_once("-evergreen-") {
                  if matches!(base, "0001" | "0002" | "0003" | "0004") {
                      return base.to_string();
                  }
              }
              normalized.to_string()
          }
          '''
          if old not in text:
              raise SystemExit("backend normalize_room_name block not found")
          text = text.replace(old, new, 1)

          marker = '''#[cfg(test)]
          mod tests {
          '''
          test = '''#[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn public_room_names_are_permanent_and_time_independent() {
                  assert_eq!(normalize_room_name("0001"), "0001");
                  assert_eq!(normalize_room_name("0002/"), "0002");
                  assert_eq!(normalize_room_name("0003-evergreen-123"), "0003");
                  assert_eq!(normalize_room_name("0004-evergreen-999999"), "0004");
              }
          '''
          if marker in text:
              text = text.replace(marker, test, 1)
          backend.write_text(text)
          PY
      - name: Verify no three-hour gate remains in cleanroom source
        run: |
          if grep -RInE 'three-hour join window has closed|3-hour join|three hour join|join window has closed' backend frontend yihua-game; then
            echo "A time-based join gate still exists" >&2
            exit 1
          fi
      - name: Format touched files
        run: |
          npx prettier@3.4.1 --write frontend/src/guandanCompatibilityAdapter.ts
          cargo fmt --manifest-path backend/Cargo.toml -- backend/src/guandan_handler.rs || true
      - name: Commit permanent-room fix and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-permanent-guandan-rooms-once.yml
          git add frontend/src/guandanCompatibilityAdapter.ts backend/src/guandan_handler.rs
          git commit -m "fix(cleanroom): make public Guandan rooms permanent"
          git push origin HEAD:cleanroom/yihua-game-20260826
