name: Yihua Game Clean-room CI

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
    paths:
      - "yihua-game/**"
      - ".github/workflows/cleanroom-yihua-game.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yihua-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify Prettier 3.4.1
        run: npm run prettier:version
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build standalone server
        run: npm run build
      - name: Test
        run: npm test
