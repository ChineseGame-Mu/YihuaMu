name: Yihua Game Clean-room CI

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
    paths:
      - "yihua-game/**"
      - ".github/workflows/cleanroom-yihua-game.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yihua-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify Prettier 3.4.1
        run: npm run prettier:version
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build standalone server
        run: npm run build
      - name: Live HTTP and WebSocket smoke
        run: npm run smoke
      - name: Live gameplay transport smoke
        run: node scripts/smoke-gameplay-network.mjs
      - name: Live restart recovery smoke
        run: npm run smoke:restart
      - name: Hard-crash checkpoint recovery smoke
        run: node scripts/smoke-crash-recovery.mjs
      - name: WebSocket lifecycle soak smoke
        # Keep all supported even table sizes in the fast reconnect gate.
        env:
          SOAK_DURATION_MS: "1000"
          SOAK_PLAYER_COUNTS: "4,6,8,10,12,14"
          SOAK_RECONNECT_EVERY: "10"
        run: node scripts/soak-websocket.mjs
      - name: Test
        run: npm test
