name: Yihua Game Clean-room CI

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
      - cleanroom/ip-isolation-20260828
    paths:
      - "yihua-game/**"
      - ".github/workflows/cleanroom-yihua-game.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yihua-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify Prettier 3.4.1
        run: npx prettier@3.4.1 --version
      - name: Check formatting
        run: npx prettier@3.4.1 --check "src/**/*.ts" "test/**/*.ts"
      - name: Typecheck
        run: npm run typecheck
      - name: Build standalone server
        run: npm run build:server
      - name: Live HTTP and WebSocket smoke
        run: npm run smoke:live
      - name: Live gameplay transport smoke
        run: npm run smoke:gameplay
      - name: Live restart recovery smoke
        run: npm run smoke:restart
      - name: Hard-crash checkpoint recovery smoke
        run: npm run smoke:hard-crash
      - name: WebSocket lifecycle soak smoke
        env:
          SOAK_DURATION_MS: 1000
          SOAK_PLAYER_COUNTS: 4,6,8,10,12,14
          SOAK_RECONNECT_EVERY: 10
        run: npm run smoke:soak
      - name: Test
        run: npm test
