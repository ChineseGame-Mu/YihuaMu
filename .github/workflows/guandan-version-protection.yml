name: Guandan Homepage Production and Recovery Guard
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - qa/robot-ui-safe-integration-20261017-noon
concurrency:
  group: guandan-version-protection
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  verify-and-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Protect approved homepage and verify production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CREATE_BACKUP_TAG: ${{ github.event_name == 'push' }}
        run: bash qa/guandan-version-guard.sh
      - name: Save recoverable git bundle and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guandan-recovery-${{ github.sha }}
          path: qa-artifacts/guard/
          if-no-files-found: warn
          retention-days: 90
