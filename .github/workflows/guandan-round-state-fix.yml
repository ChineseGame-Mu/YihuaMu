name: Apply Guandan round-end state fix

on:
  push:
    branches:
      - fix/guandan-single-viewport-20260822

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[round-state-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch round-end state machine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/src/guandan_handler.rs')
          text = path.read_text()
          text = text.replace('''fn settle_and_redeal_if_complete(game: &mut GuandanGameState) -> Result<bool, &'static str> {\n    let active_players = game.hands.iter().filter(|hand| !hand.is_empty()).count();\n    if active_players > 0 || game.finish_order.is_empty() {\n        return Ok(false);\n    }\n\n    let player_count = game.hands.len();\n    if player_count != GUANDAN_PLAYER_COUNT {\n        return Err("Guandan settlement requires exactly four players");\n    }\n    if game.finish_order.len() != player_count {\n        return Err("Guandan settlement requires a complete finish order");\n    }\n    let previous_finish_order = game.finish_order.clone();\n''','''fn settle_and_redeal_if_complete(game: &mut GuandanGameState) -> Result<bool, &'static str> {\n    let player_count = game.hands.len();\n    if player_count != GUANDAN_PLAYER_COUNT {\n        return Err("Guandan settlement requires exactly four players");\n    }\n\n    if game.finish_order.len() == player_count - 1 {\n        let last_seat = (0..player_count)\n            .find(|seat| !game.finish_order.contains(seat))\n            .ok_or("unable to determine fourth place")?;\n        game.finish_order.push(last_seat);\n        game.hands[last_seat].clear();\n    }\n\n    let active_players = game.hands.iter().filter(|hand| !hand.is_empty()).count();\n    if active_players > 0 || game.finish_order.is_empty() {\n        return Ok(false);\n    }\n    if game.finish_order.len() != player_count {\n        return Err("Guandan settlement requires a complete finish order");\n    }\n    let previous_finish_order = game.finish_order.clone();\n''',1)
          text = text.replace('''    game.passes = 0;\n    game.trick_complete = false;\n    game.pending_tribute = None;\n''','''    game.passes = 0;\n    game.trick_complete = false;\n    game.last_trick_winner = None;\n    game.pending_tribute = None;\n''',1)
          text = text.replace('''                        if state.game.next_round_phase.is_none() {\n                            if let Some(hand) = seat.and_then(|seat| state.game.private_hand(seat))\n                            {\n                                send(\n                                    &tx,\n                                    &GuandanServerMessage::Hand {\n                                        cards: hand.to_vec(),\n                                    },\n                                );\n                            }\n                        }\n''','''                        match state.game.next_round_phase {\n                            None => {\n                                if let Some(hand) = seat.and_then(|seat| state.game.private_hand(seat))\n                                {\n                                    send(\n                                        &tx,\n                                        &GuandanServerMessage::Hand {\n                                            cards: hand.to_vec(),\n                                        },\n                                    );\n                                }\n                            }\n                            Some(GuandanNextRoundPhase::AwaitingShuffle) => {\n                                send(&tx, &GuandanServerMessage::Hand { cards: vec![] });\n                            }\n                            Some(GuandanNextRoundPhase::AwaitingDeal) => {}\n                        }\n''',1)
          text = text.replace('''                                if state.game.next_round_phase.is_none() {\n                                    if let Some(seat_sub) = seat_sub {\n                                        if let Some(hand) = state.game.private_hand(seat_sub) {\n                                            send(\n                                                &tx_sub,\n                                                &GuandanServerMessage::Hand {\n                                                    cards: hand.to_vec(),\n                                                },\n                                            );\n                                        }\n                                    }\n                                }\n''','''                                match state.game.next_round_phase {\n                                    None => {\n                                        if let Some(seat_sub) = seat_sub {\n                                            if let Some(hand) = state.game.private_hand(seat_sub) {\n                                                send(\n                                                    &tx_sub,\n                                                    &GuandanServerMessage::Hand {\n                                                        cards: hand.to_vec(),\n                                                    },\n                                                );\n                                            }\n                                        }\n                                    }\n                                    Some(GuandanNextRoundPhase::AwaitingShuffle) => {\n                                        send(\n                                            &tx_sub,\n                                            &GuandanServerMessage::Hand { cards: vec![] },\n                                        );\n                                    }\n                                    Some(GuandanNextRoundPhase::AwaitingDeal) => {}\n                                }\n''',1)
          text = text.replace('one_two_finish_waits_for_last_player_then_loser_shuffle','one_two_finish_auto_assigns_fourth_then_loser_shuffle',1)
          text = text.replace('''        assert!(!settle_and_redeal_if_complete(&mut game).unwrap());\n        assert_eq!(game.next_round_phase, None);\n        assert_eq!(game.team_levels.team_a, Rank::Two);\n\n        game.hands[3].clear();\n        game.finish_order.push(3);\n        assert!(settle_and_redeal_if_complete(&mut game).unwrap());\n''','''        assert!(settle_and_redeal_if_complete(&mut game).unwrap());\n        assert!(game.hands[3].is_empty());\n''',1)
          text = text.replace('one_three_finish_waits_for_last_player_then_loser_shuffle','one_three_finish_auto_assigns_fourth_then_loser_shuffle',1)
          text = text.replace('''        assert!(!settle_and_redeal_if_complete(&mut game).unwrap());\n        assert_eq!(game.next_round_phase, None);\n        assert_eq!(game.team_levels.team_a, Rank::Two);\n\n        game.hands[3].clear();\n        game.finish_order.push(3);\n        assert!(settle_and_redeal_if_complete(&mut game).unwrap());\n''','''        assert!(settle_and_redeal_if_complete(&mut game).unwrap());\n        assert!(game.hands[3].is_empty());\n''',1)
          path.write_text(text)
          PY
          cargo fmt --all
          cargo test -p shengji --bin shengji guandan_handler::tests
      - name: Commit state-machine fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/guandan_handler.rs
          git commit -m "fix(guandan): settle round after third finisher [round-state-fix]"
          git push
