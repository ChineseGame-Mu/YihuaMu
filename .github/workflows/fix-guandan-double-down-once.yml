name: Fix Guandan double-down round end once

on:
  push:
    branches:
      - fix/guandan-single-viewport-20260822

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[double-down-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch double-down settlement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/src/guandan_handler.rs')
          text = path.read_text()
          old = '''    if player_count != GUANDAN_PLAYER_COUNT { return Err("Guandan settlement requires exactly four players"); }\n    if game.finish_order.len() == player_count - 1 {\n'''
          new = '''    if player_count != GUANDAN_PLAYER_COUNT { return Err("Guandan settlement requires exactly four players"); }\n    if game.finish_order.len() == 2 {\n        let first = game.finish_order[0];\n        let second = game.finish_order[1];\n        if first % 2 == second % 2 {\n            for seat in 0..player_count {\n                if !game.finish_order.contains(&seat) {\n                    game.finish_order.push(seat);\n                    game.hands[seat].clear();\n                }\n            }\n        }\n    }\n    if game.finish_order.len() == player_count - 1 {\n'''
          if old not in text:
              raise SystemExit('settlement anchor not found')
          text = text.replace(old, new, 1)
          anchor = '''    #[test] fn current_level_single_beats_ace()'''
          test = '''    #[test]\n    fn double_down_finishes_immediately_after_partner_is_second() {\n        let mut game = GuandanGameState::default();\n        game.started = true;\n        game.player_names = vec!["A1".into(), "B1".into(), "A2".into(), "B2".into()];\n        game.hands = vec![\n            vec![],\n            vec![card(Suit::Clubs, Rank::Ten)],\n            vec![],\n            vec![card(Suit::Spades, Rank::King)],\n        ];\n        game.finish_order = vec![0, 2];\n        assert!(settle_and_redeal_if_complete(&mut game).unwrap());\n        assert_eq!(game.finish_order, vec![0, 2, 1, 3]);\n        assert!(game.hands[1].is_empty());\n        assert!(game.hands[3].is_empty());\n        assert_eq!(game.last_promotion_steps, Some(3));\n        assert_eq!(game.next_round_phase, Some(GuandanNextRoundPhase::AwaitingShuffle));\n        assert!(game.last_play.is_empty());\n        assert!(game.table_plays.is_empty());\n    }\n    #[test] fn current_level_single_beats_ace()'''
          if anchor not in text:
              raise SystemExit('test anchor not found')
          text = text.replace(anchor, test, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          cargo test -p shengji --bin shengji guandan_handler::tests
      - name: Commit double-down fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/guandan_handler.rs
          git commit -m "fix(guandan): end round immediately on double-down [double-down-fix]"
          git push
