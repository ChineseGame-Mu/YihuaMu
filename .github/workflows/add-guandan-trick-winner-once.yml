name: Add Guandan trick winner once

on:
  push:
    branches: [fix/guandan-single-viewport-20260822]
    paths: [.github/workflows/add-guandan-trick-winner-once.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guandan-single-viewport-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch trick winner state and UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1))

          replace_once(
              "backend/src/guandan_serving_types.rs",
              "    pub trick_complete: bool,\n    pub level: Rank,",
              "    pub trick_complete: bool,\n    #[serde(default)]\n    pub last_trick_winner: Option<usize>,\n    pub level: Rank,",
          )
          replace_once(
              "backend/src/guandan_serving_types.rs",
              "            trick_complete: false,\n            level: Rank::Two,",
              "            trick_complete: false,\n            last_trick_winner: None,\n            level: Rank::Two,",
          )

          replace_once(
              "backend/src/guandan_handler.rs",
              "        trick_complete: bool,\n        level: Rank,",
              "        trick_complete: bool,\n        last_trick_winner: Option<usize>,\n        level: Rank,",
          )
          replace_once(
              "backend/src/guandan_handler.rs",
              "        trick_complete: game.trick_complete,\n        level: game.level,",
              "        trick_complete: game.trick_complete,\n        last_trick_winner: game.last_trick_winner,\n        level: game.level,",
          )
          replace_once(
              "backend/src/guandan_handler.rs",
              "                        state.game.trick_complete = false;\n                        state.game.finish_order.clear();",
              "                        state.game.trick_complete = false;\n                        state.game.last_trick_winner = None;\n                        state.game.finish_order.clear();",
          )

          # Robot pass path: preserve the trick winner before clearing the table.
          replace_once(
              "backend/src/guandan_handler.rs",
              "        if game.passes >= required_passes {\n            game.turn = winner;",
              "        if game.passes >= required_passes {\n            game.last_trick_winner = Some(winner);\n            game.turn = winner;",
          )

          # Human pass path: same winner preservation.
          replace_once(
              "backend/src/guandan_handler.rs",
              "                        if state.game.passes >= required_passes {\n                            state.game.turn = winner;",
              "                        if state.game.passes >= required_passes {\n                            state.game.last_trick_winner = Some(winner);\n                            state.game.turn = winner;",
          )

          # Manual EndRound path, for compatibility with any older trick-complete flow.
          replace_once(
              "backend/src/guandan_handler.rs",
              "                        let winner = state.game.last_player.ok_or(())?;\n                        state.game.turn = winner;",
              "                        let winner = state.game.last_player.ok_or(())?;\n                        state.game.last_trick_winner = Some(winner);\n                        state.game.turn = winner;",
          )

          replace_once(
              "frontend/src/guandanProtocol.ts",
              "      trick_complete: boolean;\n      level: GuandanRank;",
              "      trick_complete: boolean;\n      last_trick_winner: number | null;\n      level: GuandanRank;",
          )

          replace_once(
              "frontend/src/GuandanStateProvider.tsx",
              "  trickComplete: boolean;\n  level: GuandanRank | null;",
              "  trickComplete: boolean;\n  lastTrickWinner: number | null;\n  level: GuandanRank | null;",
          )
          replace_once(
              "frontend/src/GuandanStateProvider.tsx",
              "  trickComplete: false,\n  level: null,",
              "  trickComplete: false,\n  lastTrickWinner: null,\n  level: null,",
          )
          replace_once(
              "frontend/src/GuandanStateProvider.tsx",
              "        trickComplete: false,\n        finishOrder: [],",
              "        trickComplete: false,\n        lastTrickWinner: null,\n        finishOrder: [],",
          )
          replace_once(
              "frontend/src/GuandanStateProvider.tsx",
              "        trickComplete: message.trick_complete,\n        level: message.level,",
              "        trickComplete: message.trick_complete,\n        lastTrickWinner: message.last_trick_winner,\n        level: message.level,",
          )

          replace_once(
              "frontend/src/GuandanTable.tsx",
              "            <section className=\"guandan-table-stage\">\n              <h2>本轮出牌</h2>",
              "            <section className=\"guandan-table-stage\">\n              <h2>本轮出牌</h2>\n              {state.lastTrickWinner !== null && (\n                <div className=\"guandan-notice-panel\" role=\"status\" aria-label=\"本轮赢家\">\n                  <strong>本轮赢家：</strong>\n                  {state.players[state.lastTrickWinner] ?? `玩家${state.lastTrickWinner + 1}`}\n                </div>\n              )}",
          )
          PY
      - name: Format and verify
        run: |
          cd frontend
          npx --yes prettier@3.4.1 --write src/GuandanTable.tsx src/GuandanStateProvider.tsx src/guandanProtocol.ts
          npx --yes prettier@3.4.1 --check src/GuandanTable.tsx src/GuandanStateProvider.tsx src/guandanProtocol.ts
          npm ci
          npm run build
          cd ..
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p shengji guandan --lib
      - name: Commit trick winner feature
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/guandan_handler.rs backend/src/guandan_serving_types.rs frontend/src/GuandanTable.tsx frontend/src/GuandanStateProvider.tsx frontend/src/guandanProtocol.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: show Guandan trick winner on public table"
          git push origin HEAD:fix/guandan-single-viewport-20260822
