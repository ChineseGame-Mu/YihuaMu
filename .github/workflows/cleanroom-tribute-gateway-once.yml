name: Cleanroom Tribute Gateway Once

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanroom/yihua-game-20260826
      - name: Wire resistance after next-round deal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('yihua-game/src/core/legacy-guandan-gateway.ts')
          s = p.read_text()
          s = s.replace(
              '  prepareLegacyTribute,\n} from "./legacy-tribute.js";',
              '  prepareLegacyTribute,\n  resolveLegacyTributeResistance,\n} from "./legacy-tribute.js";'
          )
          old = '''      const clean = toCleanroomCommand(message, active.adapter.compat);\n      await runtime.websocket.handleText(\n        active.adapter,\n        { roomId: active.roomId, playerId: active.playerId },\n        JSON.stringify(clean),\n      );'''
          new = old + '''\n      if (message.type === "deal_next_round") {\n        const managed = runtime.rooms.get(active.roomId);\n        if (resolveLegacyTributeResistance(active.roomId, managed)) {\n          await runtime.websocket.broadcastGameState(managed);\n        }\n      }'''
          if old not in s:
              raise SystemExit('gateway command block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format gateway
        working-directory: yihua-game
        run: npx prettier@3.4.1 --write src/core/legacy-guandan-gateway.ts
      - name: Commit gateway patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yihua-game/src/core/legacy-guandan-gateway.ts
          git commit -m "fix(cleanroom): resolve tribute resistance after deal"
          git push origin HEAD:cleanroom/yihua-game-20260826
