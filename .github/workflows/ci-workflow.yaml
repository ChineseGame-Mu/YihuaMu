name: CI
on:
  push:
    branches-ignore:
      - 'backup/**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "Build and test the code"
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Yarn deps for frontend
        run: yarn install
        working-directory: ./frontend

      - name: Install wasm-pack (cross-filesystem safe)
        run: |
          set -euo pipefail
          version="v0.15.0"
          archive="wasm-pack-${version}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 3 --output "/tmp/${archive}" "https://github.com/rustwasm/wasm-pack/releases/download/${version}/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 0755 "/tmp/wasm-pack-${version}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build frontend
        run: yarn build
        working-directory: ./frontend

      - name: Test frontend
        run: yarn test
        working-directory: ./frontend

      - name: Lint frontend
        run: yarn lint
        working-directory: ./frontend

      - name: Check frontend formatting
        run: |
          test "$(yarn --silent prettier --version)" = "3.4.1"
          if ! yarn prettier --check; then
            echo "::error::Frontend Prettier 3.4.1 check failed; showing proposed formatting-only diff"
            yarn prettier --write
            git diff -- src
            exit 1
          fi
        working-directory: ./frontend
      - name: Guandan runtime snapshot and restart regression
        working-directory: ./yihua-game
        run: |
          npm ci
          npx vitest run test/runtime-snapshot.test.ts test/managed-room-snapshot-recovery.test.ts
          npm run typecheck

      - name: Lint Rust code
        run: cargo clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: K-level anti-tribute Rust regression (fix branch only)
        if: ${{ github.head_ref == 'fix/guandan-accepted-ui-tribute-20261011' || github.ref_name == 'fix/guandan-accepted-ui-tribute-20261011' }}
        run: |
          cargo test -p shengji-core guandan::tribute::tests:: -- --nocapture
          cargo test -p shengji guandan_handler::tests:: -- --nocapture

      - name: QA K-level anti-tribute no duplicate popup (mandatory)
        if: ${{ github.head_ref == 'qa/manual-11items-advanced-robot-20261018' || github.ref_name == 'qa/manual-11items-advanced-robot-20261018' }}
        run: |
          cargo test -p shengji guandan_handler::tests::king_level_anti_tribute_is_consumed_once_after_first_play -- --exact --nocapture
          cargo test -p shengji guandan_handler::tests::king_round_still_creates_required_tribute -- --exact --nocapture
          cargo test -p shengji guandan_handler::tests::anti_tribute_only_occurs_at_the_start_of_the_deal -- --exact --nocapture

      - name: QA four robots three consecutive full deals (mandatory)
        if: ${{ github.head_ref == 'qa/manual-11items-advanced-robot-20261018' || github.ref_name == 'qa/manual-11items-advanced-robot-20261018' }}
        run: cargo test -p shengji guandan_handler::tests::four_robots_complete_three_consecutive_full_deals -- --ignored --nocapture

      - name: Test Rust code
        run: cargo test --all


  # Independent of frontend formatting failures: always collect the Master3
  # four-bot regression result on the isolated QA branch. No deployment.
  master3-four-bot-qa:
    name: "Master3 four-bot full-deal QA"
    if: ${{ github.head_ref == 'qa/master3-smart-bots-20261109' || github.ref_name == 'qa/master3-smart-bots-20261109' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Four robots complete three consecutive full deals
        shell: bash
        run: |
          set -euo pipefail
          # Cargo exits successfully when a filter matches zero tests; reject that false pass.
          cargo test -p shengji guandan_handler::tests::four_robots_complete_three_consecutive_full_deals -- --ignored --exact --nocapture 2>&1 | tee master3-four-bot-qa.log
          # Verify the named test actually ran, not merely another cargo test summary.
          grep -Fq 'test guandan_handler::tests::four_robots_complete_three_consecutive_full_deals ... ok' master3-four-bot-qa.log || {
            echo '::error::Named four-bot regression did not report a pass'
            exit 1
          }
          grep -Fq 'test result: ok. 1 passed; 0 failed;' master3-four-bot-qa.log || {
            echo '::error::Expected exactly one successful four-bot full-deal regression test'
            exit 1
          }
      - name: Preserve four-bot QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: master3-four-bot-qa-log
          path: master3-four-bot-qa.log
          if-no-files-found: warn
