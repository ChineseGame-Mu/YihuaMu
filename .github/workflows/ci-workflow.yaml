name: CI
on:
  push:
    branches-ignore:
      - 'backup/**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "Build and test the code"
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Yarn deps for frontend
        run: yarn install
        working-directory: ./frontend

      - name: Install wasm-pack (cross-filesystem safe)
        run: |
          set -euo pipefail
          version="v0.15.0"
          archive="wasm-pack-${version}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 3 --output "/tmp/${archive}" "https://github.com/rustwasm/wasm-pack/releases/download/${version}/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 0755 "/tmp/wasm-pack-${version}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build frontend
        run: yarn build
        working-directory: ./frontend

      - name: Test frontend
        run: yarn test
        working-directory: ./frontend

      - name: Lint frontend
        run: yarn lint
        working-directory: ./frontend

      - name: Check frontend formatting
        run: |
          test "$(yarn --silent prettier --version)" = "3.4.1"
          yarn prettier --check
        working-directory: ./frontend
      - name: Guandan runtime snapshot and restart regression
        working-directory: ./yihua-game
        run: |
          npm ci
          npx vitest run test/runtime-snapshot.test.ts test/managed-room-snapshot-recovery.test.ts
          npm run typecheck

      - name: Lint Rust code
        run: cargo clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: K-level anti-tribute Rust regression (fix branch only)
        if: ${{ github.head_ref == 'fix/guandan-accepted-ui-tribute-20261011' || github.ref_name == 'fix/guandan-accepted-ui-tribute-20261011' }}
        run: |
          cargo test -p shengji-core guandan::tribute::tests:: -- --nocapture
          cargo test -p shengji guandan_handler::tests:: -- --nocapture

      - name: QA K-level anti-tribute no duplicate popup (mandatory)
        if: ${{ github.head_ref == 'qa/manual-11items-advanced-robot-20261018' || github.ref_name == 'qa/manual-11items-advanced-robot-20261018' }}
        run: |
          cargo test -p shengji guandan_handler::tests::king_level_anti_tribute_is_consumed_once_after_first_play -- --exact --nocapture
          cargo test -p shengji guandan_handler::tests::king_round_still_creates_required_tribute -- --exact --nocapture
          cargo test -p shengji guandan_handler::tests::anti_tribute_only_occurs_at_the_start_of_the_deal -- --exact --nocapture

      - name: QA four robots three consecutive full deals (mandatory)
        if: ${{ github.head_ref == 'qa/manual-11items-advanced-robot-20261018' || github.ref_name == 'qa/manual-11items-advanced-robot-20261018' }}
        run: cargo test -p shengji guandan_handler::tests::four_robots_complete_three_consecutive_full_deals -- --ignored --nocapture

      - name: Test Rust code
        run: cargo test --all
