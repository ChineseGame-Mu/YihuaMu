name: CI
on:
  push:
    branches-ignore:
      - 'backup/**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "Build and test the code"
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Yarn deps for frontend
        run: yarn install
        working-directory: ./frontend

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build frontend
        run: yarn build
        working-directory: ./frontend

      - name: Test frontend
        run: yarn test
        working-directory: ./frontend

      - name: Lint frontend
        run: yarn lint
        working-directory: ./frontend

      - name: Check frontend formatting
        run: |
          test "$(yarn --silent prettier --version)" = "3.4.1"
          yarn prettier --check
        working-directory: ./frontend
      - name: Lint Rust code
        run: cargo clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: K-level anti-tribute Rust regression (fix branch only)
        if: ${{ github.head_ref == 'fix/guandan-accepted-ui-tribute-20261011' || github.ref_name == 'fix/guandan-accepted-ui-tribute-20261011' }}
        run: |
          cargo test -p shengji-core guandan::tribute::tests:: -- --nocapture
          cargo test -p shengji guandan_handler::tests:: -- --nocapture

      - name: Test Rust code
        run: cargo test --all
