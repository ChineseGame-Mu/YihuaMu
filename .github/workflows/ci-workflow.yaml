name: CI
on:
  - push
  - pull_request

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "Yihua Game Clean-room CI"
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Yarn deps for frontend
        run: yarn install
        working-directory: ./frontend

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build frontend
        run: yarn build
        working-directory: ./frontend

      - name: Test frontend
        run: yarn test
        working-directory: ./frontend

      - name: Lint frontend
        run: yarn lint
        working-directory: ./frontend

      - name: Check frontend formatting
        run: |
          test "$(yarn --silent prettier --version)" = "3.4.1"
          yarn prettier --check
        working-directory: ./frontend

      - name: Guandan forced regression QA
        run: |
          set -euo pipefail

          echo "[1/5] teammate-aware robot decision must stay at the first decision layer"
          grep -q 'fn robot_should_yield_to_teammate' backend/src/guandan_handler.rs
          grep -q 'robot_should_yield_to_teammate(game, seat)' backend/src/guandan_handler.rs
          cargo test robot_team_identity_is_a_first_layer_decision -- --nocapture

          echo "[2/5] all Guandan diamonds must remain orange-yellow, never blue"
          for f in 2D 3D 4D 5D 6D 7D 8D 9D Td Jd Qd Kd Ad; do
            card="frontend/src/generated/playing-cards-4color/${f}.tsx"
            grep -q '#f5a623' "$card"
            if grep -q '#00f' "$card"; then
              echo "ERROR: blue diamond regression in $card"
              exit 1
            fi
          done

          echo "[3/5] play author must be explicitly visible on every table play"
          grep -q 'guandan-play-author-hotfix.css' frontend/src/index.tsx
          grep -q 'content: "出牌人："' frontend/src/guandan-play-author-hotfix.css
          grep -q 'state.players\[play.player\]' frontend/src/GuandanTable.tsx

          echo "[4/5] public Guandan room gate must remain fixed to rooms 0001-0004"
          grep -q "expectedRooms = \['0001','0002','0003','0004'\]" .github/workflows/cleanroom-short-link-gate.yml
          grep -q "free-text room input detected" .github/workflows/cleanroom-short-link-gate.yml

          echo "[5/5] production short link gate must protect master and yihua-mu.vercel.app"
          grep -q 'https://yihua-mu.vercel.app' .github/workflows/cleanroom-short-link-gate.yml
          grep -q '^      - master$' .github/workflows/cleanroom-short-link-gate.yml

          echo "Guandan forced regression QA: PASS (5/5)"

      - name: Lint Rust code
        run: cargo clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust code
        run: cargo test --all
