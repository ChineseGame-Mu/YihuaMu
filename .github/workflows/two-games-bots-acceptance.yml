name: Two Games Bot Acceptance
on:
  push:
    branches:
      - feature/two-games-guandan-style-bot-settings-20261104
  workflow_dispatch:

jobs:
  robot-core-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile and test bot seat ownership and capacity
        run: cargo test -p shengji-core --test two_game_robot_seats -- --nocapture
      - name: Check all core library tests
        run: cargo test -p shengji-core --lib
