name: Add first draw latest

on:
  push:
    branches:
      - fix/guandan-single-viewport-20260822
    paths:
      - .github/trigger-first-draw-latest-20260825.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guandan-single-viewport-20260822
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/add_first_draw_latest_20260825.py
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npx prettier --write src/GuandanTable.tsx src/GuandanStateProvider.tsx src/guandanProtocol.ts
          npm run build
      - name: Format and test backend
        run: |
          cargo fmt --all
          cargo test -p shengji guandan --quiet
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/guandan_handler.rs backend/src/guandan_serving_types.rs frontend/src/GuandanStateProvider.tsx frontend/src/GuandanTable.tsx frontend/src/guandanProtocol.ts
          git commit -m "feat(guandan): first-game card draw on latest UI"
          git push origin HEAD:fix/guandan-single-viewport-20260822
