name: Verify isolated Guandan 4-14 player websocket

on:
  push:
    branches:
      - feature/guandan-up-to-14-players-20260825
    paths:
      - .github/workflows/verify-guandan-14-local-websocket-20260825.yml

permissions:
  contents: read

jobs:
  multiplayer-websocket:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guandan-up-to-14-players-20260825

      - name: Install Python websocket client
        run: python -m pip install --quiet 'websockets>=12,<16'

      - name: Start isolated branch backend
        run: |
          PORT=3030 CORS_ALLOWED_ORIGINS='*' cargo run -p shengji --features dynamic > /tmp/guandan14-backend.log 2>&1 &
          echo $! > /tmp/guandan14-backend.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3030/runtime.js >/dev/null 2>&1; then
              echo 'LOCAL_BACKEND_READY'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/guandan14-backend.log
          exit 1

      - name: Run 4-14 player WebSocket robot opening tests
        run: |
          python - <<'PY'
          import asyncio
          import json
          import time
          import websockets

          URI = 'ws://127.0.0.1:3030/api/guandan'
          PLAYER_COUNTS = [4, 6, 8, 10, 12, 14]
          CARDS_PER_PLAYER = 27

          async def recv_until(ws, predicate, timeout=15):
              async def inner():
                  while True:
                      raw = await ws.recv()
                      if isinstance(raw, bytes):
                          raw = raw.decode('utf-8')
                      msg = json.loads(raw)
                      if msg.get('type') == 'error':
                          raise AssertionError(f"server error: {msg.get('message')}")
                      if predicate(msg):
                          return msg
              return await asyncio.wait_for(inner(), timeout=timeout)

          async def run_table(player_count):
              room = f'robot{player_count}_{int(time.time() * 1000)}'
              sockets = []
              try:
                  for index in range(player_count):
                      ws = await websockets.connect(URI, open_timeout=10)
                      sockets.append(ws)
                      await recv_until(ws, lambda m: m.get('type') == 'connected')
                      await ws.send(json.dumps({
                          'type': 'join',
                          'room': room,
                          'name': f'玩家{index + 1}',
                      }, ensure_ascii=False))
                      joined = await recv_until(ws, lambda m: m.get('type') == 'joined')
                      assert joined.get('seat') == index, (player_count, index, joined)

                  waiting = await recv_until(
                      sockets[0],
                      lambda m: m.get('type') == 'waiting'
                      and len(m.get('players', [])) == player_count,
                      timeout=20,
                  )
                  assert waiting.get('minimum_players') == 4, waiting
                  assert waiting.get('maximum_players') == 14, waiting

                  await sockets[0].send(json.dumps({
                      'type': 'start',
                      'player_count': player_count,
                  }))

                  winners = []
                  for seat, ws in enumerate(sockets):
                      started = await recv_until(
                          ws,
                          lambda m: m.get('type') == 'started'
                          and m.get('player_count') == player_count,
                          timeout=20,
                      )
                      assert started.get('cards_per_player') == CARDS_PER_PLAYER, started

                      state = await recv_until(
                          ws,
                          lambda m: m.get('type') == 'state'
                          and len(m.get('players', [])) == player_count
                          and len(m.get('initial_draw', [])) == player_count,
                          timeout=20,
                      )
                      hand = await recv_until(ws, lambda m: m.get('type') == 'hand', timeout=20)

                      assert len(hand.get('cards', [])) == CARDS_PER_PLAYER, (
                          player_count,
                          seat,
                          len(hand.get('cards', [])),
                      )
                      assert state.get('hand_counts') == [CARDS_PER_PLAYER] * player_count, (
                          player_count,
                          state.get('hand_counts'),
                      )
                      winner = state.get('initial_draw_winner')
                      assert isinstance(winner, int) and 0 <= winner < player_count, winner
                      assert state.get('turn') == winner, (player_count, state.get('turn'), winner)
                      assert all(
                          'Joker' not in card for card in state.get('initial_draw', [])
                      ), state.get('initial_draw')
                      winners.append(winner + 1)

                  winner = winners[0]
                  assert all(item == winner for item in winners), (player_count, winners)
                  result = {
                      'room': room,
                      'players': player_count,
                      'cards_per_player': CARDS_PER_PLAYER,
                      'opening_draw_count': player_count,
                      'winner_player': winner,
                      'winner_team': 1 if winner % 2 == 1 else 2,
                  }
                  print(f'LOCAL_{player_count}_PLAYER_WEBSOCKET_OK')
                  print(json.dumps(result, ensure_ascii=False))
                  return result
              finally:
                  await asyncio.gather(*(ws.close() for ws in sockets), return_exceptions=True)

          async def main():
              results = []
              for player_count in PLAYER_COUNTS:
                  results.append(await run_table(player_count))
              print('LOCAL_ALL_EVEN_TABLES_4_TO_14_OK')
              print(json.dumps(results, ensure_ascii=False))

          asyncio.run(main())
          PY

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/guandan14-backend.log || true
