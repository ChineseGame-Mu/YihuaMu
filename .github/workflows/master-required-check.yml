name: Master Required Check Compatibility

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  required-check:
    name: Yihua Game Clean-room CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Guandan homepage target
        run: |
          grep -F 'https://yihua-mu.vercel.app/' frontend/src/Welcome.tsx
