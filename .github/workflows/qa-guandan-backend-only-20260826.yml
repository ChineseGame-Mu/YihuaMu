name: QA Guandan backend only

on:
  push:
    branches: [deploy/guandan-backend-20260826]
    paths:
      - .github/workflows/qa-guandan-backend-only-20260826.yml

permissions:
  contents: read

jobs:
  backend-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Build frontend assets required by backend include_dir
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Clippy backend
        run: cargo clippy -p shengji --all-targets -- -D warnings
      - name: Test Guandan backend
        run: cargo test -p shengji guandan --no-fail-fast
