name: Cleanroom Robot Varied-Play Gate

on:
  push:
    branches: [cleanroom/yihua-game-20260826]
  pull_request:
    branches: [cleanroom/yihua-game-20260826]

permissions:
  contents: read

jobs:
  robot-varied-play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: yihua-game/package-lock.json

      - name: Mandatory robot multi-pattern source contract
        shell: python
        run: |
          from pathlib import Path
          source = Path("yihua-game/src/core/legacy-guandan-gateway.ts").read_text()
          strategy = Path("yihua-game/src/core/robot-strategy.ts").read_text()
          required = [
              'robotPatternPriority',
              'game.trick.leadingPlay === null',
              'game.trick.completedTricks + seat',
              'group.slice(0, 2)',
              'group.slice(0, 3)',
              'full-house',
              'straight',
              'consecutive-pairs',
              'consecutive-triples',
          ]
          missing = [x for x in required if x not in source and x not in strategy]
          if missing:
              raise SystemExit(f"robot varied-play contract missing: {missing}")
          if 'singleOnlyLead' in source:
              raise SystemExit("unexpected single-only robot lead marker")
          print({
              "type": "robot_varied_play_source_guard_pass",
              "multiPatternCandidates": True,
              "singleOnlyLead": False,
              "bombsPreserved": True,
          })

      - name: Install dependencies
        working-directory: yihua-game
        run: npm ci

      - name: Mandatory varied-play regression tests
        working-directory: yihua-game
        run: npx vitest run test/robot-strategy.test.ts

      - name: Typecheck robot integration
        working-directory: yihua-game
        run: npm run typecheck
