name: YihuaMu format Initialize

on:
  push:
    branches:
      - agent/yihuamu-3-to-8-decks-chinese-ui
    paths:
      - .github/workflows/yihuamu-format-initialize.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/yihuamu-3-to-8-decks-chinese-ui
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Format Initialize.tsx only
        working-directory: frontend
        run: yarn prettier src/Initialize.tsx --write
      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/yihuamu-format-initialize.yml
          git config user.name "ChineseGame-Mu"
          git config user.email "muyihua@gmail.com"
          git add frontend/src/Initialize.tsx .github/workflows/yihuamu-format-initialize.yml
          git diff --cached --quiet && exit 0
          git commit -m "Format Initialize.tsx after restoring four-player start"
          git push origin HEAD:agent/yihuamu-3-to-8-decks-chinese-ui
