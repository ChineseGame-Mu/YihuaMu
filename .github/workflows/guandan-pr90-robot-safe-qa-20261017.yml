name: Guandan PR92 Robot Three-Deal QA
on:
  push:
    branches:
      - qa/pr90-robot-backend-only-20261017
      - qa/manual-11items-advanced-robot-20261018
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: guandan-pr90-robot-safe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  robot-rust-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: K-level tribute and anti-tribute core regression
        run: |
          cargo test -p shengji-core guandan::tribute::tests:: -- --nocapture
      - name: Prepare compile-only frontend stub
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html><title>QA-only stub</title>\n' > frontend/dist/index.html
      - name: Backend Guandan room, tribute and robot regressions
        run: |
          cargo test -p shengji guandan_handler::tests:: -- --nocapture
      - name: Four robots three consecutive complete deals (NOT four humans)
        run: |
          cargo test -p shengji guandan_handler::tests::four_robots_complete_three_consecutive_full_deals -- --ignored --exact --nocapture
      - name: QA scope
        run: echo "No production deployment; not browser/SSO, four-human E2E, or persistent disaster recovery certification."

  isolated-runtime-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: yihua-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yihua-game/package-lock.json
      - name: Install isolated runtime dependencies
        run: npm ci
      - name: Build isolated runtime
        run: npm run build
      - name: Test runtime snapshots and reconnect recovery
        run: |
          npx vitest run test/runtime-snapshot.test.ts test/managed-room-snapshot-recovery.test.ts test/websocket-reconnect-snapshot.test.ts
      - name: Restart recovery with disk snapshot and live WebSocket clients
        run: npm run smoke:restart
      - name: Crash recovery with disk snapshot
        run: npm run smoke:crash
      - name: Scope declaration
        run: echo "Isolated CI runtime only; not a production data export or production restoration exercise."
