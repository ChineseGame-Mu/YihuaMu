name: YihuaMu show start button

on:
  push:
    branches:
      - agent/yihuamu-3-to-8-decks-chinese-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/yihuamu-3-to-8-decks-chinese-ui
      - name: Show start button regardless of player count
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/Initialize.tsx')
          s = p.read_text()
          old = '''      {props.state.propagated.players.length >= 4 ? (\n        <>\n          <button\n            className="big"\n            disabled={\n              props.state.propagated.game_start_policy ===\n                "AllowLandlordOnly" &&\n              landlordIndex !== -1 &&\n              props.state.propagated.players[landlordIndex].name !== props.name\n            }\n            onClick={startGame}\n          >\n            开始游戏\n          </button>\n          <ReadyCheck />\n        </>\n      ) : (\n        <h2>等待其他玩家加入……</h2>\n      )}'''
          new = '''      <>\n        <button\n          className="big"\n          disabled={\n            props.state.propagated.game_start_policy ===\n              "AllowLandlordOnly" &&\n            landlordIndex !== -1 &&\n            props.state.propagated.players[landlordIndex].name !== props.name\n          }\n          onClick={startGame}\n        >\n          开始游戏\n        </button>\n        <ReadyCheck />\n        {props.state.propagated.players.length < 4 ? (\n          <p>试用模式：当前少于 4 名玩家，按钮仍保持显示。</p>\n        ) : null}\n      </>'''
          if old not in s:
              raise SystemExit('Expected start-game block not found')
          p.write_text(s.replace(old, new))
          Path('.github/workflows/yihuamu-show-start-button.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/Initialize.tsx .github/workflows/yihuamu-show-start-button.yml
          git commit -m "Show start button in YihuaMu trial mode"
          git push origin HEAD:agent/yihuamu-3-to-8-decks-chinese-ui
