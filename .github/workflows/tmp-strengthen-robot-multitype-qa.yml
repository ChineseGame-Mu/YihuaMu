name: Temporary Strengthen Robot Multitype QA

on:
  push:
    branches: [cleanroom/yihua-game-20260826]
    paths: [.github/workflows/tmp-strengthen-robot-multitype-qa.yml]

permissions:
  contents: write

jobs:
  strengthen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanroom/yihua-game-20260826
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Strengthen real candidate generation and matrix telemetry
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          gateway = Path('yihua-game/src/core/legacy-guandan-gateway.ts')
          text = gateway.read_text()
          old = 'const robotCandidateCardIds = (hand: readonly any[]): string[][] => {'
          new = 'export const robotCandidateCardIds = (hand: readonly any[]): string[][] => {'
          if new not in text:
              if old not in text:
                  raise SystemExit('robotCandidateCardIds anchor missing')
              text = text.replace(old, new, 1)
          old = 'const robotCandidatePriority = (\n'
          new = 'export const robotCandidatePriority = (\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('robotCandidatePriority anchor missing')
              text = text.replace(old, new, 1)
          gateway.write_text(text)

          soak = Path('yihua-game/scripts/soak-websocket.mjs')
          text = soak.read_text()
          old = 'const result={elapsedMs:Date.now()-startedAt,durationMs,tables:tables.map(({metrics})=>metrics)};console.log(JSON.stringify(result));'
          new = 'const result={elapsedMs:Date.now()-startedAt,durationMs,tables:tables.map(({metrics,playTypeCoverage})=>({...metrics,playTypeCoverage}))};console.log(JSON.stringify(result));'
          if new not in text:
              if old not in text:
                  raise SystemExit('soak terminal telemetry anchor missing')
              text = text.replace(old, new, 1)
          soak.write_text(text)

          gate = Path('.github/workflows/cleanroom-robot-varied-play-gate.yml')
          text = gate.read_text()
          text = text.replace("              'consecutive-triples',\n", "              'consecutive-triples',\n              'for (let size = group.length; size >= 4; size -= 1)',\n              'export const robotCandidateCardIds',\n              'export const robotCandidatePriority',\n")
          old = 'run: npx vitest run test/robot-strategy.test.ts'
          new = 'run: npx vitest run test/robot-strategy.test.ts test/robot-candidate-generation.test.ts'
          if new not in text:
              if old not in text:
                  raise SystemExit('robot gate test anchor missing')
              text = text.replace(old, new, 1)
          gate.write_text(text)

          matrix = Path('.github/workflows/cleanroom-yihua-game-expert-multiplayer-4to14.yml')
          text = matrix.read_text()
          anchor = '          if (!(Number(table.staleErrors ?? 0) > 0)) fail("stale-revision rejection coverage missing");\n\n          if (pc === 4) {'
          insert = '''          if (!(Number(table.staleErrors ?? 0) > 0)) fail("stale-revision rejection coverage missing");

          const matrixCoverage = table.playTypeCoverage ?? {};
          if (!(Number(matrixCoverage.single ?? 0) > 0)) fail("matrix single-play coverage missing");
          const coreNonSingle = ["pair","triple","fullHouse","straight","consecutivePairs","consecutiveTriples"];
          const observedCoreNonSingle = coreNonSingle.filter((type) => Number(matrixCoverage[type] ?? 0) > 0);
          if (observedCoreNonSingle.length < 4) fail(`only ${observedCoreNonSingle.length} core non-single families observed: ${observedCoreNonSingle.join(",")}`);
          const compoundObserved = ["fullHouse","consecutivePairs","consecutiveTriples"].some((type) => Number(matrixCoverage[type] ?? 0) > 0);
          if (!compoundObserved) fail("no compound multi-card family observed");
          const allNonSingleKeys = ["pair","triple","fullHouse","straight","consecutivePairs","consecutiveTriples","straightFlush","bomb4","bomb5","bomb6Plus","jokerBomb","heartLevelWildcardPlay"];
          const nonSinglePlayCount = allNonSingleKeys.reduce((sum, type) => sum + Number(matrixCoverage[type] ?? 0), 0);
          if (nonSinglePlayCount < 8) fail(`insufficient real non-single plays observed: ${nonSinglePlayCount}`);

          if (pc === 4) {'''
          if 'observedCoreNonSingle' not in text:
              if anchor not in text:
                  raise SystemExit('expert matrix coverage anchor missing')
              text = text.replace(anchor, insert, 1)
          old_pass = 'console.log(JSON.stringify({type:"expert_bot_matrix_pass",playerCount:pc,completedRounds:rounds,deadlocks:table.deadlocks,stateErrors:table.stateErrors,crashes:table.crashes,reconnects:table.reconnects,staleErrors:table.staleErrors,dedicatedExpertQa:pc===4}));'
          new_pass = 'console.log(JSON.stringify({type:"expert_bot_matrix_pass",playerCount:pc,completedRounds:rounds,deadlocks:table.deadlocks,stateErrors:table.stateErrors,crashes:table.crashes,reconnects:table.reconnects,staleErrors:table.staleErrors,playTypeCoverage:matrixCoverage,observedCoreNonSingle,nonSinglePlayCount,dedicatedExpertQa:pc===4}));'
          if new_pass not in text:
              if old_pass not in text:
                  raise SystemExit('expert matrix pass telemetry anchor missing')
              text = text.replace(old_pass, new_pass, 1)
          matrix.write_text(text)

          preuse = Path('.github/workflows/cleanroom-preuse-release-gate.yml')
          text = preuse.read_text()
          anchor = '      - name: Mandatory 借东风 authoritative turn-rule contract\n'
          block = '''      - name: Mandatory robot multi-pattern regression contract
        shell: bash
        run: |
          set -euo pipefail
          GATE=.github/workflows/cleanroom-robot-varied-play-gate.yml
          MATRIX=.github/workflows/cleanroom-yihua-game-expert-multiplayer-4to14.yml
          SOURCE=yihua-game/src/core/legacy-guandan-gateway.ts
          TEST=yihua-game/test/robot-candidate-generation.test.ts
          test -f "$GATE"
          test -f "$MATRIX"
          test -f "$SOURCE"
          test -f "$TEST"
          grep -F 'export const robotCandidateCardIds' "$SOURCE"
          grep -F 'export const robotCandidatePriority' "$SOURCE"
          grep -F 'test/robot-candidate-generation.test.ts' "$GATE"
          grep -F 'for (let size = group.length; size >= 4; size -= 1)' "$GATE"
          grep -F 'observedCoreNonSingle' "$MATRIX"
          grep -F 'nonSinglePlayCount' "$MATRIX"
          grep -F 'single' "$TEST"
          grep -F 'pair' "$TEST"
          grep -F 'triple' "$TEST"
          grep -F 'full-house' "$TEST"
          grep -F 'straight' "$TEST"
          grep -F 'consecutive-pairs' "$TEST"
          grep -F 'consecutive-triples' "$TEST"
          grep -F 'bomb' "$TEST"
          echo "::notice::Robot candidate generation, real classifier coverage, varied lead selection and multiplayer non-single telemetry are mandatory."

'''
          if 'Mandatory robot multi-pattern regression contract' not in text:
              if anchor not in text:
                  raise SystemExit('pre-use insertion anchor missing')
              text = text.replace(anchor, block + anchor, 1)
          preuse.write_text(text)
          PY

          cat > yihua-game/test/robot-candidate-generation.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { classifyGameCardIds } from "../src/core/game-actions.js";
          import {
            robotCandidateCardIds,
            robotCandidatePriority,
          } from "../src/core/legacy-guandan-gateway.js";

          const suited = (id: string, suit: string, rank: string) => ({
            id,
            card: { kind: "suited", suit, rank },
          });

          const hand: any[] = [
            suited("3c", "clubs", "3"),
            suited("3d", "diamonds", "3"),
            suited("3s", "spades", "3"),
            suited("4c", "clubs", "4"),
            suited("4d", "diamonds", "4"),
            suited("4s", "spades", "4"),
            suited("5c", "clubs", "5"),
            suited("5d", "diamonds", "5"),
            suited("6c", "clubs", "6"),
            suited("6d", "diamonds", "6"),
            suited("6s", "spades", "6"),
            suited("6h", "hearts", "6"),
            suited("7c", "clubs", "7"),
            suited("8d", "diamonds", "8"),
            suited("9s", "spades", "9"),
            suited("10c", "clubs", "10"),
            suited("Jh", "hearts", "J"),
            suited("Qc", "clubs", "Q"),
            suited("Qd", "diamonds", "Q"),
            suited("Kc", "clubs", "K"),
            suited("Kd", "diamonds", "K"),
            suited("Ac", "clubs", "A"),
            suited("Ad", "diamonds", "A"),
          ];

          const stateFor = (completedTricks = 0) =>
            ({
              hands: [hand],
              levelRank: "2",
              trick: { leadingPlay: null, completedTricks },
            }) as any;

          const classifyCandidates = (completedTricks = 0) => {
            const game = stateFor(completedTricks);
            return robotCandidateCardIds(hand).map((cardIds) => ({
              cardIds,
              hand: classifyGameCardIds(game, 0, cardIds, "2"),
            }));
          };

          describe("legacy robot real multi-pattern candidates", () => {
            it("generates every required Guandan family through the real classifier", () => {
              const classified = classifyCandidates();
              const kinds = new Set(classified.map(({ hand: candidate }) => candidate.kind));
              for (const kind of [
                "single",
                "pair",
                "triple",
                "full-house",
                "straight",
                "consecutive-pairs",
                "consecutive-triples",
                "bomb",
              ]) {
                expect(kinds.has(kind), `missing generated ${kind}`).toBe(true);
              }
              expect(
                classified.some(
                  ({ hand: candidate }) =>
                    candidate.kind === "bomb" && candidate.size >= 4,
                ),
              ).toBe(true);
            });

            it("selects varied legal lead families instead of degenerating to singles", () => {
              const selectedKinds = new Set<string>();
              for (let cycle = 0; cycle < 4; cycle += 1) {
                const game = stateFor(cycle);
                const candidates = robotCandidateCardIds(hand).sort(
                  (left, right) =>
                    robotCandidatePriority(game, 0, left) -
                    robotCandidatePriority(game, 0, right),
                );
                const selected = classifyGameCardIds(game, 0, candidates[0]!, "2");
                expect(selected.kind).not.toBe("single");
                expect(selected.kind).not.toBe("invalid");
                selectedKinds.add(selected.kind);
              }
              expect(selectedKinds.size).toBeGreaterThanOrEqual(4);
              expect(selectedKinds.has("pair")).toBe(true);
              expect(selectedKinds.has("triple")).toBe(true);
              expect(selectedKinds.has("straight")).toBe(true);
              expect(selectedKinds.has("consecutive-pairs")).toBe(true);
            });
          });
          EOF

      - name: Validate strengthened QA before commit
        shell: bash
        run: |
          set -euo pipefail
          cd yihua-game
          npm ci
          npx prettier --write src/core/legacy-guandan-gateway.ts test/robot-candidate-generation.test.ts ../.github/workflows/cleanroom-robot-varied-play-gate.yml ../.github/workflows/cleanroom-yihua-game-expert-multiplayer-4to14.yml ../.github/workflows/cleanroom-preuse-release-gate.yml
          npx vitest run test/robot-strategy.test.ts test/robot-candidate-generation.test.ts
          npm run typecheck

      - name: Commit strengthened QA and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChineseGame-Mu"
          git config user.email "muyihua@gmail.com"
          git rm .github/workflows/tmp-strengthen-robot-multitype-qa.yml
          git add yihua-game/src/core/legacy-guandan-gateway.ts yihua-game/scripts/soak-websocket.mjs yihua-game/test/robot-candidate-generation.test.ts .github/workflows/cleanroom-robot-varied-play-gate.yml .github/workflows/cleanroom-yihua-game-expert-multiplayer-4to14.yml .github/workflows/cleanroom-preuse-release-gate.yml
          git commit -m "test(bot): enforce real multitype candidates across QA"
          git push origin HEAD:cleanroom/yihua-game-20260826
