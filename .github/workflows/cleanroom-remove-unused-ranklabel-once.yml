name: Cleanroom remove unused rank label once

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
    paths:
      - .github/workflows/cleanroom-remove-unused-ranklabel-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanroom/yihua-game-20260826
          fetch-depth: 0
      - name: Remove unused rankLabel and self-delete workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/GuandanTable.tsx')
          s = p.read_text()
          start = s.index('const rankLabel: Record<string, string> = {')
          end = s.index('const rankOrder: GuandanRank[] = [', start)
          s = s[:start] + s[end:]
          p.write_text(s)
          PY
          rm .github/workflows/cleanroom-remove-unused-ranklabel-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/GuandanTable.tsx .github/workflows/cleanroom-remove-unused-ranklabel-once.yml
          git commit -m "fix(cleanroom): remove unused rank label"
          git push origin cleanroom/yihua-game-20260826
