name: Format Guandan hint once

on:
  push:
    branches: [feature/guandan-frontend]
    paths:
      - ".github/workflows/prettier-debug.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Format Guandan hint with project Prettier
        working-directory: frontend
        run: ./node_modules/.bin/prettier src/GuandanNoBeatHint.tsx --write
      - name: Verify Guandan hint formatting
        working-directory: frontend
        run: ./node_modules/.bin/prettier src/GuandanNoBeatHint.tsx --check
      - name: Commit formatted Guandan hint
        run: |
          if git diff --quiet -- frontend/src/GuandanNoBeatHint.tsx; then
            echo "GuandanNoBeatHint.tsx is already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/GuandanNoBeatHint.tsx
          git commit -m "style: format Guandan hint with project Prettier"
          git push
