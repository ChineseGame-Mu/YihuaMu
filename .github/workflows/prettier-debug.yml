name: Format frontend src once

on:
  push:
    branches: [feature/guandan-frontend]
    paths:
      - ".github/workflows/prettier-debug.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Format frontend src with project Prettier
        working-directory: frontend
        run: ./node_modules/.bin/prettier src --write
      - name: Verify frontend src formatting
        working-directory: frontend
        run: ./node_modules/.bin/prettier src --check
      - name: Commit formatted frontend src
        run: |
          if git diff --quiet -- frontend/src; then
            echo "frontend/src is already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src
          git commit -m "style: format frontend src with project Prettier"
          git push

# Retriggered to format all frontend/src files, including Guandan suggestion tests.
