name: Add Guandan suggestion description once v2

on:
  push:
    branches: [feature/guandan-frontend]
    paths:
      - ".github/workflows/prettier-debug.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Add suggestion description
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/GuandanNoBeatHint.tsx")
          text = path.read_text()

          if "export const describeSuggestedCards" not in text:
              marker = "export const findSuggestedIndexes = ("
              addition = '''const rankLabels: Record<GuandanRank, string> = {
            Two: "2",
            Three: "3",
            Four: "4",
            Five: "5",
            Six: "6",
            Seven: "7",
            Eight: "8",
            Nine: "9",
            Ten: "10",
            Jack: "J",
            Queen: "Q",
            King: "K",
            Ace: "A",
          };

          export const describeSuggestedCards = (
            cards: GuandanCard[],
          ): string | null => {
            const play = strength(cards);
            if (play === null) return null;
            const rank =
              play.joker === "Small"
                ? "小王"
                : play.joker === "Big"
                  ? "大王"
                  : rankLabels[play.mainRank];

            switch (play.pattern) {
              case "single":
                return `单张${rank}`;
              case "pair":
                return `对${rank}`;
              case "triple":
                return `三张${rank}`;
              case "triple_with_pair":
                return `三带二（${rank}）`;
              case "straight":
                return `顺子（到${rank}）`;
              case "straight_flush":
                return `同花顺（到${rank}）`;
              case "consecutive_pairs":
                return `连对（到${rank}）`;
              case "consecutive_triples":
                return `连三张（到${rank}）`;
              case "bomb":
                return `${play.cardCount}炸${rank}`;
              case "joker_bomb":
                return "王炸";
            }
          };

          '''
              if marker not in text:
                  raise SystemExit("findSuggestedIndexes marker not found")
              text = text.replace(marker, addition + marker, 1)

          state_marker = "  const { state } = React.useContext(GuandanStateContext);\n"
          if "const [suggestionText, setSuggestionText]" not in text:
              if state_marker not in text:
                  raise SystemExit("component state marker not found")
              text = text.replace(
                  state_marker,
                  state_marker + "  const [suggestionText, setSuggestionText] = React.useState<string | null>(null);\n",
                  1,
              )

          reset_marker = "  if (!shouldCheck || state.level === null) return null;\n"
          if "setSuggestionText(null);" not in text:
              if reset_marker not in text:
                  raise SystemExit("suggestion reset marker not found")
              text = text.replace(
                  reset_marker,
                  "  React.useEffect(() => {\n    setSuggestionText(null);\n  }, [state.lastPlay, state.turn]);\n\n" + reset_marker,
                  1,
              )

          select_marker = "    selectSuggestedCards(state.hand, indexes, state.level!);\n"
          if "setSuggestionText(description);" not in text:
              if select_marker not in text:
                  raise SystemExit("suggestion selection marker not found")
              text = text.replace(
                  select_marker,
                  select_marker
                  + "    const description = describeSuggestedCards(\n"
                  + "      indexes.map((index) => state.hand[index]),\n"
                  + "    );\n"
                  + "    setSuggestionText(description);\n",
                  1,
              )

          display_marker = "      </button>\n    </div>"
          if "建议：{suggestionText}" not in text:
              if display_marker not in text:
                  raise SystemExit("suggestion display marker not found")
              text = text.replace(
                  display_marker,
                  "      </button>\n"
                  + "      {suggestionText !== null && (\n"
                  + "        <div role=\"status\" style={{marginTop: \"6px\", fontWeight: 700}}>\n"
                  + "          建议：{suggestionText}\n"
                  + "        </div>\n"
                  + "      )}\n"
                  + "    </div>",
                  1,
              )

          path.write_text(text)
          PY
      - name: Format changed frontend file
        working-directory: frontend
        run: ./node_modules/.bin/prettier src/GuandanNoBeatHint.tsx --write
      - name: Verify formatting
        working-directory: frontend
        run: ./node_modules/.bin/prettier src/GuandanNoBeatHint.tsx --check
      - name: Commit suggestion description
        run: |
          if git diff --quiet -- frontend/src/GuandanNoBeatHint.tsx; then
            echo "Guandan suggestion description is already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/GuandanNoBeatHint.tsx
          git commit -m "feat: show Guandan suggestion description"
          git push
