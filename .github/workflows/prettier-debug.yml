name: Prettier Guandan fix

on:
  push:
    branches: [feature/guandan-frontend]
    paths:
      - ".github/workflows/prettier-debug.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install
      - name: Format Guandan frontend files with project Prettier
        working-directory: frontend
        run: yarn prettier src/guandan.css src/GuandanTable.tsx src/Root.tsx --write
      - name: Commit formatted frontend files
        run: |
          if git diff --quiet -- frontend/src/guandan.css frontend/src/GuandanTable.tsx frontend/src/Root.tsx; then
            echo "Frontend files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/guandan.css frontend/src/GuandanTable.tsx frontend/src/Root.tsx
          git commit -m "style: format Guandan frontend with project Prettier"
          git push
