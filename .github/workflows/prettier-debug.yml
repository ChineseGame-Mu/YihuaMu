name: Prettier Draw fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/prettier-debug.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install
      - name: Format Draw.tsx with project Prettier
        working-directory: frontend
        run: yarn prettier src/Draw.tsx --write
      - name: Commit formatted Draw.tsx
        run: |
          if git diff --quiet -- frontend/src/Draw.tsx; then
            echo "Draw.tsx already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/Draw.tsx
          git commit -m "style: format Draw.tsx with project Prettier"
          git push
