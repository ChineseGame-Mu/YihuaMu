name: One-time Guandan Bottom-right Formatting
on:
  push:
    branches:
      - preview/guandan-room-presence-fix-20261001
    paths:
      - .github/workflows/guandan-bottom-right-format-20261008.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-changed-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Format changed Guandan UI files
        working-directory: frontend
        run: |
          ./node_modules/.bin/prettier --write \
            src/GuandanTable.tsx \
            src/guandan-private-layout-20260928.css \
            src/guandanAutoLayoutOptions.test.ts
          ./node_modules/.bin/prettier --check \
            src/GuandanTable.tsx \
            src/guandan-private-layout-20260928.css \
            src/guandanAutoLayoutOptions.test.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/GuandanTable.tsx frontend/src/guandan-private-layout-20260928.css frontend/src/guandanAutoLayoutOptions.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format Guandan bottom-right controls"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
