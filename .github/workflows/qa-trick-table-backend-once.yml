name: QA trick table backend once
on:
  push:
    branches: ["cleanroom/yihua-game-20260826"]
    paths: [".github/workflows/qa-trick-table-backend-once.yml"]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanroom/yihua-game-20260826
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run Guandan backend tests
        run: cargo test -p shengji guandan --lib
      - name: Verify trick collection invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('backend/src/guandan_handler.rs').read_text()
          assert s.count('trick_complete = true;') >= 2
          end=s.split('GuandanClientMessage::EndRound => {',1)[1]
          assert 'state.game.table_plays.clear();' in end
          assert 'state.game.last_play.clear();' in end
          assert 'state.game.last_player = None;' in end
          PY
