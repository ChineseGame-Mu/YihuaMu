name: QA Guandan 18 full robot games

on:
  push:
    branches: [optimize/guandan-online-performance-20260826]
    paths:
      - .github/workflows/qa-guandan-12-full-games-20260826.yml

permissions:
  contents: read

jobs:
  robot-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install websocket client
        run: python -m pip install --quiet 'websockets>=12,<16'

      - name: Play 18 complete online games across 4-14 player tables
        run: |
          python - <<'PY'
          import asyncio
          import json
          import time
          import uuid
          import websockets

          URI = "wss://chinesegame-yihua.onrender.com/api/guandan"
          TABLE_SIZES = [4, 6, 8, 10, 12, 14]
          REPEATS = 3
          RANK_POWER = {"Two":2,"Three":3,"Four":4,"Five":5,"Six":6,"Seven":7,"Eight":8,"Nine":9,"Ten":10,"Jack":11,"Queen":12,"King":13,"Ace":14}

          def card_power(card, level):
              if "Joker" in card: return 16 if card["Joker"] == "Small" else 17
              rank = card["Suited"]["rank"]
              return 15 if rank == level else RANK_POWER[rank]

          async def recv_json(ws, timeout=20):
              raw = await asyncio.wait_for(ws.recv(), timeout)
              if isinstance(raw, bytes): raw = raw.decode()
              return json.loads(raw)

          async def until_direct(ws, predicate, timeout=25):
              end = asyncio.get_running_loop().time() + timeout
              while True:
                  left = end - asyncio.get_running_loop().time()
                  if left <= 0: raise TimeoutError("direct message timeout")
                  msg = await recv_json(ws, left)
                  if msg.get("type") == "error": raise AssertionError(msg)
                  if predicate(msg): return msg

          class Client:
              def __init__(self, seat, ws):
                  self.seat=seat; self.ws=ws; self.hand=[]; self.state=None; self.started=None; self.state_seq=0; self.error=None; self.condition=asyncio.Condition(); self.task=None
              async def reader(self):
                  try:
                      async for raw in self.ws:
                          if isinstance(raw, bytes): raw=raw.decode()
                          msg=json.loads(raw); kind=msg.get("type")
                          async with self.condition:
                              if kind=="error": self.error=msg
                              elif kind=="hand": self.hand=msg.get("cards",[])
                              elif kind=="started": self.started=msg
                              elif kind=="state": self.state=msg; self.state_seq+=1
                              self.condition.notify_all()
                  except Exception as exc:
                      async with self.condition:
                          self.error={"type":"reader_exception","message":repr(exc)}; self.condition.notify_all()
              async def wait_for(self,predicate,timeout=20):
                  async def _wait():
                      async with self.condition:
                          while not predicate():
                              if self.error is not None: raise AssertionError(self.error)
                              await self.condition.wait()
                  await asyncio.wait_for(_wait(),timeout)
              async def wait_new_state(self,seq,timeout=20):
                  await self.wait_for(lambda:self.state_seq>seq,timeout); return self.state

          async def one_game(size, rep, num):
              room=f"qa18_{size}_{rep}_{int(time.time()*1000)}_{uuid.uuid4().hex[:6]}"; clients=[]; started_at=time.monotonic()
              try:
                  for seat in range(size):
                      ws=await websockets.connect(URI,open_timeout=20,close_timeout=5,ping_interval=20,ping_timeout=20,max_queue=4096)
                      await until_direct(ws,lambda m:m.get("type")=="connected")
                      await ws.send(json.dumps({"type":"join","room":room,"name":f"QA机器人{num}-{seat+1}"},ensure_ascii=False))
                      joined=await until_direct(ws,lambda m:m.get("type")=="joined"); assert joined.get("seat")==seat
                      clients.append(Client(seat,ws))
                  for c in clients: c.task=asyncio.create_task(c.reader())
                  await clients[0].ws.send(json.dumps({"type":"start","player_count":size}))
                  mon=clients[0]
                  await mon.wait_for(lambda:mon.state is not None and len(mon.state.get("initial_draw",[]))==size and mon.started is not None,30)
                  for c in clients:
                      await c.wait_for(lambda c=c:c.started is not None and c.started.get("player_count")==size and len(c.hand)==27,30)
                  state=mon.state; assert state.get("hand_counts")==[27]*size
                  assert state.get("turn")==state.get("initial_draw_winner")
                  actions=0; max_actions=size*27*(size+3)
                  while state.get("last_game_winner") is None:
                      assert actions<max_actions
                      seat=state["turn"]; actor=clients[seat]; expected=state["hand_counts"][seat]
                      await actor.wait_for(lambda:len(actor.hand)==expected,20); assert expected>0
                      last=state.get("last_play",[]); level=state["level"]
                      if not last:
                          idx=min(range(len(actor.hand)),key=lambda i:(card_power(actor.hand[i],level),i)); command={"type":"play","card_indexes":[idx]}
                      else:
                          power=card_power(last[0],level); options=[(card_power(card,level),i) for i,card in enumerate(actor.hand) if card_power(card,level)>power]
                          command={"type":"play","card_indexes":[min(options)[1]]} if options else {"type":"pass"}
                      seq=mon.state_seq; await actor.ws.send(json.dumps(command)); state=await mon.wait_new_state(seq,20); actions+=1
                  finish=state.get("finish_order",[]); winner=state.get("last_game_winner")
                  assert len(finish)==size and finish[0]==winner and sum(state.get("hand_counts",[]))==0
                  elapsed=time.monotonic()-started_at
                  print(f"FULL_GAME_{num}_OK size={size} winner={winner+1} actions={actions} seconds={elapsed:.1f}",flush=True)
                  return (size,winner+1)
              finally:
                  for c in clients:
                      if c.task: c.task.cancel()
                  await asyncio.gather(*(c.task for c in clients if c.task),return_exceptions=True)
                  await asyncio.gather(*(c.ws.close() for c in clients),return_exceptions=True)

          async def main():
              results=[]; num=0
              for rep in range(1,REPEATS+1):
                  for size in TABLE_SIZES:
                      num+=1; results.append(await one_game(size,rep,num)); await asyncio.sleep(.5)
              assert len(results)==18
              for size in TABLE_SIZES: assert sum(1 for s,_ in results if s==size)==3
              print("QA_18_FULL_GAMES_ALL_OK",flush=True)
              print(json.dumps(results),flush=True)
          asyncio.run(main())
          PY
