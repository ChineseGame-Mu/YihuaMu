name: QA Guandan between-round frontend once

on:
  push:
    branches: [feature/guandan-between-round-join-reorder-20260827]
    paths:
      - .github/workflows/qa-guandan-between-round-frontend-once-20260827.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Normalize guarded duplicate expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/patch_guandan_between_round_frontend_20260827.py')
          text = path.read_text()
          old = '''def once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f'{label}: expected 1 match, found {count}')\n    return text.replace(old, new, 1)\n'''
          new = '''def once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    duplicate_first = {\n        'waiting pending players protocol',\n        'waiting reducer pending players',\n    }\n    expected = 2 if label in duplicate_first else 1\n    if count != expected:\n        raise SystemExit(f'{label}: expected {expected} match(es), found {count}')\n    return text.replace(old, new, 1)\n'''
          if text.count(old) != 1:
              raise SystemExit('guard helper normalization target mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply guarded frontend and seat-sync patch
        run: python .github/scripts/patch_guandan_between_round_frontend_20260827.py
      - name: Install frontend dependencies
        run: yarn --cwd frontend install --frozen-lockfile
      - name: Format touched frontend files
        run: yarn --cwd frontend prettier --write src/guandanProtocol.ts src/GuandanStateProvider.tsx src/GuandanTable.tsx
      - name: Build frontend
        run: yarn --cwd frontend build
      - name: Test frontend
        run: yarn --cwd frontend test --runInBand
      - name: Lint frontend
        run: yarn --cwd frontend lint
      - name: Check touched frontend formatting
        run: yarn --cwd frontend prettier --check src/guandanProtocol.ts src/GuandanStateProvider.tsx src/GuandanTable.tsx
      - name: Format Rust
        run: cargo fmt --all -- --check
      - name: Test Guandan backend
        run: cargo test -p shengji guandan -- --nocapture
      - name: Verify formal diff scope
        run: |
          git diff --check
          git diff --name-only -- backend/src/guandan_handler.rs frontend/src/GuandanStateProvider.tsx frontend/src/GuandanTable.tsx frontend/src/guandanProtocol.ts
          test "$(git diff --name-only -- backend/src/guandan_handler.rs frontend/src/GuandanStateProvider.tsx frontend/src/GuandanTable.tsx frontend/src/guandanProtocol.ts | sort | tr '\n' ' ')" = "backend/src/guandan_handler.rs frontend/src/GuandanStateProvider.tsx frontend/src/GuandanTable.tsx frontend/src/guandanProtocol.ts "
      - name: Stage verified files for artifact
        run: |
          mkdir -p verified/backend/src verified/frontend/src
          cp backend/src/guandan_handler.rs verified/backend/src/guandan_handler.rs
          cp frontend/src/GuandanStateProvider.tsx verified/frontend/src/GuandanStateProvider.tsx
          cp frontend/src/GuandanTable.tsx verified/frontend/src/GuandanTable.tsx
          cp frontend/src/guandanProtocol.ts verified/frontend/src/guandanProtocol.ts
      - uses: actions/upload-artifact@v4
        with:
          name: guandan-between-round-verified-files
          path: verified/
          if-no-files-found: error
          retention-days: 1
