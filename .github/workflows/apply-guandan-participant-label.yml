name: Apply Guandan Participant Label

on:
  push:
    branches:
      - fix/guandan-single-viewport-20260822
    paths:
      - .github/workflows/apply-guandan-participant-label.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guandan-single-viewport-20260822
      - name: Simplify participant display
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/GuandanTable.tsx')
          text = p.read_text(encoding='utf-8')
          old = '''            <div
              className="guandan-participant-names"
              role="status"
              aria-label="当前参赛玩家"
            >
              <strong>当前参赛玩家：</strong>
              {state.players.length === 0
                ? "等待玩家加入"
                : state.players
                    .map((player, index) => `玩家${index + 1}：${player}`)
                    .join(" ｜ ")}
            </div>'''
          new = '''            <div
              className="guandan-participant-names"
              role="status"
              aria-label="参赛玩家"
            >
              <strong>参赛玩家：</strong>
              {state.players.length === 0
                ? "等待玩家加入"
                : state.players.join(" ｜ ")}
            </div>'''
          if old not in text:
              raise SystemExit('participant block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/GuandanTable.tsx
          git commit -m 'ui: simplify Guandan participant names'
          git push
