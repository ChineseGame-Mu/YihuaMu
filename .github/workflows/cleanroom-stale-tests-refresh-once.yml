name: Cleanroom Stale Tests Refresh Once

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanroom/yihua-game-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh stale expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('yihua-game/test')
          files = [
              'complete-hand-state-matrix.test.ts',
              'hand-comparison-boundary-matrix.test.ts',
              'hand-complete-matrix.test.ts',
              'hand-precedence-matrix.test.ts',
              'hand-sequence-comparison-matrix.test.ts',
              'hand-sequence-edge.test.ts',
          ]
          for name in files:
              p = root / name
              s = p.read_text()
              s = s.replace('suited("2", "clubs"),\n      suited("3", "diamonds"),\n      suited("4", "hearts"),\n      suited("5", "spades"),\n      suited("6", "clubs"),', 'suited("J", "clubs"),\n      suited("Q", "diamonds"),\n      suited("K", "hearts"),\n      suited("A", "spades"),\n      suited("2", "clubs"),')
              s = s.replace('suited("2", "clubs"),\n        suited("3", "hearts"),\n        suited("4", "spades"),\n        suited("5", "diamonds"),\n        suited("6", "clubs"),', 'suited("J", "clubs"),\n        suited("Q", "hearts"),\n        suited("K", "spades"),\n        suited("A", "diamonds"),\n        suited("2", "clubs"),')
              s = s.replace('suited("2"),\n        suited("3", "hearts"),\n        suited("4"),\n        suited("5", "spades"),\n        suited("6"),', 'suited("J"),\n        suited("Q", "hearts"),\n        suited("K"),\n        suited("A", "spades"),\n        suited("2"),')
              s = s.replace('suited("2", "clubs"),\n        suited("3", "diamonds"),\n        suited("4", "hearts"),\n        suited("5", "spades"),\n        suited("6", "clubs"),', 'suited("J", "clubs"),\n        suited("Q", "diamonds"),\n        suited("K", "hearts"),\n        suited("A", "spades"),\n        suited("2", "clubs"),')
              s = s.replace('suited("2", "hearts"),\n      suited("3", "hearts"),\n      suited("4", "hearts"),\n      suited("5", "hearts"),\n      suited("6", "hearts"),', 'suited("J", "hearts"),\n      suited("Q", "hearts"),\n      suited("K", "hearts"),\n      suited("A", "hearts"),\n      suited("2", "hearts"),')
              s = s.replace('suited("2", "clubs"),\n        suited("3", "diamonds"),\n        suited("4", "spades"),\n        suited("5", "hearts"),\n        suited("6", "clubs"),', 'suited("J", "clubs"),\n        suited("Q", "diamonds"),\n        suited("K", "spades"),\n        suited("A", "hearts"),\n        suited("2", "clubs"),')
              p.write_text(s)

          p = root / 'approved-cleanroom-lobby-baseline.test.ts'
          s = p.read_text().replace('expect(source).toContain("房间：");', 'expect(source).toContain(\'htmlFor="cleanroom-room"\');')
          s = s.replace('expect(source).toContain(\'url.searchParams.set("room", legacyUiRoom)\');', 'expect(source).toContain(\'url.searchParams.set("room", roomId)\');')
          p.write_text(s)

          p = root / 'approved-frontend-bridge.test.ts'
          s = p.read_text().replace('    expect(entry).toContain(\'const legacyUiRoom = "0001"\');\n', '')
          s = s.replace('expect(entry).toContain(\'url.searchParams.set("room", legacyUiRoom)\');', 'expect(entry).toContain(\'url.searchParams.set("room", roomId)\');')
          p.write_text(s)
          PY
      - name: Format touched tests
        working-directory: yihua-game
        run: npx prettier@3.4.1 --write "test/**/*.ts"
      - name: Commit refreshed tests
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yihua-game/test
          git commit -m "test(cleanroom): align stale expectations with approved rules"
          git push origin HEAD:cleanroom/yihua-game-20260826
