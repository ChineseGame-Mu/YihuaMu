name: Yihua Game Three-Round Bot Verification

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
    paths:
      - ".github/workflows/cleanroom-yihua-game-three-round-bot.yml"
      - "yihua-game/src/core/**"
      - "yihua-game/test/**"
  workflow_dispatch:

jobs:
  three-round-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: yihua-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build standalone server
        run: npm run build
      - name: Bot verification for all supported table sizes
        env:
          SOAK_DURATION_MS: "10000"
          SOAK_PLAYER_COUNTS: "4,6,8,10,12,14"
          SOAK_RECONNECT_EVERY: "10"
          SOAK_ACTION_LIMIT: "10000"
        run: |
          set -euo pipefail
          node scripts/soak-websocket.mjs | tee /tmp/three-round-bot.log
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const lines = fs.readFileSync("/tmp/three-round-bot.log", "utf8").trim().split(/\n+/);
          const result = [...lines].reverse().map((line) => {
            try { return JSON.parse(line); } catch { return null; }
          }).find((value) => value?.tables);
          if (!result) throw new Error("bot result JSON missing");
          const expected = [4, 6, 8, 10, 12, 14];
          for (const playerCount of expected) {
            const table = result.tables.find((item) => item.playerCount === playerCount);
            if (!table) throw new Error(`missing ${playerCount}-player bot table`);
            if (table.rounds < 3) throw new Error(`${playerCount}-player table completed only ${table.rounds} rounds`);
            if (table.deadlocks || table.stateErrors || table.crashes) {
              throw new Error(`${playerCount}-player table has integrity failures: ${JSON.stringify(table)}`);
            }
            console.log(JSON.stringify({type:"three_round_bot_pass", playerCount, validatedRounds:3, observedRounds:table.rounds, actions:table.actions, plays:table.plays, passes:table.passes, reconnects:table.reconnects}));
          }
          NODE
