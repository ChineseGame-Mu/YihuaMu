name: Yihua Game Three-Round Bot Verification

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
    paths:
      - ".github/workflows/cleanroom-yihua-game-three-round-bot.yml"
      - "yihua-game/src/core/**"
      - "yihua-game/test/**"
      - "backend/src/guandan_handler.rs"
      - "frontend/src/GuandanRoundResultHud.tsx"
      - "frontend/src/GuandanRoundResultHud.test.tsx"
      - "frontend/src/CleanroomEntry.tsx"
  workflow_dispatch:

jobs:
  three-round-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: yihua-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build standalone server
        run: npm run build
      - name: State-machine acceptance - final player auto-place through next round
        run: npm test -- last-place-auto-finish-next-round-matrix.test.ts
      - name: Real 8-player bot full-game verification
        env:
          SOAK_DURATION_MS: "60000"
          SOAK_PLAYER_COUNTS: "8"
          SOAK_RECONNECT_EVERY: "1000000"
          SOAK_ACTION_LIMIT: "100000"
        run: |
          set -euo pipefail
          node scripts/soak-websocket.mjs | tee /tmp/three-round-bot.log
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const lines = fs.readFileSync("/tmp/three-round-bot.log", "utf8").trim().split(/\n+/);
          const result = [...lines].reverse().map((line) => {
            try { return JSON.parse(line); } catch { return null; }
          }).find((value) => value?.tables);
          if (!result) throw new Error("bot result JSON missing");
          const table = result.tables.find((item) => item.playerCount === 8);
          if (!table) throw new Error("missing 8-player bot table");
          if (table.rounds < 3) throw new Error(`8-player table completed only ${table.rounds} full rounds`);
          if (table.deadlocks || table.stateErrors || table.crashes) {
            throw new Error(`8-player table has integrity failures: ${JSON.stringify(table)}`);
          }
          if (!table.plays || table.plays < 1) throw new Error(`8-player run produced no actual plays: ${JSON.stringify(table)}`);
          console.log(JSON.stringify({type:"real_eight_player_full_game_pass", playerCount:8, validatedRounds:3, observedRounds:table.rounds, actions:table.actions, plays:table.plays, passes:table.passes, reconnects:table.reconnects}));
          NODE
      - name: Frontend acceptance - current level and final winner ranking
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install
          npm test -- --runInBand GuandanRoundResultHud.test.tsx
