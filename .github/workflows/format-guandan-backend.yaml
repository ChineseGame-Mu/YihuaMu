name: Format Guandan backend

on:
  push:
    branches:
      - feature/guandan-clean-sync

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/guandan-clean-sync
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust
        run: cargo fmt --all

      - name: Commit backend formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No rustfmt changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/guandan_serving_types.rs backend/src/serving_types.rs backend/tests/guandan_adapter.rs
          git commit -m "style: rustfmt Guandan backend adapter"
          git push origin HEAD:feature/guandan-clean-sync
