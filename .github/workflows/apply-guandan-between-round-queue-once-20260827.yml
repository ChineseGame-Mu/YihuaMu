name: Apply Guandan between-round queue backend once

on:
  push:
    branches: [feature/guandan-between-round-join-reorder-20260827]
    paths:
      - .github/workflows/apply-guandan-between-round-queue-once-20260827.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guandan-between-round-join-reorder-20260827
          fetch-depth: 0

      - name: Normalize guarded script expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/patch_guandan_between_round_queue_20260827.py')
          text = path.read_text()
          text = text.replace(
              '''handler = replace_once(
              handler,
              "        players: Vec<String>,\\n        observers: Vec<String>,",
              "        players: Vec<String>,\\n        pending_players: Vec<String>,\\n        observers: Vec<String>,",
              "state message pending field",
          )'''.replace('          handler', '    handler').replace('          "', '    "').replace('          )', ')'),
              '''handler = replace_n(
              handler,
              "        players: Vec<String>,\\n        observers: Vec<String>,",
              "        players: Vec<String>,\\n        pending_players: Vec<String>,\\n        observers: Vec<String>,",
              2,
              "waiting/state message pending field",
          )'''.replace('          handler', '    handler').replace('          "', '    "').replace('          2', '    2').replace('          )', ')'),
          )
          text = text.replace(
              '''handler = replace_once(
              handler,
              "        players: game.player_names.clone(),\\n        observers: observers_for(key),",
              "        players: game.player_names.clone(),\\n        pending_players: game.pending_players.clone(),\\n        observers: observers_for(key),",
              "state message pending value",
          )'''.replace('          handler', '    handler').replace('          "', '    "').replace('          )', ')'),
              '''handler = replace_n(
              handler,
              "        players: game.player_names.clone(),\\n        observers: observers_for(key),",
              "        players: game.player_names.clone(),\\n        pending_players: game.pending_players.clone(),\\n        observers: observers_for(key),",
              2,
              "waiting/state message pending value",
          )'''.replace('          handler', '    handler').replace('          "', '    "').replace('          2', '    2').replace('          )', ')'),
          )
          path.write_text(text)
          PY

      - name: Apply guarded backend patch
        run: python .github/scripts/patch_guandan_between_round_queue_20260827.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Install frontend dependencies
        run: yarn --cwd frontend install --frozen-lockfile

      - name: Build frontend for backend include_dir
        run: yarn --cwd frontend build

      - name: Run Guandan backend tests
        run: cargo test -p shengji guandan -- --nocapture

      - name: Commit backend changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/guandan_serving_types.rs backend/src/guandan_handler.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No backend changes to commit"
            exit 0
          fi
          git commit -m "feat(guandan): queue joins and allow same-team between-round swaps"
          git push origin HEAD:feature/guandan-between-round-join-reorder-20260827
