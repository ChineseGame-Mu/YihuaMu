name: Fix public four-player finish order once

on:
  push:
    branches:
      - fix/guandan-single-viewport-20260822

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guandan-single-viewport-20260822
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Put complete four-player order on public table
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/GuandanTable.tsx')
          text = p.read_text(encoding='utf-8')
          marker = '''            {state.lastGameWinner !== null && lastWinnerName !== null && (\n'''
          block = '''            {state.finishOrder.length === 4 && (\n              <section\n                className="guandan-notice-panel"\n                role="status"\n                aria-label="四位玩家输赢顺序"\n              >\n                <strong>四位玩家输赢顺序：</strong>\n                {state.finishOrder\n                  .map(\n                    (seat, index) =>\n                      `第${index + 1}名 ${state.players[seat] ?? `玩家${seat + 1}`}`,\n                  )\n                  .join(" ｜ ")}\n              </section>\n            )}\n\n'''
          if block in text:
              raise SystemExit(0)
          if marker not in text:
              raise SystemExit('public result insertion point not found')
          p.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')
          PY
      - name: Format frontend
        run: npx prettier@3.4.1 --write frontend/src/GuandanTable.tsx
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/GuandanTable.tsx
          git commit -m 'fix(guandan): show complete four-player order on public table [skip ci]'
          git push
