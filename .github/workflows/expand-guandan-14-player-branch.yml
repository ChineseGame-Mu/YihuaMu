name: Expand Guandan 14-player branch

on:
  push:
    branches:
      - feature/guandan-up-to-14-players-20260825
    paths:
      - .github/scripts/expand_guandan_14_players_20260825.py
      - .github/workflows/expand-guandan-14-player-branch.yml

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guandan-up-to-14-players-20260825
          fetch-depth: 0

      - name: Apply isolated multiplayer patch
        run: python .github/scripts/expand_guandan_14_players_20260825.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Build frontend
        working-directory: frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build

      - name: Test Guandan backend and core
        run: cargo test -p shengji guandan --quiet

      - name: Commit expansion only to feature branch
        run: |
          if git diff --quiet -- backend/src/guandan_handler.rs frontend/src/GuandanTable.tsx; then
            echo "No expansion changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/guandan_handler.rs frontend/src/GuandanTable.tsx
          git commit -m "feat(guandan): isolated tables up to 14 players"
          git push origin HEAD:feature/guandan-up-to-14-players-20260825
