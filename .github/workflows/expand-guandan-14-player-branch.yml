name: Expand Guandan 14-player branch

on:
  push:
    branches:
      - feature/guandan-up-to-14-players-20260825
    paths:
      - .github/scripts/polish_guandan_14_players_20260825.py
      - .github/workflows/expand-guandan-14-player-branch.yml
      - frontend/src/guandanProtocol.ts

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guandan-up-to-14-players-20260825
          fetch-depth: 0

      - name: Apply multiplayer safety polish
        run: python .github/scripts/polish_guandan_14_players_20260825.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Build frontend
        working-directory: frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build

      - name: Test Guandan backend and core
        run: cargo test -p shengji guandan --quiet

      - name: Commit polish only to feature branch
        run: |
          if git diff --quiet -- backend/src/guandan_handler.rs frontend/src/GuandanTable.tsx frontend/src/guandanProtocol.ts frontend/src/style.scss frontend/src/style.css; then
            echo "No polish changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/guandan_handler.rs frontend/src/GuandanTable.tsx frontend/src/guandanProtocol.ts
          git add frontend/src/style.scss frontend/src/style.css 2>/dev/null || true
          git commit -m "feat(guandan): polish isolated 14-player tables"
          git push origin HEAD:feature/guandan-up-to-14-players-20260825
