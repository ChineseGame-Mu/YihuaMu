name: Fix Guandan large enum lint once

on:
  push:
    branches: [fix/guandan-single-viewport-20260822]
    paths: [.github/workflows/fix-guandan-large-enum-lint-once.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guandan-single-viewport-20260822
          fetch-depth: 0
      - name: Apply minimal lint exception
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/main.rs')
          s = p.read_text()
          marker = '#![deny(warnings)]\n'
          replacement = '#![deny(warnings)]\n#![allow(clippy::large_enum_variant)]\n'
          if replacement not in s:
              if marker not in s:
                  raise SystemExit('missing deny(warnings) marker')
              s = s.replace(marker, replacement, 1)
              p.write_text(s)
          PY
      - name: Verify Rust
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy
      - name: Commit minimal fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/main.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: allow Guandan server message enum size lint"
          git push origin HEAD:fix/guandan-single-viewport-20260822
