name: Cleanroom remove duplicate level HUD once

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
    paths:
      - .github/workflows/cleanroom-remove-duplicate-level-hud-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanroom/yihua-game-20260826
      - name: Remove legacy duplicate level badge
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/GuandanTable.tsx')
          text = path.read_text()
          old = '''            <aside className="guandan-scoreboard" aria-label="当前级数">\n              <span>当前级数</span>\n              <strong>\n                {state.level === null ? "—" : rankLabel[state.level]}\n              </strong>\n            </aside>\n'''
          if old not in text:
              raise SystemExit('legacy scoreboard block not found')
          path.write_text(text.replace(old, '', 1))
          PY
          git rm .github/workflows/cleanroom-remove-duplicate-level-hud-once.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/GuandanTable.tsx
          git commit -m "fix(cleanroom): remove duplicate legacy level badge"
          git push origin HEAD:cleanroom/yihua-game-20260826
