name: Cleanroom Short Link Gate

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  short-link:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SHORT_URL: https://yihua-mu.vercel.app
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Short link must serve current Cleanroom commit
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const expected = process.env.EXPECTED_COMMIT;
          let actual = null;
          for (let attempt = 1; attempt <= 24; attempt++) {
            const response = await page.goto(process.env.SHORT_URL, {waitUntil:'domcontentloaded', timeout:60000});
            if (!response || !response.ok()) throw new Error(`short link HTTP ${response?.status()}`);
            await page.waitForTimeout(1200);
            actual = await page.locator('html').getAttribute('data-cleanroom-commit');
            console.log(JSON.stringify({type:'short_link_probe',attempt,expected,actual,url:page.url()}));
            if (actual === expected) break;
            if (attempt < 24) await page.waitForTimeout(10000);
          }
          if (actual !== expected) throw new Error(`short link stale or not bound to current master: expected ${expected}, got ${actual}`);

          const room = page.locator('#cleanroom-room');
          await room.waitFor({state:'visible',timeout:30000});
          if (await room.evaluate(el => el.tagName) !== 'SELECT') throw new Error('room control is not SELECT');
          const options = await room.locator('option').evaluateAll(nodes => nodes.map(n => n.value));
          const expectedRooms = ['0001','0002','0003','0004'];
          if (JSON.stringify(options) !== JSON.stringify(expectedRooms)) throw new Error(`room options mismatch: ${options.join(',')}`);
          if (await page.locator('input#cleanroom-room, input[name="room"], input[name="cleanroomRoom"]').count()) throw new Error('free-text room input detected');
          console.log(JSON.stringify({type:'short_link_gate_pass',url:process.env.SHORT_URL,commit:actual,rooms:options}));
          await browser.close();
          NODE
