name: One-time Guandan test entry fix

on:
  push:
    branches:
      - optimize/guandan-online-performance-20260826
    paths:
      - '.github/workflows/fix-guandan-deal-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize/guandan-online-performance-20260826
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch test entry only
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/GuandanTable.tsx')
          s = p.read_text()

          old = '''  const autoJoinFromLink = React.useRef(\n    query.has("room") && query.has("name") && query.get("name")!.trim() !== "",\n  );'''
          new = '''  const autoJoinFromLink = React.useRef(\n    query.get("test") !== "1" &&\n      query.has("room") &&\n      query.has("name") &&\n      query.get("name")!.trim() !== "",\n  );'''
          if old not in s:
              raise SystemExit('autoJoinFromLink block not found')
          s = s.replace(old, new, 1)

          old = '''          {status === "connected" && isValidRoomCode(room) && name.trim() && (\n            <p>正在自动恢复房间…</p>\n          )}'''
          new = '''          {!testMode &&\n            status === "connected" &&\n            isValidRoomCode(room) &&\n            name.trim() && <p>正在自动恢复房间…</p>}'''
          if old not in s:
              raise SystemExit('auto restore hint block not found')
          s = s.replace(old, new, 1)

          old = '''          <div className="guandan-actions">\n            {Array.from('''
          new = '''          <p>测试链接会预填“玩家1、玩家2…”作为姓名；打开后可先改成真实姓名，再点“加入房间”。全部玩家加入后，会显示“抽牌决定首家并开始”按钮。</p>\n          <div className="guandan-actions">\n            {Array.from('''
          if old not in s:
              raise SystemExit('test action block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Format frontend
        working-directory: frontend
        run: npx prettier@3.4.1 --write src/GuandanTable.tsx

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/GuandanTable.tsx
          git diff --cached --quiet || git commit -m "fix(guandan): allow renaming before test join"
          git push
