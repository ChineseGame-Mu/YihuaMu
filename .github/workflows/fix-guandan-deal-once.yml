name: One-time Guandan deal synchronization fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-guandan-deal-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch Guandan start/deal synchronization
        shell: python
        run: |
          from pathlib import Path

          p = Path('frontend/src/GuandanTable.tsx')
          s = p.read_text()
          old = '''  const gameStarted = serverDealt || startRequested;\n'''
          new = '''  const gameStarted = serverDealt || state.playerCount !== null;\n'''
          if old not in s:
              raise SystemExit('frontend gameStarted line not found')
          s = s.replace(old, new, 1)

          marker = '''  React.useEffect(() => {\n    if (serverDealt) setStartRequested(true);\n  }, [serverDealt]);\n'''
          replacement = '''  React.useEffect(() => {\n    if (serverDealt || state.playerCount !== null) setStartRequested(true);\n  }, [serverDealt, state.playerCount]);\n\n  React.useEffect(() => {\n    if (state.error !== null && state.hand.length === 0) {\n      setStartRequested(false);\n    }\n  }, [state.error, state.hand.length]);\n'''
          if marker not in s:
              raise SystemExit('frontend serverDealt effect not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)

          p = Path('backend/src/guandan_handler.rs')
          s = p.read_text()
          old = '''                            if state.game.started {\n                                send(&tx_sub, &state_message(&key, &state.game));\n                                if let Some(seat_sub) = seat_sub {\n'''
          new = '''                            if state.game.started {\n                                send(\n                                    &tx_sub,\n                                    &GuandanServerMessage::Started {\n                                        player_count: state.game.player_names.len(),\n                                        cards_per_player: CARDS_PER_PLAYER,\n                                    },\n                                );\n                                send(&tx_sub, &state_message(&key, &state.game));\n                                if let Some(seat_sub) = seat_sub {\n'''
          if old not in s:
              raise SystemExit('backend subscription started block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install

      - name: Format frontend
        working-directory: frontend
        run: yarn prettier src/GuandanTable.tsx --write

      - name: Format Rust
        run: cargo fmt --all

      - name: Test frontend
        working-directory: frontend
        run: yarn test --runInBand

      - name: Test Guandan backend
        run: cargo test -p backend guandan --no-fail-fast

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/GuandanTable.tsx backend/src/guandan_handler.rs
          git commit -m "fix: synchronize Guandan start and deal for all players"
          git push
