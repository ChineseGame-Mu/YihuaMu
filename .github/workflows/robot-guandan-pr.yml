name: Robot Guandan PR

on:
  pull_request:
    branches: [master]

jobs:
  robot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websockets
      - name: Finish one four-player robot game
        env:
          WS_URL: wss://chinesegame-yihua.onrender.com/api/guandan
          ROOM: '0004'
        run: |
          python - <<'PY'
          import asyncio,json,os,time,collections
          import websockets

          URL=os.environ['WS_URL']; ROOM=os.environ['ROOM']; NAMES=['机器人1','机器人2','机器人3','机器人4']

          class Bot:
              def __init__(self,name):
                  self.name=name; self.ws=None; self.seat=None; self.state=None; self.errors=[]
              async def send(self,o): await self.ws.send(json.dumps(o,ensure_ascii=False))
              async def reader(self):
                  async for raw in self.ws:
                      m=json.loads(raw); t=m.get('type')
                      if t=='joined': self.seat=m.get('seat')
                      elif t=='state': self.state=m
                      elif t=='error': self.errors.append(m.get('message','error'))

          async def wait_for(pred,timeout=10,step=.015):
              end=time.time()+timeout
              while time.time()<end:
                  v=pred()
                  if v: return v
                  await asyncio.sleep(step)
              return None

          def skey(s):
              if not s:return None
              return json.dumps({
                  'turn':s.get('turn'),'hand_counts':s.get('hand_counts'),'last_play':s.get('last_play'),
                  'last_player':s.get('last_player'),'passes':s.get('passes'),'finish_order':s.get('finish_order'),
                  'last_game_winner':s.get('last_game_winner'),'last_promotion_steps':s.get('last_promotion_steps'),
                  'next_round_phase':s.get('next_round_phase')
              },sort_keys=True,ensure_ascii=False)

          def consensus(bots):
              vals=[(skey(b.state),b.state) for b in bots if b.state]
              if not vals:return None,0
              c=collections.Counter(k for k,_ in vals); k,n=c.most_common(1)[0]
              return next(s for kk,s in vals if kk==k),n

          async def wait_consensus(bots,timeout=5):
              return await wait_for(lambda: (lambda sn: sn if sn[0] is not None and sn[1]>=3 else None)(consensus(bots)),timeout)

          async def act_and_wait(bots,b,msg,timeout=.4):
              cs=await wait_consensus(bots,2)
              if not cs:return False
              before=skey(cs[0]); err0=len(b.errors)
              await b.send(msg)
              end=time.time()+timeout
              while time.time()<end:
                  if len(b.errors)>err0:return False
                  s,n=consensus(bots)
                  if s is not None and n>=3 and skey(s)!=before:return True
                  await asyncio.sleep(.01)
              return False

          def emit(s):
              w=s['last_game_winner']
              print('RESULT_JSON',json.dumps({'winner_seat':w,'winner_name':NAMES[w],'finish_order':s.get('finish_order'),'promotion':s.get('last_promotion_steps'),'phase':s.get('next_round_phase')},ensure_ascii=False))

          async def main():
              bots=[Bot(n) for n in NAMES]
              for b in bots:
                  b.ws=await websockets.connect(URL,open_timeout=20,ping_interval=20,ping_timeout=20)
                  asyncio.create_task(b.reader())
                  await b.send({'type':'join','room':ROOM,'name':b.name})
                  if not await wait_for(lambda b=b:b.seat is not None,10):raise RuntimeError(f'join failed {b.name} {b.errors}')
              cs=await wait_consensus(bots,10)
              if not cs:raise RuntimeError('no shared state')
              print('JOINED',[(b.name,b.seat) for b in bots])
              print('INITIAL',json.dumps(cs[0],ensure_ascii=False))

              s=cs[0]
              if s.get('last_game_winner') is not None and s.get('next_round_phase') is not None:
                  emit(s); return
              if not any(s.get('hand_counts') or []):
                  await act_and_wait(bots,bots[0],{'type':'start','player_count':4},3)
                  cs=await wait_consensus(bots,10); s=cs[0]

              successful=0
              for cycle in range(5000):
                  cs=await wait_consensus(bots,2)
                  if not cs:continue
                  s=cs[0]
                  if s.get('last_game_winner') is not None and s.get('next_round_phase') is not None:
                      print('SUCCESSFUL_ACTIONS',successful); emit(s)
                      for b in bots: await b.ws.close()
                      return
                  turn=s.get('turn'); counts=s.get('hand_counts') or []
                  if turn is None or not 0<=turn<4 or turn>=len(counts) or counts[turn]<=0:
                      await asyncio.sleep(.02); continue
                  b=bots[turn]
                  last=s.get('last_play') or []
                  if not last:
                      if await act_and_wait(bots,b,{'type':'play','card_indexes':[0]},.6):
                          successful+=1
                      else:
                          await asyncio.sleep(.03)
                      continue
                  played=False
                  for idx in range(counts[turn]-1,-1,-1):
                      if await act_and_wait(bots,b,{'type':'play','card_indexes':[idx]},.35):
                          played=True; successful+=1; break
                  if not played:
                      if await act_and_wait(bots,b,{'type':'pass'},.6): successful+=1
                  if cycle%100==0:
                      print('PROGRESS',cycle,'turn',turn,'counts',counts,'finish',s.get('finish_order'))
                  await asyncio.sleep(.015)
              raise RuntimeError('game did not finish within 5000 cycles')

          asyncio.run(main())
          PY
