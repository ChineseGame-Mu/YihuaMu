name: Robot Guandan PR

on:
  pull_request:
    branches: [master]

jobs:
  robot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websockets
      - name: Start ef477f0 backend locally
        run: |
          PORT=3030 CORS_ALLOWED_ORIGINS='*' cargo run -p shengji --features dynamic > /tmp/guandan-server.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3030/runtime.js >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/guandan-server.log
          exit 1
      - name: Robot4 win then tribute return-card exchange
        env:
          WS_URL: ws://127.0.0.1:3030/api/guandan
        run: |
          python - <<'PY'
          import asyncio,json,os,time,collections
          import websockets
          URL=os.environ['WS_URL']; NAMES=['机器人1','机器人2','机器人3','机器人4']

          class Bot:
              def __init__(self,name): self.name=name; self.ws=None; self.seat=None; self.hand=[]; self.state=None; self.errors=[]
              async def send(self,o): await self.ws.send(json.dumps(o,ensure_ascii=False))
              async def reader(self):
                  try:
                      async for raw in self.ws:
                          m=json.loads(raw); t=m.get('type')
                          if t=='joined': self.seat=m.get('seat')
                          elif t=='hand': self.hand=m.get('cards',[])
                          elif t=='state': self.state=m
                          elif t=='error': self.errors.append(m.get('message','error'))
                  except Exception: pass

          async def wait_for(pred,timeout=8,step=.01):
              end=time.time()+timeout
              while time.time()<end:
                  v=pred()
                  if v:return v
                  await asyncio.sleep(step)
              return None

          def sig(s):
              if not s:return None
              return json.dumps({k:s.get(k) for k in ['turn','hand_counts','last_play','last_player','passes','finish_order','last_game_winner','last_game_winner_team','last_promotion_steps','pending_tribute','tribute_resisted','next_round_phase']},sort_keys=True,ensure_ascii=False)

          def consensus(bots):
              vals=[(sig(b.state),b.state) for b in bots if b.state]
              if not vals:return None,0
              c=collections.Counter(k for k,_ in vals); k,n=c.most_common(1)[0]
              return next(s for kk,s in vals if kk==k),n

          async def shared(bots,timeout=5):
              return await wait_for(lambda:(lambda x:x if x[0] is not None and x[1]>=3 else None)(consensus(bots)),timeout)

          async def act(bots,b,msg,timeout=.6):
              cs=await shared(bots,2)
              if not cs:return False
              before=sig(cs[0]); e0=len(b.errors); before_hand=len(b.hand)
              await b.send(msg)
              end=time.time()+timeout
              while time.time()<end:
                  if len(b.errors)>e0:return False
                  s,n=consensus(bots)
                  if len(b.hand)!=before_hand:return True
                  if s is not None and n>=3 and sig(s)!=before:return True
                  await asyncio.sleep(.01)
              return False

          async def connect(room):
              bots=[Bot(n) for n in NAMES]
              for b in bots:
                  b.ws=await websockets.connect(URL,open_timeout=10,ping_interval=20,ping_timeout=20)
                  asyncio.create_task(b.reader())
                  await b.send({'type':'join','room':room,'name':b.name})
                  if not await wait_for(lambda b=b:b.seat is not None,5): raise RuntimeError('join failed '+b.name)
              return bots

          async def close(bots):
              for b in bots:
                  try: await b.ws.close()
                  except: pass

          async def play_to_finish(bots):
              await bots[0].send({'type':'start','player_count':4})
              if not await wait_for(lambda:all(len(b.hand)==27 for b in bots),8): raise RuntimeError('deal failed')
              for cycle in range(8000):
                  cs=await shared(bots,2)
                  if not cs:continue
                  s=cs[0]
                  if s.get('last_game_winner') is not None and s.get('next_round_phase') is not None:return s
                  turn=s.get('turn'); counts=s.get('hand_counts') or []
                  if turn is None or turn>=4 or counts[turn]<=0:
                      await asyncio.sleep(.005); continue
                  b=bots[turn]; last=s.get('last_play') or []
                  if not last:
                      ok=False
                      for idx in range(counts[turn]):
                          if await act(bots,b,{'type':'play','card_indexes':[idx]},.45): ok=True; break
                      if not ok: raise RuntimeError(f'lead stuck {turn} {b.errors[-4:]}')
                  else:
                      played=False
                      for idx in range(counts[turn]):
                          if await act(bots,b,{'type':'play','card_indexes':[idx]},.3): played=True; break
                      if not played and not await act(bots,b,{'type':'pass'},.45): raise RuntimeError(f'follow stuck {turn} {b.errors[-4:]}')
              raise RuntimeError('game did not finish')

          def plan_parts(plan):
              if 'Single' in plan:
                  p=plan['Single']; return [p['giver']],[p['receiver']],'single'
              if 'Double' in plan:
                  p=plan['Double']; return list(p['givers']),list(p['receivers']),'double'
              raise RuntimeError('unknown tribute plan '+repr(plan))

          async def main():
              chosen=None
              for attempt in range(1,9):
                  bots=await connect(f'robot4-tribute-{attempt}')
                  s=await play_to_finish(bots)
                  print('ROUND1',attempt,'winner',s.get('last_game_winner'),'finish',s.get('finish_order'),'promotion',s.get('last_promotion_steps'))
                  if s.get('last_game_winner')==3:
                      chosen=(bots,s); break
                  await close(bots)
              if not chosen: raise RuntimeError('robot4 did not win in 8 attempts')
              bots,s=chosen
              print('ROBOT4_WIN_CONFIRMED',json.dumps(s,ensure_ascii=False))

              # Losing team is seats 0/2; loser manually starts the shuffle, then previous winner deals.
              if not await act(bots,bots[0],{'type':'shuffle_next_round','from_position':None,'to_position':None},2):
                  raise RuntimeError('losing-team shuffle failed '+repr(bots[0].errors[-5:]))
              await wait_for(lambda:bots[0].state and bots[0].state.get('next_round_phase')=='awaiting_deal',5)
              print('SHUFFLE_OK')
              if not await act(bots,bots[3],{'type':'deal_next_round'},2):
                  raise RuntimeError('winner deal failed '+repr(bots[3].errors[-5:]))
              await wait_for(lambda:bots[0].state and bots[0].state.get('next_round_phase') is None,5)
              s=(await shared(bots,5))[0]
              print('ROUND2_AFTER_DEAL',json.dumps(s,ensure_ascii=False))
              if s.get('tribute_resisted'):
                  raise RuntimeError('tribute was resisted in this deal; rerun required')
              plan=s.get('pending_tribute')
              if not plan: raise RuntimeError('expected pending tribute after robot4 win')
              givers,receivers,kind=plan_parts(plan)
              print('TRIBUTE_PLAN',kind,'givers',[NAMES[x] for x in givers],'receivers',[NAMES[x] for x in receivers])

              paid=[]
              for seat in givers:
                  b=bots[seat]; before=list(b.hand); ok=False
                  for idx in range(len(before)):
                      card=before[idx]
                      if await act(bots,b,{'type':'tribute_card','card_index':idx},.7):
                          paid.append((seat,card)); ok=True; print('TRIBUTE_OK',NAMES[seat],json.dumps(card,ensure_ascii=False)); break
                  if not ok: raise RuntimeError(f'tribute failed {NAMES[seat]} {b.errors[-10:]}')

              returned=[]
              for seat in receivers:
                  b=bots[seat]; before=list(b.hand); ok=False
                  for idx in range(len(before)):
                      card=before[idx]
                      if await act(bots,b,{'type':'return_tribute','card_index':idx},.7):
                          returned.append((seat,card)); ok=True; print('RETURN_OK',NAMES[seat],json.dumps(card,ensure_ascii=False)); break
                  if not ok: raise RuntimeError(f'return failed {NAMES[seat]} {b.errors[-10:]}')

              final=(await shared(bots,5))[0]
              print('AFTER_EXCHANGE',json.dumps(final,ensure_ascii=False))
              if final.get('pending_tribute') is not None: raise RuntimeError('tribute exchange did not clear')
              if (final.get('hand_counts') or []) != [27,27,27,27]: raise RuntimeError('hand counts not restored after exchange')
              print('RESULT_JSON',json.dumps({'winner':'机器人4','tribute_kind':kind,'givers':[NAMES[x] for x in givers],'receivers':[NAMES[x] for x in receivers],'tribute_cards':paid,'return_cards':returned,'next_turn':NAMES[final['turn']]},ensure_ascii=False))
              await close(bots)

          asyncio.run(main())
          PY
      - name: Show server tail
        if: always()
        run: tail -80 /tmp/guandan-server.log || true
