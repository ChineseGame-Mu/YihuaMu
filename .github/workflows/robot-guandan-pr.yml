name: Robot Guandan PR

on:
  pull_request:
    branches: [master]

jobs:
  robot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websockets
      - name: Inspect current robot room
        env:
          WS_URL: wss://chinesegame-yihua.onrender.com/api/guandan
          ROOM: '0004'
        run: |
          python - <<'PY'
          import asyncio,json,os,time
          import websockets
          URL=os.environ['WS_URL']; ROOM=os.environ['ROOM']; NAMES=['机器人1','机器人2','机器人3','机器人4']
          async def one(name):
              ws=await websockets.connect(URL,open_timeout=20)
              await ws.send(json.dumps({'type':'join','room':ROOM,'name':name},ensure_ascii=False))
              seat=None; hand=[]; state=None; errors=[]; end=time.time()+4
              while time.time()<end:
                  try: raw=await asyncio.wait_for(ws.recv(),timeout=.5)
                  except asyncio.TimeoutError: continue
                  m=json.loads(raw); t=m.get('type')
                  if t=='joined': seat=m.get('seat')
                  elif t=='hand': hand=m['cards']
                  elif t=='state': state=m
                  elif t=='error': errors.append(m.get('message'))
              print('SNAPSHOT',json.dumps({'name':name,'seat':seat,'hand_len':len(hand),'state':state,'errors':errors},ensure_ascii=False))
              await ws.close()
          async def main():
              await asyncio.gather(*(one(n) for n in NAMES))
          asyncio.run(main())
          PY
