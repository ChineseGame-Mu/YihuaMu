name: Robot Guandan PR

on:
  pull_request:
    branches: [master]

jobs:
  robot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websockets
      - name: Start ef477f0 backend locally
        run: |
          PORT=3030 CORS_ALLOWED_ORIGINS='*' cargo run -p shengji --features dynamic > /tmp/guandan-server.log 2>&1 &
          echo $! > /tmp/guandan-server.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3030/runtime.js >/dev/null 2>&1; then
              echo 'SERVER_READY'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/guandan-server.log
          exit 1
      - name: Play one complete four-player game
        env:
          WS_URL: ws://127.0.0.1:3030/api/guandan
          ROOM: robot-complete-1
        run: |
          python - <<'PY'
          import asyncio, json, os, time, collections
          import websockets

          URL=os.environ['WS_URL']; ROOM=os.environ['ROOM']; NAMES=['机器人1','机器人2','机器人3','机器人4']

          class Bot:
              def __init__(self,name):
                  self.name=name; self.ws=None; self.seat=None; self.hand=[]; self.state=None; self.errors=[]
              async def send(self,o):
                  await self.ws.send(json.dumps(o,ensure_ascii=False))
              async def reader(self):
                  async for raw in self.ws:
                      m=json.loads(raw); t=m.get('type')
                      if t=='joined': self.seat=m.get('seat')
                      elif t=='hand': self.hand=m.get('cards',[])
                      elif t=='state': self.state=m
                      elif t=='error': self.errors.append(m.get('message','error'))

          async def wait_for(pred,timeout=10,step=.01):
              end=time.time()+timeout
              while time.time()<end:
                  v=pred()
                  if v: return v
                  await asyncio.sleep(step)
              return None

          def sig(s):
              if not s: return None
              return json.dumps({k:s.get(k) for k in ['turn','hand_counts','last_play','last_player','passes','finish_order','last_game_winner','last_promotion_steps','next_round_phase']},sort_keys=True,ensure_ascii=False)

          def consensus(bots):
              vals=[(sig(b.state),b.state) for b in bots if b.state]
              if not vals:return None,0
              c=collections.Counter(k for k,_ in vals); k,n=c.most_common(1)[0]
              return next(s for kk,s in vals if kk==k),n

          async def shared(bots,timeout=5):
              return await wait_for(lambda:(lambda x:x if x[0] is not None and x[1]>=3 else None)(consensus(bots)),timeout)

          async def act(bots,b,msg,timeout=.6):
              cs=await shared(bots,2)
              if not cs:return False
              before=sig(cs[0]); e0=len(b.errors)
              await b.send(msg)
              end=time.time()+timeout
              while time.time()<end:
                  if len(b.errors)>e0:return False
                  s,n=consensus(bots)
                  if s is not None and n>=3 and sig(s)!=before:return True
                  await asyncio.sleep(.01)
              return False

          async def main():
              bots=[Bot(n) for n in NAMES]
              tasks=[]
              for b in bots:
                  b.ws=await websockets.connect(URL,open_timeout=10,ping_interval=20,ping_timeout=20)
                  tasks.append(asyncio.create_task(b.reader()))
                  await b.send({'type':'join','room':ROOM,'name':b.name})
                  if not await wait_for(lambda b=b:b.seat is not None,5): raise RuntimeError(f'join failed {b.name} {b.errors}')
              print('JOINED',[(b.name,b.seat) for b in bots])
              await bots[0].send({'type':'start','player_count':4})
              if not await wait_for(lambda:all(len(b.hand)==27 for b in bots),10):
                  raise RuntimeError('deal failed '+str([(b.name,len(b.hand),b.errors) for b in bots]))
              print('DEALT',[len(b.hand) for b in bots])

              successful=0
              for cycle in range(8000):
                  cs=await shared(bots,2)
                  if not cs: continue
                  s=cs[0]
                  winner=s.get('last_game_winner')
                  phase=s.get('next_round_phase')
                  if winner is not None and phase is not None:
                      result={'winner_seat':winner,'winner_name':NAMES[winner],'finish_order':s.get('finish_order'),'promotion':s.get('last_promotion_steps'),'phase':phase,'actions':successful}
                      print('RESULT_JSON',json.dumps(result,ensure_ascii=False))
                      for b in bots: await b.ws.close()
                      return
                  turn=s.get('turn'); counts=s.get('hand_counts') or []
                  if turn is None or not 0<=turn<4 or turn>=len(counts) or counts[turn]<=0:
                      await asyncio.sleep(.01); continue
                  b=bots[turn]
                  last=s.get('last_play') or []
                  if not last:
                      # Lead one legal single. Try every server-side index until accepted.
                      ok=False
                      for idx in range(counts[turn]):
                          if await act(bots,b,{'type':'play','card_indexes':[idx]},.5): ok=True; successful+=1; break
                      if not ok:
                          raise RuntimeError(f'lead stuck seat={turn} counts={counts} errors={b.errors[-5:]}')
                  else:
                      played=False
                      for idx in range(counts[turn]):
                          if await act(bots,b,{'type':'play','card_indexes':[idx]},.35): played=True; successful+=1; break
                      if not played:
                          if await act(bots,b,{'type':'pass'},.5): successful+=1
                          else: raise RuntimeError(f'follow/pass stuck seat={turn} counts={counts} errors={b.errors[-5:]}')
                  if cycle%100==0:
                      print('PROGRESS',cycle,'turn',turn,'counts',counts,'finish',s.get('finish_order'))
                  await asyncio.sleep(.005)
              raise RuntimeError('game did not finish')

          asyncio.run(main())
          PY
      - name: Show server tail
        if: always()
        run: tail -100 /tmp/guandan-server.log || true
