name: Format Root with project Prettier

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/format-root.yml"
      - "frontend/src/Root.tsx"

permissions:
  contents: write

jobs:
  format-root:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
      - name: Format Root.tsx
        run: yarn prettier src/Root.tsx --write
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- src/Root.tsx; then
            echo "Root.tsx is already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Root.tsx
          git commit -m "style: format Root with project Prettier"
          git push
