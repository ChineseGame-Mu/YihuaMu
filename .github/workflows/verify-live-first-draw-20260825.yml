name: Verify live first draw

on:
  push:
    branches:
      - fix/guandan-single-viewport-20260822
    paths:
      - .github/trigger-verify-live-first-draw-20260825.txt

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install websocket client
        run: pip install websockets
      - name: Verify Render backend first draw
        run: |
          python - <<'PY'
          import asyncio, json, time
          import websockets

          URI = 'wss://chinesegame-yihua.onrender.com/api/guandan'

          async def attempt(n):
              room = f'drawverify{int(time.time())}{n}'
              sockets = []
              try:
                  for i in range(4):
                      ws = await websockets.connect(URI, open_timeout=20, close_timeout=5)
                      sockets.append(ws)
                      await ws.send(json.dumps({'type':'join','room':room,'name':f'验证玩家{i+1}'}))
                      # Drain a few immediate join/waiting messages.
                      end = time.time() + 2
                      while time.time() < end:
                          try:
                              await asyncio.wait_for(ws.recv(), timeout=0.25)
                          except asyncio.TimeoutError:
                              break
                  await sockets[0].send(json.dumps({'type':'start','player_count':4}))
                  deadline = time.time() + 12
                  while time.time() < deadline:
                      try:
                          raw = await asyncio.wait_for(sockets[0].recv(), timeout=2)
                      except asyncio.TimeoutError:
                          continue
                      msg = json.loads(raw)
                      if msg.get('type') == 'state':
                          draw = msg.get('initial_draw')
                          winner = msg.get('initial_draw_winner')
                          if isinstance(draw, list) and len(draw) == 4 and isinstance(winner, int) and 0 <= winner < 4:
                              print('LIVE_FIRST_DRAW_OK')
                              print(json.dumps({'room':room,'winner':winner,'draw':draw}, ensure_ascii=False))
                              return True
                  return False
              except Exception as e:
                  print('attempt error:', repr(e))
                  return False
              finally:
                  for ws in sockets:
                      try:
                          await ws.close()
                      except Exception:
                          pass

          async def main():
              for n in range(16):
                  if await attempt(n):
                      return
                  print(f'live backend not updated yet, retry {n+1}/16')
                  await asyncio.sleep(15)
              raise SystemExit('Render backend did not expose initial_draw in retry window')

          asyncio.run(main())
          PY
