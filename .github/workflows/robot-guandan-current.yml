name: Robot Guandan Current

on:
  push:
    branches:
      - fix/guandan-single-viewport-20260822

jobs:
  robot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websockets
      - name: Start backend locally with cleared room state
        run: |
          PORT=3030 CORS_ALLOWED_ORIGINS='*' cargo run -p shengji --features dynamic > /tmp/guandan-server.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3030/runtime.js >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/guandan-server.log
          exit 1
      - name: Play one complete four-player game in room 0004
        env:
          WS_URL: ws://127.0.0.1:3030/api/guandan
          ROOM: '0004'
        run: |
          python - <<'PY'
          import asyncio, collections, json, os, time
          import websockets

          URL = os.environ['WS_URL']
          ROOM = os.environ['ROOM']
          NAMES = ['机器人1', '机器人2', '机器人3', '机器人4']

          class Bot:
              def __init__(self, name):
                  self.name = name
                  self.ws = None
                  self.seat = None
                  self.hand = []
                  self.state = None
                  self.errors = []

              async def send(self, obj):
                  await self.ws.send(json.dumps(obj, ensure_ascii=False))

              async def reader(self):
                  async for raw in self.ws:
                      msg = json.loads(raw)
                      kind = msg.get('type')
                      if kind == 'joined':
                          self.seat = msg.get('seat')
                      elif kind == 'hand':
                          self.hand = msg.get('cards', [])
                      elif kind == 'state':
                          self.state = msg
                      elif kind == 'error':
                          self.errors.append(msg.get('message', 'error'))

          async def wait_for(pred, timeout=10, step=0.01):
              end = time.time() + timeout
              while time.time() < end:
                  value = pred()
                  if value:
                      return value
                  await asyncio.sleep(step)
              return None

          def signature(state):
              if not state:
                  return None
              keys = [
                  'turn', 'hand_counts', 'last_play', 'last_player', 'passes',
                  'finish_order', 'last_game_winner', 'last_promotion_steps',
                  'next_round_phase'
              ]
              return json.dumps(
                  {key: state.get(key) for key in keys},
                  sort_keys=True,
                  ensure_ascii=False,
              )

          def consensus(bots):
              values = [(signature(bot.state), bot.state) for bot in bots if bot.state]
              if not values:
                  return None, 0
              counts = collections.Counter(key for key, _ in values)
              key, number = counts.most_common(1)[0]
              return next(state for candidate, state in values if candidate == key), number

          async def shared(bots, timeout=5):
              return await wait_for(
                  lambda: (
                      lambda result: result
                      if result[0] is not None and result[1] >= 3
                      else None
                  )(consensus(bots)),
                  timeout,
              )

          async def act(bots, bot, message, timeout=0.6):
              current = await shared(bots, 2)
              if not current:
                  return False
              before = signature(current[0])
              error_count = len(bot.errors)
              before_hand = len(bot.hand)
              await bot.send(message)
              end = time.time() + timeout
              while time.time() < end:
                  if len(bot.errors) > error_count:
                      return False
                  state, count = consensus(bots)
                  if len(bot.hand) != before_hand:
                      return True
                  if state is not None and count >= 3 and signature(state) != before:
                      return True
                  await asyncio.sleep(0.01)
              return False

          async def main():
              bots = [Bot(name) for name in NAMES]
              for bot in bots:
                  bot.ws = await websockets.connect(
                      URL,
                      open_timeout=10,
                      ping_interval=20,
                      ping_timeout=20,
                  )
                  asyncio.create_task(bot.reader())
                  await bot.send({'type': 'join', 'room': ROOM, 'name': bot.name})
                  if not await wait_for(lambda bot=bot: bot.seat is not None, 5):
                      raise RuntimeError(f'join failed {bot.name}: {bot.errors}')

              print('ROOM_CLEARED_AND_JOINED', ROOM, [(bot.name, bot.seat) for bot in bots])
              await bots[0].send({'type': 'start', 'player_count': 4})
              if not await wait_for(lambda: all(len(bot.hand) == 27 for bot in bots), 10):
                  raise RuntimeError(
                      'deal failed ' + str([(bot.name, len(bot.hand), bot.errors) for bot in bots])
                  )
              print('DEALT', [len(bot.hand) for bot in bots])

              actions = 0
              for cycle in range(8000):
                  current = await shared(bots, 2)
                  if not current:
                      continue
                  state = current[0]
                  winner = state.get('last_game_winner')
                  phase = state.get('next_round_phase')
                  if winner is not None and phase is not None:
                      result = {
                          'room': ROOM,
                          'winner_seat': winner,
                          'winner_name': NAMES[winner],
                          'finish_order': state.get('finish_order'),
                          'promotion': state.get('last_promotion_steps'),
                          'phase': phase,
                          'actions': actions,
                      }
                      print('RESULT_JSON', json.dumps(result, ensure_ascii=False))
                      for bot in bots:
                          await bot.ws.close()
                      return

                  turn = state.get('turn')
                  counts = state.get('hand_counts') or []
                  if turn is None or not 0 <= turn < 4 or turn >= len(counts) or counts[turn] <= 0:
                      await asyncio.sleep(0.01)
                      continue

                  bot = bots[turn]
                  last_play = state.get('last_play') or []
                  if not last_play:
                      played = False
                      for index in range(counts[turn]):
                          if await act(bot=bots[turn], bots=bots, message={'type': 'play', 'card_indexes': [index]}, timeout=0.5):
                              actions += 1
                              played = True
                              break
                      if not played:
                          raise RuntimeError(f'lead stuck seat={turn} errors={bot.errors[-5:]}')
                  else:
                      played = False
                      for index in range(counts[turn]):
                          if await act(bot=bots[turn], bots=bots, message={'type': 'play', 'card_indexes': [index]}, timeout=0.35):
                              actions += 1
                              played = True
                              break
                      if not played:
                          if await act(bot=bots[turn], bots=bots, message={'type': 'pass'}, timeout=0.5):
                              actions += 1
                          else:
                              raise RuntimeError(f'follow/pass stuck seat={turn} errors={bot.errors[-5:]}')

                  if cycle % 100 == 0:
                      print(
                          'PROGRESS',
                          cycle,
                          'turn',
                          turn,
                          'counts',
                          counts,
                          'finish',
                          state.get('finish_order'),
                      )
                  await asyncio.sleep(0.005)

              raise RuntimeError('game did not finish')

          asyncio.run(main())
          PY
      - name: Show server tail
        if: always()
        run: tail -100 /tmp/guandan-server.log || true
