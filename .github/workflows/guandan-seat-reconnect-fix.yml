name: Apply Guandan seat reconnect fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/guandan-seat-reconnect-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply reconnect seat fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/guandan_handler.rs')
          s = p.read_text()

          old = '''            GuandanClientMessage::Join { room, name } => {
                if joined_room.is_some() {
                    send(
                        &tx,
                        &GuandanServerMessage::Error {
                            message: "already joined a guandan room".to_string(),
                        },
                    );
                    continue;
                }

                let key = room.as_bytes().to_vec();
                if is_observer(&key, &name) {
                    send(
                        &tx,
                        &GuandanServerMessage::Error {
                            message: "name is already in use".to_string(),
                        },
                    );
                    continue;
                }

                let name_for_state = name.clone();
                let seat_result = storage
                    .clone()
                    .execute_operation_with_messages(key.clone(), move |mut state| {
                        if state.game.started
                            || state.game.player_names.len() >= MAX_PLAYERS
                            || state
                                .game
                                .player_names
                                .iter()
                                .any(|existing| existing == &name_for_state)
                        {
                            return Err(());
                        }
                        state.game.player_names.push(name_for_state);
                        state.bump_version();
                        Ok((state, vec![GuandanStorageMessage::StateChanged]))
                    })
                    .await;

                let seat = match seat_result {
                    Ok(_) => match current_seat(&storage, &key, &name).await {
                        Some(seat) => seat,
                        None => continue,
                    },
                    Err(_) => {
                        send(
                            &tx,
                            &GuandanServerMessage::Error {
                                message:
                                    "room is full, game already started, or name is already in use"
                                        .to_string(),
                            },
                        );
                        continue;
                    }
                };
'''

          new = '''            GuandanClientMessage::Join { room, name } => {
                let key = room.as_bytes().to_vec();

                if let (Some(existing_room), Some(existing_name)) =
                    (joined_room.as_ref(), joined_name.as_ref())
                {
                    if existing_room == &key && existing_name == &name {
                        if let Some(seat) = current_seat(&storage, &key, &name).await {
                            send(&tx, &GuandanServerMessage::Joined { room, seat });
                            if let Ok(state) = storage.clone().get(key.clone()).await {
                                if state.game.started {
                                    send(&tx, &state_message(&key, &state.game));
                                    if let Some(hand) = state.game.private_hand(seat) {
                                        send(
                                            &tx,
                                            &GuandanServerMessage::Hand {
                                                cards: hand.to_vec(),
                                            },
                                        );
                                    }
                                } else {
                                    send(&tx, &waiting_message(&key, &state.game));
                                }
                            }
                        }
                        continue;
                    }

                    send(
                        &tx,
                        &GuandanServerMessage::Error {
                            message: "already joined a different guandan room or player identity"
                                .to_string(),
                        },
                    );
                    continue;
                }

                if is_observer(&key, &name) {
                    send(
                        &tx,
                        &GuandanServerMessage::Error {
                            message: "name is already in use".to_string(),
                        },
                    );
                    continue;
                }

                let seat = if let Some(seat) = current_seat(&storage, &key, &name).await {
                    seat
                } else {
                    let name_for_state = name.clone();
                    let seat_result = storage
                        .clone()
                        .execute_operation_with_messages(key.clone(), move |mut state| {
                            if let Some(existing_seat) = state
                                .game
                                .player_names
                                .iter()
                                .position(|existing| existing == &name_for_state)
                            {
                                return Ok((state, vec![]));
                            }
                            if state.game.started || state.game.player_names.len() >= MAX_PLAYERS {
                                return Err(());
                            }
                            state.game.player_names.push(name_for_state);
                            state.bump_version();
                            Ok((state, vec![GuandanStorageMessage::StateChanged]))
                        })
                        .await;

                    if seat_result.is_err() {
                        send(
                            &tx,
                            &GuandanServerMessage::Error {
                                message: "room is full or game already started".to_string(),
                            },
                        );
                        continue;
                    }

                    match current_seat(&storage, &key, &name).await {
                        Some(seat) => seat,
                        None => continue,
                    }
                };
'''

          if old not in s:
              raise SystemExit('expected Join block not found; refusing unsafe edit')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Format Rust
        run: cargo fmt --all

      - name: Test Guandan backend
        run: cargo test -p backend guandan_handler

      - name: Remove one-time workflow
        run: rm .github/workflows/guandan-seat-reconnect-fix.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/guandan_handler.rs .github/workflows/guandan-seat-reconnect-fix.yml
          git commit -m "fix: restore Guandan player to existing seat on reconnect"
          git push
