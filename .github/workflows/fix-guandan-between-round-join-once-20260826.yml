name: Fix Guandan between-round joining once

on:
  push:
    branches:
      - optimize/guandan-online-performance-20260826
    paths:
      - ".github/workflows/fix-guandan-between-round-join-once-20260826.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize/guandan-online-performance-20260826
      - name: Apply exact migration
        run: python .github/scripts/patch_guandan_between_round_join_20260826.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Format frontend
        working-directory: frontend
        run: npx prettier@3.4.1 --write src/GuandanTable.tsx
      - name: Format Rust
        run: cargo fmt --all
      - name: Test frontend
        working-directory: frontend
        run: npm test -- --runInBand
      - name: Test Guandan backend
        run: cargo test -p backend guandan --no-fail-fast
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/GuandanTable.tsx backend/src/guandan_handler.rs
          git diff --cached --quiet || git commit -m "feat(guandan): queue new players for next round"
          git push
