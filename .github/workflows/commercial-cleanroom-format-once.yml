name: Commercial Clean-room One-time Format

on:
  push:
    branches:
      - cleanroom/three-game-commercial-20260916

permissions:
  contents: write

jobs:
  format-once:
    if: github.event.head_commit.message != 'chore(cleanroom): apply Prettier 3.4.1 normalization'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commercial-cleanroom/guandan
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanroom/three-game-commercial-20260916
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: commercial-cleanroom/guandan/package-lock.json
      - name: Install locked formatter
        run: npm ci --ignore-scripts
      - name: Apply Prettier 3.4.1 only
        run: npx prettier --write .
      - name: Remove one-time workflow and commit formatting only
        working-directory: .
        run: |
          rm .github/workflows/commercial-cleanroom-format-once.yml
          git config user.name 'ChineseGame-Mu'
          git config user.email 'muyihua@gmail.com'
          git add -u
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'chore(cleanroom): apply Prettier 3.4.1 normalization'
          git push origin HEAD:cleanroom/three-game-commercial-20260916
