name: Cleanroom Tribute Prettier Once

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yihua-game
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanroom/yihua-game-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier@3.4.1 --write src/core/legacy-tribute.ts test/legacy-tribute-plan.test.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/legacy-tribute.ts test/legacy-tribute-plan.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(cleanroom): apply tribute prettier"
            git push origin HEAD:cleanroom/yihua-game-20260826
          fi
