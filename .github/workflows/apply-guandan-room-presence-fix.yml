name: Apply Guandan room-presence fix once

on:
  push:
    branches:
      - preview/guandan-room-presence-fix-20261001

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified local patch
        shell: bash
        run: |
          set -euo pipefail
          cat <<'PATCH_B64' | tr -d '\n' | base64 -d | gzip -d > /tmp/guandan-room-presence.patch
          
          
          
          
          
          
          
          
          
          
          PATCH_B64
          git apply --check /tmp/guandan-room-presence.patch
          git apply /tmp/guandan-room-presence.patch
          git rm .github/workflows/apply-guandan-room-presence-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Guandan entry and stale room presence'
          git push
