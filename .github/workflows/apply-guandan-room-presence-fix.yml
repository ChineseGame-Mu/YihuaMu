name: Apply verified Guandan presence fix

on:
  push:
    branches:
      - preview/guandan-room-presence-fix-20261001
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/guandan-room-presence-fix-20261001
          fetch-depth: 0
      - name: Apply verified code patch
        env:
          PATCH_GZ_B64: 
        run: |
          echo "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/room-presence.patch
          git apply --check /tmp/room-presence.patch
          git apply /tmp/room-presence.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yihua-game
          git commit -m "Fix live Guandan preview access and stale presence"
          git push origin HEAD:preview/guandan-room-presence-fix-20261001
