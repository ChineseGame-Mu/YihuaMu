name: Apply Guandan room-presence code fix once

on:
  push:
    branches:
      - preview/guandan-room-presence-fix-20261001

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified code patch
        shell: bash
        run: |
          set -euo pipefail
          cat <<'PATCH_B64' | tr -d '\n' | base64 -d | gzip -d > /tmp/guandan-room-presence.patch
          
          
          
          
          
          
          
          
          lwpeYw4oT1B1vVYSHCWFiThinR09X+QOXhUNKedCH2WSu9sjr/NhKTpZduMnH1lEyMpDZ4fMNdkhaRqYwW8sAcN0yWgIMDIPNjsLL5BbgBPn4ApEH4ZnlUPJFvPVxYb+CUf5W9WXkMuczW7mqYZy+jnGSYd7ko0ZRq1ITMdqyKf+F7ebChDYQQAA
          PATCH_B64
          git apply --check /tmp/guandan-room-presence.patch
          git apply /tmp/guandan-room-presence.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Guandan entry and stale room presence'
