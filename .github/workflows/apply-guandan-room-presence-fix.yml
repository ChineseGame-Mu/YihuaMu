name: Apply emergency Guandan double-down and reconnect hotfix

on:
  push:
    branches:
      - preview/guandan-room-presence-fix-20261001

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed hotfix
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/guandan-hotfix.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git am /tmp/guandan-hotfix.patch
          npm --prefix yihua-game ci
          npm --prefix yihua-game test -- --run test/game-state-four-player-catch-fallback.test.ts test/four-player-catch-to-next-round.test.ts test/abandoned-room-reset.test.ts test/player-session-security.test.ts test/node-websocket.test.ts
          npm --prefix yihua-game run typecheck
          npm --prefix yihua-game run build
          git push origin HEAD:refs/heads/preview/guandan-room-presence-fix-20261001
          preview_sha=$(git rev-parse HEAD)
          git switch --detach 0c5f0c2d0e6225f2fc245b03cd26e3a313d80015
          git checkout "$preview_sha" -- yihua-game
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Deploy Guandan double-down and reconnect hotfix to Render'
          git push origin HEAD:refs/heads/cleanroom/yihua-game-20260826
