name: Apply Guandan Rust formatting fix

on:
  push:
    branches:
      - preview/guandan-room-presence-fix-20261001

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/guandan-room-presence-fix-20261001
          fetch-depth: 0
      - name: Apply rustfmt patch
        env:
          PATCH_GZ_B64: 
        run: |
          echo "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/rustfmt.patch
          git apply --check /tmp/rustfmt.patch
          git apply /tmp/rustfmt.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main.rs
          git commit -m "Format Guandan room presence guard"
          git push origin HEAD:preview/guandan-room-presence-fix-20261001
