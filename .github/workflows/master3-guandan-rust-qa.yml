name: Master3 Guandan Rust QA
on:
  push:
    branches: [master3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guandan-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
      - uses: Swatinem/rust-cache@v2
      - name: Prepare placeholder static assets for Rust-only CI
        run: |
          # include_dir! expands at compile time; production builds generate frontend/dist.
          # These placeholders are only present on this ephemeral CI runner.
          mkdir -p frontend/dist
      - name: Compile Guandan backend and core tests
        run: cargo test -p shengji-core -p shengji --no-run
      - name: Run Guandan rules and backend regression tests
        run: |
          cargo test -p shengji-core guandan -- --nocapture
          cargo test -p shengji guandan_handler -- --nocapture

  guandan-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install locked frontend dependencies
        run: corepack enable && yarn install --frozen-lockfile
      - name: Verify intelligent hand arrangement and free selection indexes
        run: yarn test --runInBand --watch=false src/guandanAutoArrange.test.ts
