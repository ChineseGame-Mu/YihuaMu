name: Yihua Game Long Soak

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
    paths:
      - ".github/workflows/cleanroom-yihua-game-soak.yml"
  workflow_dispatch:
    inputs:
      duration_ms:
        description: "Duration per concurrent soak run in milliseconds"
        required: true
        default: "10800000"
      reconnect_every:
        description: "Reconnect one player after this many game actions"
        required: true
        default: "10"
      crash_recovery_cycles:
        description: "Independent active-game SIGKILL recovery cycles before the soak"
        required: true
        default: "3"

jobs:
  websocket-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    defaults:
      run:
        working-directory: yihua-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify Prettier 3.4.1
        run: npm run prettier:version
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build standalone server
        run: npm run build
      - name: Repeated active-game hard-crash recovery fault injection
        env:
          CRASH_RECOVERY_CYCLES: ${{ inputs.crash_recovery_cycles || '3' }}
        run: |
          set -euo pipefail
          for cycle in $(seq 1 "$CRASH_RECOVERY_CYCLES"); do
            echo "Hard-crash recovery cycle ${cycle}/${CRASH_RECOVERY_CYCLES}"
            npm run smoke:crash
          done
      # Keep long runs segmented so each child process releases transient heap.
      - name: Long WebSocket lifecycle soak
        env:
          SOAK_DURATION_MS: ${{ inputs.duration_ms || '10800000' }}
          SOAK_SEGMENT_MS: "60000"
          SOAK_PLAYER_COUNTS: "4,6,8,10,12,14"
          SOAK_RECONNECT_EVERY: ${{ inputs.reconnect_every || '10' }}
        run: node scripts/soak-websocket-bounded.mjs
