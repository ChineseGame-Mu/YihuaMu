name: Cleanroom expand tribute 4-14 once

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
    paths:
      - .github/workflows/cleanroom-expand-tribute-4-14-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanroom/yihua-game-20260826
          fetch-depth: 0
      - name: Wire generalized tribute into next-round deal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('backend/src/guandan_handler.rs')
          s = p.read_text()
          s = s.replace(
              'tribute::{can_resist_tribute, four_player_tribute_plan, TributePlan},',
              'tribute::{can_resist_tribute, tribute_plan, TributePlan},'
          )
          s = s.replace('let plan = four_player_tribute_plan(', 'let plan = tribute_plan(')

          needle = 'if table.player_count == GUANDAN_CLASSIC_PLAYER_COUNT {'
          start = s.find(needle)
          if start < 0:
              raise SystemExit('could not locate classic-only tribute wrapper')

          # Find the matching closing brace for the classic-only if block.
          brace = s.find('{', start)
          depth = 0
          end_if = None
          for i in range(brace, len(s)):
              if s[i] == '{':
                  depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end_if = i
                      break
          if end_if is None:
              raise SystemExit('could not find end of classic-only tribute block')

          j = end_if + 1
          while j < len(s) and s[j].isspace():
              j += 1
          if not s.startswith('else {', j):
              raise SystemExit('classic-only tribute block has no expected else')
          else_brace = s.find('{', j)
          depth = 0
          end_else = None
          for i in range(else_brace, len(s)):
              if s[i] == '{':
                  depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end_else = i
                      break
          if end_else is None:
              raise SystemExit('could not find end of classic-only tribute else')

          # Keep the inside of the original if block and remove one indentation level.
          body = s[brace + 1:end_if]
          lines = body.splitlines()
          nonblank = [line for line in lines if line.strip()]
          if not nonblank:
              raise SystemExit('tribute block unexpectedly empty')
          common = min(len(line) - len(line.lstrip()) for line in nonblank)
          body = '\n'.join(line[common:] if line.strip() else '' for line in lines)
          s = s[:start] + body.strip('\n') + s[end_else + 1:]
          p.write_text(s)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Test tribute mechanics
        run: cargo test -p shengji-core tribute --lib
      - name: Check backend
        run: cargo check -p shengji-backend
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/src/guandan/tribute.rs backend/src/guandan_handler.rs
          git commit -m "feat(cleanroom): enable tribute and return for 4-14 players" || true
          git push origin HEAD:cleanroom/yihua-game-20260826
