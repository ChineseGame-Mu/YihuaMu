name: Robot Guandan Once

on:
  push:
    branches:
      - test/robot-guandan-20260822

jobs:
  robot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websockets
      - name: Play one four-player game
        env:
          WS_URL: wss://chinesegame-yihua.onrender.com/api/guandan
          ROOM: '0004'
        run: |
          python - <<'PY'
          import asyncio, json, os, time
          import websockets

          URL = os.environ['WS_URL']
          ROOM = os.environ['ROOM']
          NAMES = ['机器人1','机器人2','机器人3','机器人4']

          class Bot:
              def __init__(self, name):
                  self.name=name; self.ws=None; self.seat=None; self.hand=[]; self.state=None
                  self.version=0; self.errors=[]
              async def send(self,obj):
                  await self.ws.send(json.dumps(obj, ensure_ascii=False))
              async def reader(self):
                  async for raw in self.ws:
                      m=json.loads(raw)
                      t=m.get('type')
                      if t=='joined': self.seat=m.get('seat')
                      elif t=='hand': self.hand=m['cards']
                      elif t=='state': self.state=m; self.version+=1
                      elif t=='error': self.errors.append(m.get('message','error'))

          async def wait_for(pred, timeout=15):
              end=time.time()+timeout
              while time.time()<end:
                  if pred(): return True
                  await asyncio.sleep(.05)
              return False

          async def attempt_play(bot, idx):
              before_v=bot.version; before_n=len(bot.hand); before_err=len(bot.errors)
              await bot.send({'type':'play','card_indexes':[idx]})
              end=time.time()+1.5
              while time.time()<end:
                  if len(bot.errors)>before_err: return False
                  if bot.version>before_v and bot.state and bot.state.get('turn')!=bot.seat: return True
                  if len(bot.hand)<before_n: return True
                  await asyncio.sleep(.03)
              return False

          async def main():
              bots=[Bot(n) for n in NAMES]
              for b in bots:
                  b.ws=await websockets.connect(URL, open_timeout=20, ping_interval=20, ping_timeout=20)
                  await b.send({'type':'join','room':ROOM,'name':b.name})
                  asyncio.create_task(b.reader())
                  ok=await wait_for(lambda b=b: b.seat is not None, 10)
                  if not ok: raise RuntimeError(f'{b.name} join failed')
              print('JOINED', [(b.name,b.seat) for b in bots])
              await bots[0].send({'type':'start','player_count':4})
              ok=await wait_for(lambda: all(len(b.hand)==27 for b in bots) and all(b.state for b in bots), 20)
              if not ok:
                  raise RuntimeError('deal failed: '+str([(b.name,len(b.hand),b.errors[-3:]) for b in bots]))
              print('DEALT', [len(b.hand) for b in bots])

              steps=0
              while steps<1000:
                  steps+=1
                  s=next((b.state for b in bots if b.state),None)
                  if not s: await asyncio.sleep(.05); continue
                  winner=s.get('last_game_winner')
                  phase=s.get('next_round_phase')
                  if winner is not None and phase is not None:
                      print('RESULT_JSON', json.dumps({'winner_seat':winner,'winner_name':NAMES[winner],'finish_order':s.get('finish_order'),'promotion':s.get('last_promotion_steps'),'phase':phase}, ensure_ascii=False))
                      for b in bots: await b.ws.close()
                      return
                  turn=s.get('turn')
                  if turn is None or not (0<=turn<4):
                      await asyncio.sleep(.05); continue
                  b=bots[turn]
                  if len(b.hand)==0:
                      await asyncio.sleep(.05); continue
                  last=s.get('last_play') or []
                  if not last:
                      ok=await attempt_play(b,0)
                      if not ok:
                          raise RuntimeError(f'leader {b.name} could not play single; errors={b.errors[-5:]}')
                  else:
                      played=False
                      for idx in range(len(b.hand)):
                          if await attempt_play(b,idx):
                              played=True; break
                      if not played:
                          before=b.version
                          await b.send({'type':'pass'})
                          ok=await wait_for(lambda b=b,before=before: b.version>before and b.state and b.state.get('turn')!=b.seat, 3)
                          if not ok:
                              raise RuntimeError(f'{b.name} could neither play nor pass; errors={b.errors[-5:]}')
                  await asyncio.sleep(.03)
              raise RuntimeError('game did not finish within 1000 actions')

          asyncio.run(main())
          PY
