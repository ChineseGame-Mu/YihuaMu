name: Fix trick table preservation once
on:
  push:
    branches: ["cleanroom/yihua-game-20260826"]
    paths: [".github/workflows/fix-trick-table-preservation-once.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanroom/yihua-game-20260826
      - name: Patch backend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/src/guandan_handler.rs')
          s=p.read_text()
          robot='            game.last_play.clear();\n            game.last_player = None;\n            game.table_plays.clear();\n            game.passes = 0;\n            game.trick_complete = false;\n'
          robot_new='            // Keep completed trick visible until EndRound collects it.\n            game.passes = 0;\n            game.trick_complete = true;\n'
          human='                            state.game.last_play.clear();\n                            state.game.last_player = None;\n                            state.game.table_plays.clear();\n                            state.game.passes = 0;\n                            state.game.trick_complete = false;\n'
          human_new='                            // Keep completed trick visible until EndRound collects it.\n                            state.game.passes = 0;\n                            state.game.trick_complete = true;\n'
          assert robot in s
          assert human in s
          s=s.replace(robot,robot_new,1).replace(human,human_new,1)
          p.write_text(s)
          PY
          cargo fmt --all -- --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-trick-table-preservation-once.yml
          git add backend/src/guandan_handler.rs
          git commit -m "fix(cleanroom): keep completed trick visible until collection"
          git push origin HEAD:cleanroom/yihua-game-20260826
