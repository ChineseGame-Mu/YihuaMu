name: Three-Game Live Fault Regression

on:
  push:
    branches:
      - cleanroom/three-game-commercial-20260916
  workflow_dispatch:

jobs:
  live-fault-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRONTEND_URL: https://chinesegame-pr18-qa.onrender.com/
      SHARED_WS_URL: wss://chinesegame-pr18-qa.onrender.com/api
      GUANDAN_WS_URL: wss://chinesegame-pr18-qa.onrender.com/api/guandan
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install WebSocket fault-injection client
        run: npm install --no-save ws@8.21.0

      - name: Wait for PR18 Render QA service
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.FRONTEND_URL;
          for (let attempt = 1; attempt <= 60; attempt++) {
            try {
              const response = await fetch(url, { redirect: 'follow' });
              console.log(JSON.stringify({type:'qa_readiness_probe',attempt,status:response.status,url:response.url}));
              if (response.ok) process.exit(0);
            } catch (error) {
              console.log(JSON.stringify({type:'qa_readiness_probe',attempt,error:String(error)}));
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('PR18 Render QA service did not become ready');
          NODE

      - name: Shengji and Finding Friends live reconnect/fault regression
        run: |
          node --input-type=module <<'NODE'
          import WebSocket from 'ws';

          const URL = process.env.SHARED_WS_URL;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const timeout = (ms,label) => new Promise((_,reject)=>setTimeout(()=>reject(new Error(`timeout: ${label}`)),ms));

          class SharedClient {
            constructor(name, room) {
              this.name=name; this.room=room; this.ws=null; this.messages=[]; this.waiters=[];
            }
            async connect() {
              this.ws = new WebSocket(URL, { handshakeTimeout: 15000 });
              this.ws.on('error', error => console.log(JSON.stringify({type:'shared_socket_error',name:this.name,error:String(error)})));
              this.ws.on('message', data => {
                let m;
                try { m=JSON.parse(Buffer.from(data).toString('utf8')); } catch { return; }
                this.messages.push(m);
                for (const w of [...this.waiters]) {
                  if (this.messages.length > w.after && w.pred(m)) {
                    this.waiters.splice(this.waiters.indexOf(w),1); w.resolve(m);
                  }
                }
              });
              await Promise.race([new Promise((resolve,reject)=>{
                this.ws.once('open',resolve);
                this.ws.once('error',reject);
              }),timeout(15000,`${this.name} open`)]);
              return this;
            }
            send(value) { this.ws.send(JSON.stringify(value)); }
            waitNew(pred, after=this.messages.length, ms=20000) {
              for(let i=after;i<this.messages.length;i++) if(pred(this.messages[i])) return Promise.resolve(this.messages[i]);
              return Promise.race([new Promise(resolve=>this.waiters.push({pred,resolve,after})),timeout(ms,`${this.name} message`)]);
            }
            terminate(){ try{this.ws?.terminate();}catch{} }
            close(){ try{this.ws?.close();}catch{} }
          }

          const isState = m => m && typeof m === 'object' && Object.prototype.hasOwnProperty.call(m,'State');
          const isError = m => m && typeof m === 'object' && Object.prototype.hasOwnProperty.call(m,'Error');

          async function join(client) {
            const mark=client.messages.length;
            client.send({room_name:client.room,name:client.name,disable_compression:true});
            const state=await client.waitNew(isState,mark,20000);
            const error=client.messages.slice(mark).find(isError);
            if(error) throw new Error(`${client.name} join error: ${JSON.stringify(error)}`);
            return state;
          }

          async function runMode(mode) {
            const room=(mode==='Tractor'?'T':'F') + Math.random().toString(36).slice(2,5).toUpperCase();
            const clients=[];
            const prefix=mode==='Tractor'?'TR':'FF';

            // Mirror the real create-room flow: first player joins, chooses the mode,
            // then the remaining players join that already-configured room.
            const owner=await new SharedClient(`${prefix}-${Date.now().toString().slice(-6)}-0`,room).connect();
            await join(owner);
            clients.push(owner);

            const action = mode==='Tractor'
              ? {Action:{SetGameMode:'Tractor'}}
              : {Action:{SetGameMode:{FindingFriends:{num_friends:null}}}};

            let mark=owner.messages.length;
            owner.send(action);
            const modeReply=await owner.waitNew(m=>isState(m)||isError(m),mark,20000);
            if(isError(modeReply)) throw new Error(`${mode} SetGameMode error: ${JSON.stringify(modeReply)}`);

            for(let i=1;i<4;i++){
              const c=await new SharedClient(`${prefix}-${Date.now().toString().slice(-6)}-${i}`,room).connect();
              await join(c); clients.push(c);
            }

            // Duplicate-delivery simulation: replay the same idempotent mode action twice,
            // then prove the connection and authoritative room state remain usable.
            mark=owner.messages.length;
            owner.send(action);
            owner.send(action);
            await sleep(750);
            const duplicateErrors=owner.messages.slice(mark).filter(isError);
            if(duplicateErrors.length) throw new Error(`${mode} duplicate replay produced error: ${JSON.stringify(duplicateErrors)}`);
            mark=owner.messages.length;
            owner.send({Message:`${mode}-duplicate-survival`});
            await owner.waitNew(m=>m?.Message?.message===`${mode}-duplicate-survival`,mark,20000);

            // Latency/timeout window: keep the live connection idle beyond the frontend 5s response timer,
            // then prove a real round trip still succeeds.
            await sleep(6500);
            mark=clients[0].messages.length;
            clients[0].send({Message:`${mode}-delayed-roundtrip`});
            await clients[0].waitNew(m=>m?.Message?.message===`${mode}-delayed-roundtrip`,mark,20000);

            // Simulated message loss: intentionally discard local queued state, then recover from authoritative server state.
            clients[1].messages=[];
            clients[1].terminate();
            await sleep(500);
            let replacement=await new SharedClient(clients[1].name,room).connect();
            await join(replacement);

            // Repeated abnormal closes: three terminate() cycles, preserving the same player identity and room state.
            for(let attempt=1;attempt<=3;attempt++){
              replacement.terminate();
              await sleep(500);
              replacement=await new SharedClient(clients[1].name,room).connect();
              const recovered=await join(replacement);
              if(!isState(recovered)) throw new Error(`${mode} reconnect ${attempt} did not restore state`);
              console.log(JSON.stringify({type:'shared_reconnect_pass',mode,attempt,room,name:replacement.name,abnormalClose:true}));
            }

            console.log(JSON.stringify({
              type:'shared_mode_fault_regression_pass',
              sha:process.env.EXPECTED_COMMIT,
              mode,
              room,
              concurrentClients:4,
              duplicateReplay:true,
              delayedRoundTripMs:6500,
              simulatedMessageLossRecovery:true,
              abnormalReconnects:3
            }));
            for(const c of clients)c.close();
            replacement.close();
          }

          await runMode('Tractor');
          await runMode('FindingFriends');
          NODE

      - name: Guandan live abnormal-close, loss, duplicate and timeout regression
        run: |
          node --input-type=module <<'NODE'
          import WebSocket from 'ws';

          const URL=process.env.GUANDAN_WS_URL;
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const timeout=(ms,label)=>new Promise((_,reject)=>setTimeout(()=>reject(new Error(`timeout: ${label}`)),ms));

          class Client {
            constructor(name){this.name=name;this.ws=null;this.messages=[];this.waiters=[];this.seat=null;}
            async connect(){
              this.ws=new WebSocket(URL,{handshakeTimeout:15000});
              this.ws.on('error',error=>console.log(JSON.stringify({type:'guandan_socket_error',name:this.name,error:String(error)})));
              this.ws.on('message',data=>{
                let m; try{m=JSON.parse(Buffer.from(data).toString('utf8'));}catch{return;}
                this.messages.push(m);
                for(const w of [...this.waiters]) if(this.messages.length>w.after&&w.pred(m)){
                  this.waiters.splice(this.waiters.indexOf(w),1);w.resolve(m);
                }
              });
              await Promise.race([new Promise((resolve,reject)=>{this.ws.once('open',resolve);this.ws.once('error',reject);}),timeout(15000,`${this.name} open`)]);
              await this.waitNew(m=>m.type==='connected',0,15000);
              return this;
            }
            send(m){this.ws.send(JSON.stringify(m));}
            waitNew(pred,after=this.messages.length,ms=20000){
              for(let i=after;i<this.messages.length;i++)if(pred(this.messages[i]))return Promise.resolve(this.messages[i]);
              return Promise.race([new Promise(resolve=>this.waiters.push({pred,resolve,after})),timeout(ms,`${this.name} message`)]);
            }
            terminate(){try{this.ws?.terminate();}catch{}}
            close(){try{this.ws?.close();}catch{}}
          }

          const room=`fault-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
          const clients=[];
          for(let i=0;i<4;i++){
            const c=await new Client(`GD-FAULT-${i+1}-${Date.now()}`).connect();
            const mark=c.messages.length;
            c.send({type:'join',room,name:c.name});
            const joined=await c.waitNew(m=>m.type==='joined',mark,20000);
            c.seat=joined.seat;
            clients.push(c);
          }

          // Latency window before mutation.
          await sleep(6500);
          let mark=clients[0].messages.length;
          clients[0].send({type:'set_card_count_alert_threshold',threshold:8});
          await clients[0].waitNew(m=>m.type==='waiting'&&m.card_count_alert_threshold===8,mark,20000);

          const marks=clients.map(c=>c.messages.length);
          clients[0].send({type:'start',player_count:4});
          const started=await clients[0].waitNew(m=>m.type==='started'&&m.player_count===4,marks[0],20000);
          if(started.cards_per_player!==27)throw new Error('unexpected cards_per_player');
          for(let i=0;i<4;i++){
            await clients[i].waitNew(m=>m.type==='state'&&m.hand_counts?.length===4,marks[i],20000);
            const hand=await clients[i].waitNew(m=>m.type==='hand',marks[i],20000);
            if(hand.cards?.length!==27)throw new Error(`seat ${i} hand length ${hand.cards?.length}`);
          }

          // Three abnormal reconnect cycles on the same identity/seat.
          const original=clients[2];
          const originalSeat=original.seat;
          let replacement=original;
          for(let attempt=1;attempt<=3;attempt++){
            replacement.terminate();
            await sleep(500);
            replacement=await new Client(original.name).connect();
            mark=replacement.messages.length;
            replacement.send({type:'join',room,name:replacement.name});
            const joined=await replacement.waitNew(m=>m.type==='joined',mark,20000);
            const hand=await replacement.waitNew(m=>m.type==='hand',mark,20000);
            const state=await replacement.waitNew(m=>m.type==='state',mark,20000);
            if(joined.seat!==originalSeat)throw new Error(`reconnect seat changed ${joined.seat} != ${originalSeat}`);
            if(hand.cards?.length!==state.hand_counts?.[originalSeat])throw new Error('reconnect private/public hand mismatch');
            console.log(JSON.stringify({type:'guandan_reconnect_pass',attempt,room,seat:joined.seat,abnormalClose:true}));
          }

          // Message-loss recovery + duplicate mutation: replay the same play immediately.
          let state=clients.flatMap(c=>c.messages).filter(m=>m.type==='state').at(-1);
          const bySeat=new Map(clients.map(c=>[c.seat,c]));
          if(originalSeat!==replacement.seat)throw new Error('replacement seat mismatch');
          bySeat.set(originalSeat,replacement);
          const leader=bySeat.get(state.turn);
          mark=leader.messages.length;
          leader.send({type:'play',card_indexes:[0]});
          leader.send({type:'play',card_indexes:[0]});
          const afterPlay=await leader.waitNew(m=>m.type==='state'&&m.hand_counts?.[leader.seat]===26,mark,20000);
          await leader.waitNew(m=>m.type==='error',mark,20000);
          if(afterPlay.hand_counts[leader.seat]!==26)throw new Error('duplicate play mutated hand more than once');

          // Discard a client's local messages, terminate it, then prove authoritative state recovery.
          const lossTarget=bySeat.get((leader.seat+1)%4);
          lossTarget.messages=[];
          const lossSeat=lossTarget.seat;
          lossTarget.terminate();
          await sleep(500);
          const lossReplacement=await new Client(lossTarget.name).connect();
          mark=lossReplacement.messages.length;
          lossReplacement.send({type:'join',room,name:lossReplacement.name});
          const lossJoined=await lossReplacement.waitNew(m=>m.type==='joined',mark,20000);
          const lossState=await lossReplacement.waitNew(m=>m.type==='state',mark,20000);
          if(lossJoined.seat!==lossSeat)throw new Error('loss recovery seat changed');
          if(lossState.hand_counts?.[leader.seat]!==26)throw new Error('loss recovery did not restore authoritative state');

          console.log(JSON.stringify({
            type:'guandan_fault_regression_pass',
            sha:process.env.EXPECTED_COMMIT,
            room,
            concurrentClients:4,
            abnormalReconnects:3,
            delayedRoundTripMs:6500,
            duplicatePlayRejected:true,
            duplicateMutationPrevented:true,
            simulatedMessageLossRecovery:true
          }));

          for(const c of clients)c.close();
          replacement.close();
          lossReplacement.close();
          NODE

      - name: Preserve release-gate semantics
        run: |
          echo 'This workflow proves live fault handling on the PR18 Render QA service.'
          echo 'It does not by itself prove three complete full games/rounds for every supported player count.'
