name: Verify Guandan 5 players plus 1 bot three games

on:
  push:
    branches:
      - feature/guandan-up-to-14-players-20260825
    paths:
      - .github/workflows/verify-guandan-5-human-1-bot-three-games-20260825.yml

permissions:
  contents: read

jobs:
  mixed-six-player-three-games:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guandan-up-to-14-players-20260825
      - run: python -m pip install --quiet 'websockets>=12,<16'
      - name: Start isolated branch backend
        run: |
          PORT=3030 CORS_ALLOWED_ORIGINS='*' cargo run -p shengji --features dynamic >/tmp/guandan6.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3030/runtime.js >/dev/null 2>&1; then echo LOCAL_BACKEND_READY; exit 0; fi
            sleep 1
          done
          cat /tmp/guandan6.log; exit 1
      - name: Run three complete 5-player plus 1-bot games
        run: |
          python - <<'PY'
          import asyncio,json,time,websockets
          URI='ws://127.0.0.1:3030/api/guandan'; N=6; BOT=5; CARDS=27

          class C:
              def __init__(self,i):
                  self.i=i; self.ws=None; self.task=None; self.cv=asyncio.Condition(); self.connected=False; self.joined=None; self.waiting=None; self.started=None; self.state=None; self.seq=0; self.hand=None; self.hand_seq=0; self.err=None
              async def connect(self):
                  self.ws=await websockets.connect(URI,open_timeout=10,max_queue=64); self.task=asyncio.create_task(self.reader()); await self.wait(lambda:self.connected)
              async def reader(self):
                  try:
                      async for raw in self.ws:
                          if isinstance(raw,bytes): raw=raw.decode()
                          m=json.loads(raw)
                          async with self.cv:
                              t=m.get('type')
                              if t=='connected': self.connected=True
                              elif t=='joined': self.joined=m
                              elif t=='waiting': self.waiting=m
                              elif t=='started': self.started=m
                              elif t=='state': self.state=m; self.seq+=1
                              elif t=='hand': self.hand=m.get('cards',[]); self.hand_seq+=1
                              elif t=='error': self.err=m.get('message') or 'server error'
                              self.cv.notify_all()
                  except Exception as e:
                      async with self.cv:
                          if self.err is None: self.err=repr(e)
                          self.cv.notify_all()
              async def wait(self,p,timeout=30):
                  async def x():
                      async with self.cv:
                          await self.cv.wait_for(lambda:self.err is not None or p())
                          if self.err is not None: raise AssertionError(f'seat {self.i+1}: {self.err}')
                  await asyncio.wait_for(x(),timeout)
              async def send(self,m): await self.ws.send(json.dumps(m,ensure_ascii=False))
              async def close(self):
                  if self.ws: await self.ws.close()
                  if self.task:
                      try: await self.task
                      except Exception: pass

          def sig(s):
              return (s.get('turn'),tuple(s.get('hand_counts',[])),s.get('last_player'),tuple(json.dumps(x,sort_keys=True) for x in s.get('last_play',[])),s.get('passes'),tuple(s.get('finish_order',[])),s.get('next_round_phase'),s.get('last_game_winner'))
          def name(seat): return '机器人' if seat==BOT else f'玩家{seat+1}'

          async def game(no):
              room=f'mixed6_g{no}_{int(time.time()*1000)}'; cs=[C(i) for i in range(N)]; bot_actions=0; actions=0
              try:
                  for c in cs:
                      await c.connect(); await c.send({'type':'join','room':room,'name':name(c.i)}); await c.wait(lambda c=c:c.joined is not None); assert c.joined.get('seat')==c.i
                  ctl=cs[0]; await ctl.wait(lambda:ctl.waiting is not None and len(ctl.waiting.get('players',[]))==N); await ctl.send({'type':'start','player_count':N})
                  for c in cs:
                      await c.wait(lambda c=c:c.started is not None and c.started.get('player_count')==N)
                      await c.wait(lambda c=c:c.state is not None and len(c.state.get('initial_draw',[]))==N)
                      await c.wait(lambda c=c:c.hand is not None and len(c.hand)==CARDS)
                  opening=ctl.state; opening_winner=opening['initial_draw_winner']; assert opening['turn']==opening_winner; assert all('Joker' not in x for x in opening['initial_draw'])
                  while ctl.state.get('next_round_phase')!='awaiting_shuffle':
                      s=ctl.state; seat=s['turn']; old=ctl.seq; oldsig=sig(s)
                      if s.get('last_player') is None:
                          assert s['hand_counts'][seat]>0; await cs[seat].send({'type':'play','card_indexes':[0]})
                      else:
                          await cs[seat].send({'type':'pass'})
                      if seat==BOT: bot_actions+=1
                      await ctl.wait(lambda old=old,oldsig=oldsig:ctl.seq>old and sig(ctl.state)!=oldsig)
                      actions+=1; assert actions<4000
                  ended=ctl.state; winner=ended.get('last_game_winner'); order=ended.get('finish_order',[]); first=order[0] if order else None
                  assert first is not None and winner is not None and len(order)==N and ended.get('hand_counts')==[0]*N and bot_actions>0
                  assert winner==first, (winner,first,order)
                  print('MIXED6_END_DIAG',json.dumps({'game':no,'first_finisher':name(first),'server_winner':name(winner),'finish_order':[name(x) for x in order]},ensure_ascii=False))
                  losing_parity=1 if winner%2==0 else 0; losing=next(i for i in range(N) if i%2==losing_parity); old=ctl.seq
                  await cs[losing].send({'type':'shuffle_next_round','from_position':None,'to_position':None}); await ctl.wait(lambda old=old:ctl.seq>old and ctl.state.get('next_round_phase')=='awaiting_deal'); assert ctl.state.get('hand_counts')==[CARDS]*N
                  hs=[c.hand_seq for c in cs]; old=ctl.seq; await cs[winner].send({'type':'deal_next_round'}); await ctl.wait(lambda old=old:ctl.seq>old and ctl.state.get('next_round_phase') is None and ctl.state.get('finish_order')==[]); assert ctl.state.get('turn')==winner
                  for c,h in zip(cs,hs): await c.wait(lambda c=c,h=h:c.hand_seq>h and c.hand is not None and len(c.hand)==CARDS)
                  r={'game':no,'room':room,'actions':actions,'bot_actions':bot_actions,'opening_draw_winner':name(opening_winner),'winner':name(winner),'finish_order':[name(x) for x in order],'next_round_lead':name(ctl.state['turn'])}
                  print('MIXED_6_PLAYER_GAME_OK',json.dumps(r,ensure_ascii=False)); return r
              finally: await asyncio.gather(*(c.close() for c in cs),return_exceptions=True)

          async def main():
              rs=[]
              for n in range(1,4): rs.append(await game(n))
              print('MIXED_6_PLAYER_THREE_GAMES_OK'); print(json.dumps(rs,ensure_ascii=False))
          asyncio.run(main())
          PY
      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/guandan6.log || true
