name: Verify Guandan 5 players plus 1 bot three games

on:
  push:
    branches:
      - feature/guandan-up-to-14-players-20260825
    paths:
      - .github/workflows/verify-guandan-5-human-1-bot-three-games-20260825.yml

permissions:
  contents: read

jobs:
  mixed-six-player-three-games:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guandan-up-to-14-players-20260825
      - name: Install Python websocket client
        run: python -m pip install --quiet 'websockets>=12,<16'
      - name: Start isolated branch backend
        run: |
          PORT=3030 CORS_ALLOWED_ORIGINS='*' cargo run -p shengji --features dynamic > /tmp/guandan6-mixed-backend.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3030/runtime.js >/dev/null 2>&1; then echo LOCAL_BACKEND_READY; exit 0; fi
            sleep 1
          done
          cat /tmp/guandan6-mixed-backend.log
          exit 1
      - name: Run three complete 5-player plus 1-bot games
        run: |
          python - <<'PY'
          import asyncio, json, time, websockets

          URI = 'ws://127.0.0.1:3030/api/guandan'
          PLAYER_COUNT = 6
          BOT_SEAT = 5
          CARDS_PER_PLAYER = 27

          class Client:
              def __init__(self, seat):
                  self.seat = seat
                  self.ws = None
                  self.reader_task = None
                  self.cond = asyncio.Condition()
                  self.connected = False
                  self.joined = None
                  self.waiting = None
                  self.started = None
                  self.state = None
                  self.state_seq = 0
                  self.hand = None
                  self.hand_seq = 0
                  self.error = None

              async def connect(self):
                  self.ws = await websockets.connect(URI, open_timeout=10, max_queue=64)
                  self.reader_task = asyncio.create_task(self._reader())
                  await self.wait_for(lambda c: c.connected)

              async def _reader(self):
                  try:
                      async for raw in self.ws:
                          if isinstance(raw, bytes): raw = raw.decode('utf-8')
                          msg = json.loads(raw)
                          async with self.cond:
                              kind = msg.get('type')
                              if kind == 'connected': self.connected = True
                              elif kind == 'joined': self.joined = msg
                              elif kind == 'waiting': self.waiting = msg
                              elif kind == 'started': self.started = msg
                              elif kind == 'state': self.state = msg; self.state_seq += 1
                              elif kind == 'hand': self.hand = msg.get('cards', []); self.hand_seq += 1
                              elif kind == 'error': self.error = msg.get('message') or 'unknown server error'
                              self.cond.notify_all()
                  except Exception as exc:
                      async with self.cond:
                          if self.error is None: self.error = f'reader stopped: {exc!r}'
                          self.cond.notify_all()

              async def wait_for(self, predicate, timeout=30):
                  async def inner():
                      async with self.cond:
                          await self.cond.wait_for(lambda: self.error is not None or predicate(self))
                          if self.error is not None:
                              raise AssertionError(f'player {self.seat + 1}: {self.error}')
                          return self
                  return await asyncio.wait_for(inner(), timeout=timeout)

              async def send(self, message):
                  await self.ws.send(json.dumps(message, ensure_ascii=False))

              async def close(self):
                  if self.ws is not None: await self.ws.close()
                  if self.reader_task is not None:
                      try: await self.reader_task
                      except Exception: pass

          def signature(state):
              return (
                  state.get('turn'), tuple(state.get('hand_counts', [])),
                  state.get('last_player'),
                  tuple(json.dumps(card, sort_keys=True) for card in state.get('last_play', [])),
                  state.get('passes'), tuple(state.get('finish_order', [])),
                  state.get('next_round_phase'), state.get('last_game_winner')
              )

          async def run_game(game_no):
              room = f'mixed6_g{game_no}_{int(time.time()*1000)}'
              clients = [Client(i) for i in range(PLAYER_COUNT)]
              bot_actions = 0
              try:
                  for client in clients:
                      await client.connect()
                      name = '机器人' if client.seat == BOT_SEAT else f'玩家{client.seat + 1}'
                      await client.send({'type':'join','room':room,'name':name})
                      await client.wait_for(lambda c: c.joined is not None)
                      assert client.joined.get('seat') == client.seat

                  control = clients[0]
                  await control.wait_for(lambda c: c.waiting is not None and len(c.waiting.get('players', [])) == PLAYER_COUNT)
                  await control.send({'type':'start','player_count':PLAYER_COUNT})

                  for client in clients:
                      await client.wait_for(lambda c: c.started is not None and c.started.get('player_count') == PLAYER_COUNT)
                      await client.wait_for(lambda c: c.state is not None and len(c.state.get('initial_draw', [])) == PLAYER_COUNT)
                      await client.wait_for(lambda c: c.hand is not None and len(c.hand) == CARDS_PER_PLAYER)

                  opening = control.state
                  opening_winner = opening['initial_draw_winner']
                  assert opening['turn'] == opening_winner
                  assert all('Joker' not in card for card in opening['initial_draw'])

                  first_finisher = None
                  actions = 0
                  while True:
                      state = control.state
                      if state.get('next_round_phase') == 'awaiting_shuffle': break
                      assert actions < 4000, f'game {game_no} exceeded action limit'
                      seq = control.state_seq
                      sig = signature(state)
                      seat = state['turn']
                      if state.get('last_player') is None:
                          before = state['hand_counts'][seat]
                          assert before > 0
                          await clients[seat].send({'type':'play','card_indexes':[0]})
                          if seat == BOT_SEAT: bot_actions += 1
                          await control.wait_for(lambda c, s=seq, g=sig: c.state_seq > s and signature(c.state) != g)
                          if before == 1 and first_finisher is None: first_finisher = seat
                      else:
                          await clients[seat].send({'type':'pass'})
                          if seat == BOT_SEAT: bot_actions += 1
                          await control.wait_for(lambda c, s=seq, g=sig: c.state_seq > s and signature(c.state) != g)
                      actions += 1

                  ended = control.state
                  assert first_finisher is not None
                  assert ended.get('last_game_winner') == first_finisher
                  assert len(ended.get('finish_order', [])) == PLAYER_COUNT
                  assert ended.get('finish_order', [None])[0] == first_finisher
                  assert ended.get('hand_counts') == [0] * PLAYER_COUNT
                  assert bot_actions > 0

                  losing_parity = 1 if first_finisher % 2 == 0 else 0
                  losing_seat = next(i for i in range(PLAYER_COUNT) if i % 2 == losing_parity)
                  shuffle_seq = control.state_seq
                  await clients[losing_seat].send({'type':'shuffle_next_round','from_position':None,'to_position':None})
                  await control.wait_for(lambda c, s=shuffle_seq: c.state_seq > s and c.state.get('next_round_phase') == 'awaiting_deal')
                  assert control.state.get('hand_counts') == [CARDS_PER_PLAYER] * PLAYER_COUNT

                  hand_seqs = [c.hand_seq for c in clients]
                  deal_seq = control.state_seq
                  await clients[first_finisher].send({'type':'deal_next_round'})
                  await control.wait_for(lambda c, s=deal_seq: c.state_seq > s and c.state.get('next_round_phase') is None and c.state.get('finish_order') == [])
                  assert control.state.get('turn') == first_finisher
                  for client, old in zip(clients, hand_seqs):
                      await client.wait_for(lambda c, old=old: c.hand_seq > old and c.hand is not None and len(c.hand) == CARDS_PER_PLAYER)

                  result = {
                      'game': game_no,
                      'room': room,
                      'actions': actions,
                      'bot_actions': bot_actions,
                      'opening_draw_winner': '机器人' if opening_winner == BOT_SEAT else f'玩家{opening_winner+1}',
                      'winner': '机器人' if first_finisher == BOT_SEAT else f'玩家{first_finisher+1}',
                      'finish_order': ['机器人' if s == BOT_SEAT else f'玩家{s+1}' for s in ended['finish_order']],
                      'next_round_lead': '机器人' if first_finisher == BOT_SEAT else f'玩家{first_finisher+1}'
                  }
                  print('MIXED_6_PLAYER_GAME_OK', json.dumps(result, ensure_ascii=False))
                  return result
              finally:
                  await asyncio.gather(*(c.close() for c in clients), return_exceptions=True)

          async def main():
              results = []
              for game_no in range(1, 4):
                  results.append(await run_game(game_no))
              print('MIXED_6_PLAYER_THREE_GAMES_OK')
              print(json.dumps(results, ensure_ascii=False))

          asyncio.run(main())
          PY
      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/guandan6-mixed-backend.log || true
