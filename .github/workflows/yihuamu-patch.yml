name: Apply YihuaMu four-deck follow rule

on:
  push:
    branches:
      - agent/yihuamu-four-deck-follow-rule
    paths:
      - .github/workflows/yihuamu-patch.yml
      - .github/scripts/yihuamu_patch.py

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/yihuamu-four-deck-follow-rule

      - name: Apply rule patch
        run: python3 .github/scripts/yihuamu_patch.py

      - name: Format
        run: cargo fmt --all

      - name: Test YihuaMu rule
        run: cargo test -p shengji-mechanics yihuamu_four_deck -- --nocapture

      - name: Check core integration
        run: cargo check -p shengji-core

      - name: Commit tested code
        shell: bash
        run: |
          git config user.name "YihuaMu Rule Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/yihuamu-patch.yml .github/scripts/yihuamu_patch.py
          git add mechanics/src/trick.rs core/src/game_state/play_phase.rs
          git commit -m "Relax pair follow rule for YihuaMu four-deck games"
          git push origin HEAD:agent/yihuamu-four-deck-follow-rule
