name: One-time Guandan Prettier Repair
on:
  push:
    branches:
      - preview/guandan-room-presence-fix-20261001
    paths:
      - .github/workflows/guandan-prettier-repair-20261008.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-three-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install pinned Prettier
        run: yarn install --frozen-lockfile
        working-directory: frontend
      - name: Format only the three failing files
        run: |
          test "$(./node_modules/.bin/prettier --version)" = "3.4.1"
          ./node_modules/.bin/prettier --write \
            src/guandan-approved-layout.css \
            src/guandanMatchCelebration.test.ts \
            src/GuandanTable.tsx
          ./node_modules/.bin/prettier --check \
            src/guandan-approved-layout.css \
            src/guandanMatchCelebration.test.ts \
            src/GuandanTable.tsx
        working-directory: frontend
      - name: Commit and push formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/guandan-approved-layout.css frontend/src/guandanMatchCelebration.test.ts frontend/src/GuandanTable.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "style: apply Prettier 3.4.1 to three Guandan frontend files"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
