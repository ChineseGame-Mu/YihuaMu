name: Task 1 Mandatory Guandan QA x3

on:
  pull_request:
    branches: [cleanroom/yihua-game-20260826]
  push:
    branches: [cleanroom/yihua-game-20260826]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task1-mandatory-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  task1-mandatory-qa:
    name: Mandatory QA pass ${{ matrix.pass }} of 3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        pass: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: yihua-game/package-lock.json

      - name: Mandatory task-one source contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const table = fs.readFileSync("frontend/src/GuandanTable.tsx", "utf8");
          const entry = fs.readFileSync("frontend/src/CleanroomEntry.tsx", "utf8");
          const css = fs.readFileSync("frontend/src/guandan-real-test-20260916.css", "utf8");
          const handStackCss = fs.readFileSync("frontend/src/cleanroom-hand-stack-fix.css", "utf8");
          const handLayout = fs.readFileSync("frontend/src/guandanHandLayout.ts", "utf8");
          const autoArrange = fs.readFileSync("frontend/src/guandanAutoArrange.ts", "utf8");
          const fixes = fs.readFileSync("frontend/src/guandanRealTestFixes.ts", "utf8");
          const tribute = fs.readFileSync("yihua-game/test/legacy-tribute-four-client-acceptance.test.ts", "utf8");
          const tributePlan = fs.readFileSync("yihua-game/test/legacy-tribute-plan.test.ts", "utf8");
          const trickClear = fs.readFileSync("yihua-game/test/legacy-trick-clear-compat.test.ts", "utf8");
          const steelPlate = fs.readFileSync("yihua-game/test/steel-plate-222333-regression.test.ts", "utf8");
          const robot = fs.readFileSync("yihua-game/test/robot-teammate-yield.test.ts", "utf8");
          const robotStrategy = fs.readFileSync("yihua-game/test/robot-strategy.test.ts", "utf8");
          const robotNextRound = fs.readFileSync("yihua-game/test/legacy-robot-next-round.test.ts", "utf8");
          const participation = fs.readFileSync("yihua-game/test/round-participation-rotation.test.ts", "utf8");
          const spectatorFlow = fs.readFileSync("yihua-game/test/legacy-spectator-next-round.test.ts", "utf8");
          const secondRound = fs.readFileSync("yihua-game/test/legacy-second-round-four-human.test.ts", "utf8");
          const diamond = fs.readFileSync("frontend/src/generated/playing-cards-4color/Ad.tsx", "utf8");
          const playerScale = fs.readFileSync("frontend/src/guandan-player-display-scale.css", "utf8");
          const approvedLayout = fs.readFileSync("frontend/src/guandan-approved-layout.css", "utf8");
          const actionControls = fs.readFileSync("frontend/src/GuandanCustomSortControls.tsx", "utf8");
          const roomSource = fs.readFileSync("yihua-game/src/core/room.ts", "utf8");
          const roomManager = fs.readFileSync("yihua-game/src/core/room-manager.ts", "utf8");
          const frontendCompat = fs.readFileSync("yihua-game/src/core/frontend-compat.ts", "utf8");
          const frontendCompatTest = fs.readFileSync("yihua-game/test/frontend-compat.test.ts", "utf8");
          const competition = fs.readFileSync("yihua-game/src/core/competition.ts", "utf8");
          const competitionTest = fs.readFileSync("yihua-game/test/competition.test.ts", "utf8");
          const frontendPromotion = fs.readFileSync("frontend/src/guandanPromotion.ts", "utf8");
          const frontendPromotionTest = fs.readFileSync("frontend/src/guandanPromotion.test.ts", "utf8");
          const competitionSeries = fs.readFileSync("yihua-game/src/core/competition-series.ts", "utf8");
          const music = fs.readFileSync("frontend/src/guandanMusic.ts", "utf8");
          const celebration = fs.readFileSync("frontend/src/guandanMatchCelebration.ts", "utf8");
          const celebrationCss = fs.readFileSync("frontend/src/guandan-match-celebration.css", "utf8");
          const legacyGateway = fs.readFileSync("yihua-game/src/core/legacy-guandan-gateway.ts", "utf8");
          const nodeServer = fs.readFileSync("yihua-game/src/node-server.ts", "utf8");
          const nodeWebsocket = fs.readFileSync("yihua-game/src/node-websocket.ts", "utf8");
          const playerSession = fs.readFileSync("yihua-game/src/core/player-session.ts", "utf8");
          const playerSessionTest = fs.readFileSync("yihua-game/test/player-session-security.test.ts", "utf8");
          const guandanWebsocketProvider = fs.readFileSync("frontend/src/GuandanWebsocketProvider.tsx", "utf8");
          const protocol = fs.readFileSync("yihua-game/src/core/protocol.ts", "utf8");
          const vercelConfig = fs.readFileSync("frontend/vercel.json", "utf8");

          const contracts = [
            ["public player name renders", /state\.players\[play\.player\]/.test(table)],
            ["player name follows public cards", /guandan-table-play[\s\S]*?<\/span>[\s\S]*?<\/div>/.test(table)],
            ["legacy hidden-name CSS is overridden", /html body \.guandan-table \.guandan-trick-play > strong[\s\S]*?display:\s*block\s*!important/.test(css)],
            ["name visibility is forced", /visibility:\s*visible\s*!important/.test(css) && /opacity:\s*1\s*!important/.test(css)],
            ["public play names use two stable team colors", /play\.player % 2 === 0 \? "a" : "b"/.test(table) && /\.guandan-trick-play\.guandan-public-team-a[\s\S]*?background:\s*#f4a6c1\s*!important/.test(css) && /\.guandan-trick-play\.guandan-public-team-b[\s\S]*?background:\s*#5156d9\s*!important/.test(css)],
            ["public cards sort small to large", /sortPlayCards\(play\.cards, message\.level\)/.test(fixes)],
            ["authoritative clear is preserved", /message\.table_plays\.length === 0 && message\.last_play\.length === 0/.test(fixes)],
            ["settings offer manual or automatic pattern arranging", /guandan-hand-arrange-mode/.test(table) && /手动（按点数排列）/.test(table) && /自动组牌（顺子、钢板等）/.test(table) && /autoArrangeGuandanHand/.test(autoArrange) && /Straight flushes first/.test(autoArrange)],
            ["current-turn display names every passer", /passedPlayers\.length > 0/.test(table) && /guandan-current-pass-list/.test(table) && /passed_players/.test(frontendCompat)],
            ["six-player reconnect immediately restores the current play", /this\.gameState !== undefined/.test(legacyGateway) && /decoratedState\.table_plays/.test(legacyGateway) && /shows an existing opening play immediately to a late sixth client/.test(trickClear)],
            ["stale trick snapshots cannot restore collected cards", /staleTableSnapshot/.test(fixes) && /nextTableClearId < state\.tableClearId/.test(fs.readFileSync("frontend/src/guandanCompatibilityAdapter.ts", "utf8"))],
            ["finished hand is cleared", /shouldClearOwnHand\(adapted\.seat, message\.finish_order\)/.test(fixes)],
            ["duplicate upper-right level HUD stays removed", !/GuandanLastRoundScoreboard/.test(entry)],
            ["personal hand stack direction setting exists", /guandan-hand-stack-direction/.test(table) && /纵向排列/.test(table) && /guandan_hand_stack_direction/.test(table) && /guandan-hand-stack-horizontal/.test(handStackCss)],
            ["tribute four-client acceptance exists", /tribute -> all four see -> return -> all four see/.test(tribute)],
            ["tribute must finish before return", /tribute_phase\)\.toBe\("tribute"\)/.test(tribute) && /tribute_phase\)\.toBe\("return"\)/.test(tribute) && /prematureReturnStart/.test(tribute)],
            ["exact tribute card is public", /tribute_cards\)\.toEqual/.test(tribute) && /state\.tributeCards\.map/.test(table) && /进贡：/.test(table)],
            ["only winners return tribute and resistance gives winner the lead", /losingPlayerReturnStart/.test(tribute) && /previous first-place winner the lead/.test(tributePlan) && /抗贡（\{effectiveTableSize \/ 2\} 张大王）/.test(table)],
            ["anti-tribute scales from two to seven big jokers", /4, 6, 8, 10, 12, 14/.test(tributePlan) && /requiredBigJokers/.test(fs.readFileSync("yihua-game/src/core/legacy-tribute.ts", "utf8"))],
            ["every collected trick has an authoritative clear id", /table_clear_id\)\.toBe\(1\)/.test(trickClear) && /table_clear_id\)\.toBe\(2\)/.test(trickClear) && /tableWasAuthoritativelyCleared/.test(fixes)],
            ["low ace-two sequences are accepted", /222333 steel-plate live regression/.test(steelPlate) && /steelAAA222/.test(steelPlate) && /pairsAA2233/.test(steelPlate) && /wheelA2345/.test(steelPlate) && /straight23456/.test(steelPlate) && /straightFlushA2345/.test(steelPlate) && /straightFlush23456/.test(steelPlate) && /playGameCardIds/.test(steelPlate)],
            ["loser leads after exchange", /expect\(finalized\.game\.currentTurn\)\.toBe\(giver\)/.test(tribute)],
            ["largest tribute payer leads and equal cards follow display order", /gives the lead to the largest tribute payer/.test(tributePlan) && /breaks equal tribute ties by left-to-right player display order/.test(tributePlan) && /left\.player - right\.player/.test(fs.readFileSync("yihua-game/src/core/legacy-tribute.ts", "utf8"))],
            ["robot applies Guandan handbook tactics across 4-14 players", /robotMustYieldToTeammate/.test(robot) && /\[4, 6, 8, 10, 12, 14\]/.test(robot) && /five-card combination/.test(robotStrategy) && /opponent is about to finish/.test(robotStrategy) && /threatening straight/.test(robotStrategy) && /handSizeBefore/.test(fs.readFileSync("yihua-game/src/core/robot-strategy.ts", "utf8")) && /opponentMinHandSize/.test(fs.readFileSync("yihua-game/src/core/robot-strategy.ts", "utf8"))],
            ["robots continue next round and exchange tribute", /robot loser pays tribute and robot winner returns a card automatically/.test(robotNextRound)],
            ["optional partner selector exists", /选择搭档（可选）/.test(table) && /preferred_partner/.test(table)],
            ["spectators may join the next round", /加入下一轮/.test(table) && /keeps a late arrival observing/.test(participation) && /legacy spectator next-round entry/.test(spectatorFlow)],
            ["departing players receive robot replacements", /本局结束后退出（机器人替补）/.test(table) && /fills the exact seat with a robot/.test(participation)],
            ["second round carries promoted level", /expect\(dealt\.game\.levelRank\)\.toBe\("4"\)/.test(secondRound) && /latest\("state"\)\.level\)\.toBe\("Four"\)/.test(secondRound)],
            ["second round restores every private hand", /latest\("hand"\)\.cards\)\.toHaveLength\(27\)/.test(secondRound) && /never discard a newly dealt hand/.test(fixes)],
            ["opening draw appears only in the first round", /initial_draw\)\.toHaveLength\(4\)/.test(secondRound) && /initial_draw\)\.toEqual\(\[\]\)/.test(secondRound) && /initial_draw_winner\)\.toBeNull/.test(secondRound)],
            ["tribute completion opens the loser lead", /errorsSince\(playStart\)\)\.toEqual\(\[\]\)/.test(secondRound) && /startedLegacyGames\.add\(roomId\)/.test(fs.readFileSync("yihua-game/src/core/legacy-guandan-gateway.ts", "utf8"))],
            ["four-color diamond is orange", /#f5a623/.test(diamond) && !/#00f/.test(diamond)],
            ["four-color label names orange", /四色（黑 \/ 红 \/ 橘黄 \/ 绿）/.test(table)],
            ["public player displays are doubled without gaps", /flex:\s*0 0 96px\s*!important/.test(playerScale) && /gap:\s*0\s*!important/.test(playerScale) && /\.guandan-public-card-back[\s\S]*?width:\s*96px\s*!important/.test(playerScale) && /\.guandan-public-card-back[\s\S]*?margin:\s*0\s*!important/.test(playerScale)],
            ["enlarged displays never cover played cards", /\.guandan-table-stage[\s\S]*?padding-top:\s*154px\s*!important/.test(playerScale)],
            ["current-turn display is doubled", /min-width:\s*300px\s*!important/.test(playerScale) && /font-size:\s*28px\s*!important/.test(playerScale)],
            ["current-turn display stays at the bottom of the right play area", /right:\s*14px\s*!important/.test(playerScale) && /left:\s*auto\s*!important/.test(playerScale) && /bottom:\s*14px\s*!important/.test(playerScale)],
            ["public table expands while my table shrinks by one quarter", /grid-template-rows:\s*auto\s+minmax\(0,\s*5fr\)\s+minmax\(0,\s*3fr\)\s*!important/.test(approvedLayout)],
            ["review panel shrinks twenty percent while both tables extend", /grid-template-columns:\s*minmax\(0,\s*4fr\)\s+minmax\(224px,\s*1fr\)\s*!important/.test(approvedLayout) && /@media \(max-width:\s*760px\)[\s\S]*?grid-template-columns:\s*minmax\(0,\s*4fr\)\s+minmax\(144px,\s*1fr\)\s*!important/.test(approvedLayout)],
            ["every dealt private card remains inside my table", /privateHandStackProgress\(stackIndex,\s*stack\.length\)\s*\*\s*100/.test(table) && /privateHandStackProgress\(stackIndex,\s*stack\.length\)\s*\*\s*-100/.test(table) && /stackIndex\s*\/\s*\(stackSize\s*-\s*1\)/.test(handLayout) && /container-type:\s*size\s*!important/.test(handStackCss) && /top:\s*var\(--guandan-stack-progress\)\s*!important/.test(handStackCss) && /translate:\s*0\s+var\(--guandan-stack-offset\)\s*!important/.test(handStackCss)],
            ["winning on the winner team's A ends the match and continue uses a fresh opening draw", /completedWinnerLevel === "A"/.test(roomManager) && /completed\.teamLevels/.test(roomManager) && /startGame\([\s\S]*?createLobbyState/.test(roomManager) && /winnerLevel === "A"/.test(frontendCompat) && /match_winner:\s*matchWinner/.test(frontendCompat) && /type:\s*"restart_match"/.test(table) && />\s*继续\s*</.test(table)],
            ["PDF 6-14 player scoring tables are enforced on server and client", /playerCount === 6/.test(competition) && /playerCount === 8/.test(competition) && /leadingHalf \+ 1/.test(competition) && /6-14 player scoring tables/.test(competitionTest) && /playerCount === 6/.test(frontendPromotion) && /playerCount === 8/.test(frontendPromotion) && /leadingHalf \+ 1/.test(frontendPromotion) && /6-14 player Guandan scoring/.test(frontendPromotionTest)],
            ["6-14 player Team B one-point win immediately displays level three", /displayedLevelRank/.test(frontendCompat) && /game\.phase !== "round-complete"/.test(frontendCompat) && /\[6, 8, 10, 12, 14\]/.test(frontendCompatTest) && /shows level 3 immediately after Team B earns one point/.test(frontendCompatTest) && /legacy\.level\)\.toBe\("Three"\)/.test(frontendCompatTest) && /last_game_winner_team\)\.toBe\("TeamB"\)/.test(frontendCompatTest)],
            ["6-14 player formats run exactly three complete 2-to-A matches", /playerCount === 6/.test(competitionSeries) && /playerCount === 14/.test(competitionSeries) && /COMPETITION_SERIES_MATCHES\s*=\s*3/.test(competitionSeries) && /runs exactly three complete 2-to-A matches/.test(fs.readFileSync("yihua-game/test/competition-match-progression.test.ts", "utf8")) && /aria-label="三局赛进度"/.test(table) && /三局比赛全部结束/.test(table)],
            ["settings offer optional synthesized atmosphere music", /guandan-music-mode/.test(table) && /轻松气氛器乐/.test(table) && /中国民乐/.test(table) && /AudioContext/.test(music) && !/https?:\/\//.test(music)],
            ["A-level winners receive a ten-second full-screen trophy and fireworks finale", /GUANDAN_MATCH_CELEBRATION_MS\s*=\s*10_000/.test(celebration) && /winningTeamPlayerNames/.test(table) && /celebrationFireworks\.map/.test(table) && /guandan-match-trophy/.test(table) && /guandan-fireworks/.test(table) && /guandan-match-celebrating/.test(table) && /继续/.test(table) && /退出/.test(table) && /\.guandan-match-complete-panel\.guandan-match-celebrating/.test(celebrationCss) && /guandan-firework-burst/.test(celebrationCss)],
            ["celebration shows a live date and time updated every second", /formatCelebrationDateTime/.test(celebration) && /guandan-match-celebration-time/.test(table) && /庆祝时间：/.test(table) && /setInterval\([\s\S]*?1000\)/.test(table) && /guandan-match-celebration-time/.test(celebrationCss)],
            ["test-only online celebration preview supports screenshot verification", /initial\.get\("test"\) === "1"/.test(entry) && /initial\.get\("celebrationPreview"\) === "1"/.test(entry) && /A级获胜全屏庆祝效果预览/.test(entry) && /celebrationFireworks\.map/.test(entry)],
            ["settings provide winner screenshot email and one robot count selector", /guandan-winner-screenshot-email/.test(table) && /guandan_winner_screenshot_email/.test(table) && /type="email"/.test(table) && /id="guandan-bot-count"/.test(table) && /机器人玩家数量/.test(table) && /\[1, 2, 3\]\.map/.test(table) && !/\{count\} 个机器人/.test(table)],
            ["robots cannot skip the A-level finale", /advanceLegacyRobotNextRound[\s\S]*?phase === "round-complete"[\s\S]*?levelRank === "A"/.test(legacyGateway)],
            ["each player display embeds left observe right controls", /\$\{player\}向左换位/.test(table) && /\$\{player\}切换参与或旁观/.test(table) && /\$\{player\}向右换位/.test(table) && /\.guandan-public-card-back\s*\{[\s\S]*?position:\s*relative\s*!important/.test(playerScale) && /\.guandan-public-seat-move-controls\s*\{[\s\S]*?position:\s*absolute\s*!important[\s\S]*?bottom:\s*0\s*!important/.test(playerScale) && /width:\s*32px\s*!important/.test(playerScale)],
            ["players can securely move themselves or toggle participation", /moveMySeat/.test(table) && /toggleMyParticipation/.test(table) && /setLobbyParticipation/.test(roomSource) && /moves a lobby player down to observe and back into the same robot seat/.test(participation) && /moves the requesting player one seat left or right/.test(spectatorFlow)],
            ["tribute action cannot be covered by ordinary play", /!tributePending\s*&&\s*\(/.test(table) && /className="guandan-tribute-action"/.test(table) && /sendSingleSelected\("tribute_card"\)/.test(table) && /sendSingleSelected\("return_tribute"\)/.test(table) && />\.guandan-tribute-action,[\s\S]*?width:auto!important/.test(actionControls) && !/button:nth-last-of-type/.test(actionControls)],
            ["HTTP requests and responses have mandatory safety limits", /MAX_JSON_BODY_BYTES\s*=\s*64 \* 1024/.test(nodeServer) && /RequestLimitError/.test(nodeServer) && /x-content-type-options/.test(nodeServer) && /x-frame-options/.test(nodeServer)],
            ["WebSocket memory and queue growth are bounded", /MAX_INCOMING_BUFFER_BYTES\s*=\s*2 \* 1024 \* 1024/.test(nodeWebsocket) && /MAX_QUEUED_TEXT_FRAMES\s*=\s*128/.test(nodeWebsocket)],
            ["player reconnects require a signed room-bound session", /createHmac\("sha256"/.test(playerSession) && /timingSafeEqual/.test(playerSession) && /resume token is required/.test(legacyGateway) && /rejects same-name takeover/.test(playerSessionTest) && /sessionStorage/.test(guandanWebsocketProvider)],
            ["production WebSockets require an exact trusted origin", /isAllowedWebSocketOrigin/.test(nodeServer) && /parsed\.origin !== origin/.test(nodeServer) && /websocket origin is not allowed/.test(nodeServer)],
            ["client protocol strings and arrays are bounded", /MAX_ROOM_ID_LENGTH\s*=\s*64/.test(protocol) && /MAX_PLAY_CARD_IDS\s*=\s*64/.test(protocol) && /MAX_NONCE_LENGTH\s*=\s*256/.test(protocol)],
            ["Vercel frontend sends browser security headers", /X-Content-Type-Options/.test(vercelConfig) && /X-Frame-Options/.test(vercelConfig) && /Content-Security-Policy/.test(vercelConfig) && /frame-ancestors 'none'/.test(vercelConfig)],
          ];

          const failed = contracts.filter(([, ok]) => !ok).map(([name]) => name);
          if (failed.length) throw new Error(`mandatory task-one contracts missing: ${failed.join(", ")}`);
          console.log(JSON.stringify({type:"task1_source_contracts_pass", pass: process.env.QA_PASS, contracts: contracts.map(([name]) => name)}));
          NODE
        env:
          QA_PASS: ${{ matrix.pass }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: yarn build

      - name: Audit production frontend dependencies
        working-directory: frontend
        run: yarn audit --groups dependencies --level high

      - name: Run mandatory frontend regressions
        working-directory: frontend
        run: >
          yarn test --runInBand
          src/guandanPublicPlayNameCss.test.ts
          src/guandanFourColorPalette.test.ts
          src/guandanRealTestFixes.test.ts
          src/guandanAutoArrange.test.ts
          src/guandanCurrentTrickPlays.test.ts
          src/GuandanStateProvider.test.ts
          src/GuandanLastRoundScoreboard.test.tsx
          src/GuandanRoundResultHud.test.tsx
          src/guandanPromotion.test.ts
          src/guandanReturnTributePrivacy.test.ts
          src/guandanPlayerDisplayScale.test.ts
          src/guandanHandLayout.test.ts
          src/guandanMusic.test.ts
          src/guandanMatchCelebration.test.ts
          src/guandanTributeActionVisibility.test.ts
          src/securityHeaders.test.ts

      - name: Install game-server dependencies
        working-directory: yihua-game
        run: npm ci

      - name: Typecheck game server
        working-directory: yihua-game
        run: npm run typecheck

      - name: Audit production game-server dependencies
        working-directory: yihua-game
        run: npm audit --omit=dev --audit-level=high

      - name: Run mandatory backend regressions
        working-directory: yihua-game
        run: >
          npx vitest run
          test/legacy-tribute-four-client-acceptance.test.ts
          test/legacy-tribute-plan.test.ts
          test/legacy-trick-clear-compat.test.ts
          test/frontend-compat.test.ts
          test/steel-plate-222333-regression.test.ts
          test/legacy-next-round-compat.test.ts
          test/competition-match-progression.test.ts
          test/competition.test.ts
          test/legacy-next-round-role.test.ts
          test/legacy-robot-next-round.test.ts
          test/round-participation-rotation.test.ts
          test/legacy-spectator-next-round.test.ts
          test/legacy-second-round-four-human.test.ts
          test/robot-teammate-yield.test.ts
          test/robot-strategy.test.ts
          test/player-session-security.test.ts
          test/security-guardrails.test.ts

      - name: Record successful pass
        run: echo "Task 1 mandatory QA pass ${{ matrix.pass }} of 3 succeeded for ${{ github.sha }}"
