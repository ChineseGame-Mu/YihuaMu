name: Diagnose Live Guandan Room Status
on:
  push:
    branches:
      - diagnostic/guandan-room-status-20261009
    paths:
      - .github/workflows/diagnose-room-status-20261009.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check live backend status and CORS
        shell: bash
        run: |
          set +e
          for path in /health /api/guandan/rooms; do
            echo "==== $path ===="
            curl -sS --max-time 15 -D /tmp/headers -o /tmp/body -w 'http=%{http_code} time=%{time_total} content_type=%{content_type}\n' \
              -H 'Origin: https://yihua-mu.vercel.app' \
              "https://card-games-yihua.onrender.com$path"
            echo "curl_exit=$?"
            sed -n '1,35p' /tmp/headers
            head -c 800 /tmp/body
            echo
          done
      - name: Check Vercel frontend response
        shell: bash
        run: |
          curl -sSI --max-time 15 https://yihua-mu.vercel.app/ | head -n 25
      - name: Check real Chromium browser room status
        shell: bash
        run: |
          set +e
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "browser=$CHROME"
          timeout 40s "$CHROME" --headless=new --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --disable-background-networking \
            --virtual-time-budget=13000 --enable-logging=stderr --log-level=0 \
            --dump-dom 'https://yihua-mu.vercel.app/' > /tmp/room-dom.txt 2>/tmp/room-browser-errors.txt
          echo "exit=$?"
          grep -oE '000[1-9]（[^）]+）|0010（[^）]+）' /tmp/room-dom.txt | head -n 12 || true
          echo "BROWSER ERRORS"
          grep -iE 'cors|content.security|blocked|failed|exception|error|net::|access.control' /tmp/room-browser-errors.txt | head -n 35 || true
      - name: Verify patched preview room status in Chromium
        shell: bash
        run: |
          set +e
          URL='https://yihua-iizpil1x5-chinese-game.vercel.app/'
          timeout 40s google-chrome --headless=new --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --virtual-time-budget=13000 \
            --dump-dom "$URL" > /tmp/preview-room-dom.txt 2>/tmp/preview-room-errors.txt
          echo "exit=$?"
          grep -oE '000[1-9]（[^）]+）|0010（[^）]+）' /tmp/preview-room-dom.txt | head -n 12 || true
          echo "Preview browser JS errors:"
          grep -iE 'Uncaught|CONSOLE.*Error|CORS|blocked by|net::ERR' /tmp/preview-room-errors.txt | head -n 20 || true
