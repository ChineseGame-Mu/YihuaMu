name: Fix Guandan diamond orange-yellow

on:
  push:
    branches:
      - fix/guandan-teammate-aware-ai-20260916
    paths:
      - .github/workflows/fix-guandan-diamond-orange-20260916.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guandan-teammate-aware-ai-20260916
          fetch-depth: 0

      - name: Restore orange-yellow diamond suit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("frontend/src/generated/playing-cards-4color")
          diamonds = [
              "2D.tsx", "3D.tsx", "4D.tsx", "5D.tsx", "6D.tsx", "7D.tsx",
              "8D.tsx", "9D.tsx", "Td.tsx", "Jd.tsx", "Qd.tsx", "Kd.tsx", "Ad.tsx",
          ]
          orange = "#f5a623"

          for name in diamonds:
              path = root / name
              text = path.read_text()
              count = text.count("#00f")
              if count < 2:
                  raise SystemExit(f"{name}: expected at least two blue diamond/rank markers, found {count}")
              path.write_text(text.replace("#00f", orange))

          for name in diamonds:
              text = (root / name).read_text()
              if "#00f" in text:
                  raise SystemExit(f"{name}: blue diamond marker remains")
              if orange not in text:
                  raise SystemExit(f"{name}: orange-yellow marker missing")

          clubs = (root / "Ac.tsx").read_text()
          if 'stroke="green"' not in clubs or 'fill="green"' not in clubs:
              raise SystemExit("club color standard changed unexpectedly")
          PY

      - name: Commit source-level color fix and clean one-shot workflows
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/generated/playing-cards-4color
          git rm -f .github/workflows/fix-guandan-teammate-aware-bots-20260916.yml
          git rm -f .github/workflows/fix-guandan-diamond-orange-20260916.yml
          git commit -m "fix: restore orange-yellow Guandan diamonds"
          git push origin HEAD:fix/guandan-teammate-aware-ai-20260916
