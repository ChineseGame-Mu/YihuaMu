name: Enable expanded Guandan robot players

on:
  push:
    branches:
      - feature/guandan-up-to-14-players-20260825
    paths:
      - .github/workflows/enable-expanded-guandan-bots-20260825.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guandan-up-to-14-players-20260825
          fetch-depth: 0
      - name: Add random robot turn delay
        run: |
          python3 - <<'PY'
          from pathlib import Path

          backend = Path('backend/src/guandan_handler.rs')
          s = backend.read_text()
          if 'gen_range(800..=1800)' not in s:
              s = s.replace(
                  'use rand::thread_rng;',
                  'use rand::{thread_rng, Rng};',
                  1,
              )
              s = s.replace(
                  'use std::{collections::HashMap, fmt, sync::Mutex};',
                  'use std::{collections::HashMap, fmt, sync::Mutex, thread, time::Duration};',
                  1,
              )
              anchor = '''        if !game\n            .player_names\n            .get(seat)\n            .is_some_and(|name| is_robot_name(name))\n        {\n            break;\n        }\n'''
              if anchor not in s:
                  raise SystemExit('robot turn anchor not found')
              s = s.replace(
                  anchor,
                  anchor + '''        let delay_ms = thread_rng().gen_range(800..=1800);\n        thread::sleep(Duration::from_millis(delay_ms));\n''',
                  1,
              )
          backend.write_text(s)
          PY
      - name: Format and test Rust
        run: |
          mkdir -p frontend/dist
          cargo fmt --all
          cargo test -p shengji guandan --quiet
      - name: Commit robot delay
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/guandan_handler.rs
          git diff --cached --quiet && exit 0
          git commit -m 'feat(guandan): add random robot turn delay'
          git push origin HEAD:feature/guandan-up-to-14-players-20260825
