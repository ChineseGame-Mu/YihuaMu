name: Update Guandan mini displays

on:
  push:
    branches:
      - fix/guandan-single-viewport-20260822
    paths:
      - .github/workflows/guandan-first-draw-mini-20260825.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guandan-single-viewport-20260822
          fetch-depth: 0

      - name: Move both mini screens to public-table top right
        run: |
          cat >> frontend/src/guandan-single-viewport.css <<'EOF'

          /* 2026-08-25 final mini-screen placement: public-table upper-right. */
          .guandan-round-winner-mini {
            top: 34px !important;
            right: 10px !important;
            left: auto !important;
          }
          .guandan-initial-draw-mini {
            top: 82px !important;
            right: 10px !important;
            left: auto !important;
          }
          EOF

      - name: Exclude jokers from opening draw
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/src/guandan_handler.rs')
          s = p.read_text()
          old = '''        let draw = deck
            .iter()
            .copied()
            .take(GUANDAN_PLAYER_COUNT)
            .collect::<Vec<_>>();'''
          new = '''        let draw = deck
            .iter()
            .copied()
            .filter(|card| !matches!(card, CardFace::Joker(_)))
            .take(GUANDAN_PLAYER_COUNT)
            .collect::<Vec<_>>();'''
          if old not in s:
              raise SystemExit('opening draw anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build frontend
        run: |
          corepack enable
          cd frontend
          yarn install --frozen-lockfile
          yarn prettier --write src/guandan-single-viewport.css
          yarn build

      - name: Test backend
        run: |
          cargo fmt --all
          cargo test -p shengji guandan --quiet

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/guandan-single-viewport.css backend/src/guandan_handler.rs
          git commit -m "fix(guandan): top-right mini screens and no jokers in opening draw"
          git push origin HEAD:fix/guandan-single-viewport-20260822
